 (data, response) = try await session.data(for: request, delegate: nil)\n    return try decodeChapter(data: data, response: response)","alt"],["urls.s2","let result = try await session.data(for: request)\nreturn try decodeChapter(data: result.0, response: result.1)\n\nЗапрос возвращает пару, беру её части по индексам.","alt"],["urls.s2","let (data, response) = try await session.data(from: url)\nreturn try decodeChapter(data: data, response: response)","near"],["urls.s2","let (data, response) = try await session.data(for: request)\nreturn try JSONDecoder().decode(Chapter.self, from: data)\n\nЖдём ответ и декодируем тело.","near"],["urls.s2","let (data, response) = try session.data(for: request)\nreturn try decodeChapter(data: data, response: response)","novice"],["urls.s2","let (data, response) = try await session.data(for: request)\nreturn decodeChapter(data: data, response: response)","novice"],["urls.s2","let (data, response) = (Data(), URLResponse())\nreturn Chapter(id: id, title: \"Первый снег\")","wrong"],["urls.s3","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n  guard let http = response as? HTTPURLResponse else {\n    throw LoadError.notHTTP\n  }\n  guard http.statusCode == 200 else {\n    throw LoadError.status(http.statusCode)\n  }\n\n  return try JSONDecoder().decode(Chapter.self, from: data)\n}","same"],["urls.s3","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\n    if http.statusCode != 200 { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\n\nСначала HTTP, потом статус, потом JSON.","alt"],["urls.s3","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse else {\n        throw LoadError.notHTTP\n    }\n    switch http.statusCode {\n    case 200:\n        let chapter = try JSONDecoder().decode(Chapter.self, from: data)\n        return chapter\n    default:\n        throw LoadError.status(http.statusCode)\n    }\n}","alt"],["urls.s3","guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\nguard (200..<300).contains(http.statusCode) else { throw LoadError.status(http.statusCode) }\nreturn try JSONDecoder().decode(Chapter.self, from: data)","near"],["urls.s3","guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\nguard http.statusCode == 200 else { throw LoadError.notHTTP }\nreturn try JSONDecoder().decode(Chapter.self, from: data)\n\nЕсли статус не 200 — бросаем ошибку.","near"],["urls.s3","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n  let http = response as! HTTPURLResponse\n  guard http.statusCode == 200 else { throw LoadError.status(http.statusCode) }\n  return try JSONDecoder().decode(Chapter.self, from: data)\n}","novice"],["urls.s3","guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\nguard http.statusCode = 200 else { throw LoadError.status(http.statusCode) }\nreturn try JSONDecoder().decode(Chapter.self, from: data)","novice"],["urls.s3","func decodeChapter(data: Data, response: URLResponse) {\n  print(\"Первый снег\")\n}","wrong"],["urls.s4","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n  guard let http = response as? HTTPURLResponse\n  else { throw LoadError.notHTTP }\n  guard http.statusCode == 200\n  else { throw LoadError.status(http.statusCode) }\n  return try JSONDecoder().decode(Chapter.self, from: data)\n}","same"],["urls.s4","guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\nif http.statusCode != 200 { throw LoadError.status(http.statusCode) }\nreturn try JSONDecoder().decode(Chapter.self, from: data)\n\nДо правки выводило «Первый снег», после — «HTTP 503».","alt"],["urls.s4","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    if let http = response as? HTTPURLResponse {\n        guard http.statusCode == 200 else { throw LoadError.status(http.statusCode) }\n    } else {\n        throw LoadError.notHTTP\n    }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}","alt"],["urls.s4","let http = response as? HTTPURLResponse\nguard http?.statusCode == 200 else { throw LoadError.notHTTP }\nreturn try JSONDecoder().decode(Chapter.self, from: data)","near"],["urls.s4","guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\nguard http.statusCode == 200 else { throw LoadError.status(200) }\nreturn try JSONDecoder().decode(Chapter.self, from: data)\n\nДо — «Первый снег», после — «HTTP 200».","near"],["urls.s4","guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\nguard http.statusCode = 200 else { throw LoadError.status(http.statusCode) }\nreturn try JSONDecoder().decode(Chapter.self, from: data)","novice"],["urls.s4","guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\nguard http.statusCode == 200 else { LoadError.status(http.statusCode) }\nreturn try JSONDecoder().decode(Chapter.self, from: data)","novice"],["urls.s4","let response = HTTPURLResponse(url: url, statusCode: 200,\n                               httpVersion: nil, headerFields: nil)!","wrong"],["urls.s5","response нужен потому что в нём HTTP-статус, и его надо проверить раньше, чем читать тело. URLError — это сбой самого транспорта, например нет сети. LoadError.status — сервер ответил, но не тем, что обещал контракт. DecodingError — ответ успешный, но JSON не подходит под модель. А await только приостанавливает задачу, UI менять можно лишь в изоляции MainActor.","same"],["urls.s5","Data без response — это просто байты, не знаешь, был ли это успех. Поэтому берём пару: сначала смотрим код ответа, и только потом лезем в тело. Ошибки три разные: URLError, когда запрос вообще не дошёл (таймаут, офлайн), status — когда дошёл, но сервер вернул не 200, и DecodingError, когда 200, а JSON кривой. await не переносит код на главный поток, он лишь ждёт, так что UI из любого места менять нельзя — нужен MainActor.","alt"],["urls.s5","Статус лежит в response, поэтому он едет вместе с data: проверяем его до разбора тела, иначе можно декодировать страницу с ошибкой. По ошибкам: URLError — проблемы с сетью, status — наша собственная ошибка на неожиданный HTTP-код, DecodingError — данные пришли, но не такие, как в модели. Ну а await — это просто пауза; где выполнится код после неё, она не гарантирует, и для UI это решает MainActor.","alt"],["urls.s5","response хранится рядом с data, потому что в нём статус, и его проверяют до тела. URLError — отказ транспорта, status — HTTP-ответ не 200, DecodingError — когда данные успешного ответа не подходят под модель.","near"],["urls.s5","URLError — когда нет сети или таймаут, LoadError.status — когда сервер ответил кодом не 200, DecodingError — когда JSON не подошёл. А await не даёт менять UI откуда угодно, потому что UI живёт на MainActor, и код после await может оказаться в другом контексте.","near"],["urls.s5","response храним на всякий случай, для логов. URLError, status и DecodingError по сути одно и то же — всё это ошибки загрузки. А после await код уже выполняется на главном потоке, поэтому UI менять можно откуда угодно.","novice"],["urls.s5","response нужен, чтобы проверить статус перед телом. URLError — это когда JSON не разобрался, а DecodingError — когда пропал интернет. Статус — это ошибка сервера. await ставит задачу на паузу, и MainActor для UI нужен только в старых версиях.","novice"],["urls.s5","URLSession — это синглтон, у которого есть delegate и Codable. Глава загружается асинхронно через completion handler, а Decodable превращает response в Data, поэтому MainActor не нужен.","wrong"],["urls.s6","    try Task.checkCancellation()\n    guard id > 0 else { throw LoadError.invalidID }\n    // ...\n    let (data, response) = try await session.data(for: request)\n    try Task.checkCancellation()\n    return try decodeChapter(data: data, response: response)","same"],["urls.s6","guard id > 0 else { throw LoadError.invalidID }\ntry Task.checkCancellation()\nlet address = \"https://api.example.invalid/chapters/\\(id)\"\n// ...\nvar request = URLRequest(url: url)\nrequest.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\nlet (data, response) = try await session.data(for: request)\ntry Task.checkCancellation()\nreturn try decodeChapter(data: data, response: response)","alt"],["urls.s6","    if Task.isCancelled { throw CancellationError() }\n    // ... всё как было\n    let (data, response) = try await session.data(for: request)\n    if Task.isCancelled { throw CancellationError() }\n    return try decodeChapter(data: data, response: response)\n\nОтмену бросаем как CancellationError вручную.","alt"],["urls.s6","try Task.checkCancellation()\nlet (data, response) = try await session.data(for: request)\nreturn try decodeChapter(data: data, response: response)","near"],["urls.s6","try Task.checkCancellation()\nlet (data, response) = try await session.data(for: request)\nif Task.isCancelled { return Chapter(id: id, title: \"\") }\nreturn try decodeChapter(data: data, response: response)\n\nПосле await при отмене возвращаем пустую главу.","near"],["urls.s6","Task.checkCancellation()\nlet (data, response) = try await session.data(for: request)\nTask.checkCancellation()\nreturn try decodeChapter(data: data, response: response)","novice"],["urls.s6","guard !Task.isCancelled else { return }\nlet (data, response) = try await session.data(for: request)\nguard !Task.isCancelled else { return }\nreturn try decodeChapter(data: data, response: response)","novice"],["urls.s6","try await Task.sleep(nanoseconds: 1_000_000_000)\nsession.invalidateAndCancel()","wrong"],["urls.s7","import Foundation\nstruct Chapter: Decodable { let id: Int; let duration: Int }\nenum LoadError: Error {\n  case invalidID, invalidURL, notHTTP\n  case status(Int)\n}\nfunc decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n  guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\n  guard http.statusCode == 200 else { throw LoadError.status(http.statusCode) }\n  return try JSONDecoder().decode(Chapter.self, from: data)\n}\nfunc loadChapter(id: Int, session: URLSession = .shared) async throws -> Chapter {\n  guard id > 0 else { throw LoadError.invalidID }\n  guard let url = URL(string: \"https://api.example.invalid/chapters/\\(id)\") else {\n    throw LoadError.invalidURL\n  }\n  var request = URLRequest(url: url)\n  request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n  let (data, response) = try await session.data(for: request)\n  return try decodeChapter(data: data, response: response)\n}","same"],["urls.s7","struct Chapter: Decodable { let id: Int; let duration: Int }\nenum LoadError: Error { case invalidID, invalidURL, notHTTP, status(Int) }\nfunc loadChapter(id: Int, session: URLSession = .shared) async throws -> Chapter {\n    guard id > 0 else { throw LoadError.invalidID }\n    guard let url = URL(string: \"https://api.example.invalid/chapters/\\(id)\") else { throw LoadError.invalidURL }\n    let (data, response) = try await session.data(from: url)\n    guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\n    guard http.statusCode == 200 else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}","alt"],["urls.s7","func loadChapter(id: Int, session: URLSession = .shared) async throws -> Chapter {\n    if id <= 0 { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/chapters/\\(id)\"\n    guard let url = URL(string: address) else { throw LoadError.invalidURL }\n    let result = try await session.data(for: URLRequest(url: url))\n    guard let http = result.1 as? HTTPURLResponse else { throw LoadError.notHTTP }\n    if http.statusCode != 200 { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: result.0)\n}\n\nМодель и enum LoadError объявлены как обычно.","alt"],["urls.s7","func loadChapter(id: Int, session: URLSession = .shared) async throws -> Chapter {\n    guard id > 0 else { throw LoadError.invalidID }\n    guard let url = URL(string: \"https://api.example.invalid/chapters/\\(id)\") else { throw LoadError.invalidURL }\n    let (data, response) = try await session.data(from: url)\n    guard response is HTTPURLResponse else { throw LoadError.notHTTP }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}","near"],["urls.s7","func loadChapter(id: Int, session: URLSession = .shared) async throws -> Chapter {\n    guard id > 0 else { throw LoadError.invalidID }\n    guard let url = URL(string: \"https://api.example.invalid/chapters/\\(id)\") else { throw LoadError.invalidURL }\n    let (data, response) = try await session.data(from: url)\n    guard let http = response as? HTTPURLResponse else { throw LoadError.notHTTP }\n    guard (200...299).contains(http.statusCode) else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\n\nЛюбой успешный статус можно декодировать.","near"],["urls.s7","func loadChapter(id: Int, session: URLSession = .shared) async throws -> Chapter {\n  guard id > 0 else { throw LoadError.invalidID }\n  let url = URL(string: \"https://api.example.invalid/chapters/\\(id)\")!\n  let (data, response) = try await session.data(from: url)\n  let http = response as! HTTPURLResponse\n  guard http.statusCode == 200 else { throw LoadError.status(http.statusCode) }\n  return try JSONDecoder().decode(Chapter.self, from: data)\n}","novice"],["urls.s7","func loadChapter(id: Int, session: URLSession = .shared) async throws -> Chapter {\n  guard id > 0 else { throw LoadError.invalidID }\n  guard let url = URL(string: \"https://api.example.invalid/chapters/\\(id)\") else { throw LoadError.invalidURL }\n  let (data, ь через живую сессию. replay же отдан наружу и может быть вызван после смерти экрана — для него unowned опасен.","alt"],["weak.s5","Делегат слабый, чтобы не было цикла владения, AnyObject нужен для weak. После закрытия weak self становится nil и replay печатает «Экран закрыт».","near"],["weak.s5","weak-делегат нужен, чтобы не было цикла. После закрытия weak-захват даст nil, и replay выберет ветку «Экран закрыт». Подсказке подходит unowned, потому что она приватная и живёт только вместе с сессией, а внешний replay может пережить экран.","near"],["weak.s5","Делегат слабый, чтобы он быстрее освобождался. После закрытия weak-замыкание продолжает удерживать экран живым, поэтому replay сработает как обычно. unowned тоже становится nil, просто без Optional, так что подходит везде.","novice"],["weak.s5","Делегат слабый, чтобы не удерживать экран, AnyObject нужен для weak. replay после закрытия просто ничего не напечатает. unowned у подсказки подходит, потому что он быстрее; внешнему replay он нужен тоже, просто его забыли написать.","novice"],["weak.s5","Протокол делегата наследуется от AnyObject, поэтому replay — это Optional closure, а подсказка — private lazy var с делегатом. Экран конформит DictationSession.","wrong"],["weak.s6","final class DictationHint {\n    unowned let owner: DictationSession\n    init(owner: DictationSession) { self.owner = owner }\n    func show() { print(owner.id) }\n}","same"],["weak.s6","struct DictationHint {\n    unowned let owner: DictationSession\n    func show() { print(owner.id) }\n}\n\nunowned, потому что hint живёт внутри сессии и наружу не уходит, сессия точно жива.","alt"],["weak.s6","final class DictationHint {\n  unowned let owner: DictationSession\n  init(owner: DictationSession) {\n    self.owner = owner\n  }\n  func show() {\n    let value = owner.id\n    print(value)\n  }\n}","alt"],["weak.s6","final class DictationHint {\n    unowned let owner: DictationSession\n    init(owner: DictationSession) { self.owner = owner }\n    fun const $=id=>document.getElementById(id),sel=$("t");TASKS.forEach((t,i)=>{const o=document.createElement("option");o.value=i;o.textContent=t.id+" · "+t.kind+" · "+t.title;sel.appendChild(o);});
const cur=()=>TASKS[+sel.value];let exI=0;
function show(){const t=cur();$("pr").textContent=t.prompt;$("code").textContent=t.code||"";$("a").value="";$("out").innerHTML="";$("k").hidden=true;$("k").textContent=t.key;exI=0;}
sel.onchange=show;show();
const NAME={ok:"ВЕРНО · совпало с ключом или проверенным вариантом",no:"НЕВЕРНО · узнал известную ошибку",check:"ПРОВЕРЬ · есть вопрос к ответу",unsure:"НЕ УВЕРЕН · сверь с ключом сам"};
$("go").onclick=()=>{const t=cur(),t0=performance.now(),r=SynCheck.verdict($("a").value,t,t.check),ms=performance.now()-t0;
 $("out").innerHTML='<div class="v '+r.v+'"><b>'+NAME[r.v]+'</b>'+(r.msgs&&r.msgs.length?"<ul>"+r.msgs.map(m=>"<li>"+m.replace(/</g,"&lt;")+"</li>").join("")+"</ul>":"")+'<small>этап: '+r.why+' · '+ms.toFixed(1)+' мс</small></div>';};
$("ex").onclick=()=>{const c=CANDS.filter(c=>c[0]===cur().id);if(!c.length)return;const x=c[exI++%c.length];$("a").value=x[1];$("go").click();};
$("key").onclick=()=>{$("k").hidden=!$("k").hidden;};
$("bench").onclick=()=>{const by={};TASKS.forEach(t=>by[t.id]=t);const ts=[];for(let rep=0;rep<3;rep++)CANDS.forEach(c=>{const t0=performance.now();SynCheck.verdict(c[1],by[c[0]],by[c[0]].check);ts.push(performance.now()-t0);});
 ts.sort((a,b)=>a-b);const q=f=>ts[Math.floor(f*(ts.length-1))].toFixed(2);
 $("out").innerHTML='<div class="v unsure"><b>ЗАМЕР</b><ul><li>проверок: '+ts.length+'</li><li>медиана: '+q(.5)+' мс</li><li>95%: '+q(.95)+' мс</li><li>максимум: '+q(1)+' мс</li><li>всего: '+ts.reduce((a,b)=>a+b,0).toFixed(0)+' мс</li></ul><small>пришли эти цифры — это время на твоём устройстве</small></div>';};
