чему сравнение ml == 0 компилируется?","code":"let inputs = [\"250\", \"\", \" 300\", \"0\"]\nfor text in inputs {\n    let ml = Int(text)\n    print(ml ?? -1, ml == 0)\n}","key":"250 false\n-1 false\n-1 false\n0 true\n\nml имеет тип Int?: Int(_:) возвращает nil, если строка не число целиком. Пустая строка и « 300» с пробелом — не числа, поэтому ?? подставляет -1. Сравнение Int? с 0 разрешено: 0 оборачивается в Optional, и nil == 0 даёт false, а не краш. Для экрана: пробелы убирают до преобразования, а -1 нельзя показывать как объём.","check":{"outs":[["250 false","-1 false","-1 false","0 true"]],"why":["\"250\" — число целиком, ml равен 250, сравнение с 0 даёт false.","Пустая строка не число: ml равен nil, ?? даёт -1, nil == 0 это false.","\" 300\" с пробелом — не число целиком: снова nil, -1 и false.","\"0\" — число 0: ?? его не трогает, сравнение даёт true."],"wrong":[{"out":["250 false","-1 false","300 false","0 true"],"msg":"Int(_:) не убирает пробелы: строка \" 300\" не число целиком, результат nil. Пробелы срезают до преобразования."},{"out":["250 false","0 true","-1 false","0 true"],"msg":"Пустая строка не превращается в 0: Int(\"\") возвращает nil. Поэтому ?? подставит -1, а сравнение с 0 даст false."},{"out":["250 false","-1 true","-1 true","0 true"],"msg":"nil == 0 даёт false: 0 оборачивается в Optional, и пустое значение не равно числу. Краша тоже нет."}]}},{"id":"opt-b2","kind":"code","type":"Найди ошибку","title":"Срок доставки посылки","prompt":"Тестировщик прислал скриншоты карточки посылки: текст выглядит странно и с прогнозом, и без него. Найди причину и почини: без прогноза — «Срок уточняется».","code":"struct Parcel {\n    let track: String\n    let daysLeft: Int?\n}\nfunc deliveryText(for parcel: Parcel) -> String {\n    \"Осталось \\(parcel.daysLeft) дн.\"\n}\nprint(deliveryText(for: Parcel(track: \"RB12\", daysLeft: 3)))\nprint(deliveryText(for: Parcel(track: \"RB13\", daysLeft: nil)))","key":"func deliveryText(for parcel: Parcel) -> String {\n    guard let days = parcel.daysLeft else { return \"Срок уточняется\" }\n    return \"Осталось \\(days) дн.\"\n}\n\nИнтерполяция Optional компилируется (только с предупреждением) и печатает «Осталось Optional(3) дн.» и «Осталось nil дн.». Значение разворачивают до вставки в текст: guard let отсекает nil, дальше days — обычный Int. Теперь вывод «Осталось 3 дн.» и «Срок уточняется». ?? 0 здесь не подходит: «Осталось 0 дн.» соврал бы о сроке.","check":{"accept":["if let days = parcel.daysLeft {\n    return \"Осталось \\(days) дн.\"\n}\nreturn \"Срок уточняется\"","parcel.daysLeft.map { \"Осталось \\($0) дн.\" } ?? \"Срок уточняется\""],"must":[{"pat":["guard let $a = parcel.daysLeft","if let $a = parcel.daysLeft","parcel.daysLeft.map"],"miss":"Не вижу развёртывания parcel.daysLeft. Пока Optional не развёрнут, в текст попадёт слово Optional или nil."},{"pat":["\"Срок уточняется\""],"miss":"Нет текста «Срок уточняется» для посылки без прогноза. Без него пользователь увидит служебное nil."},{"pat":["guard let $a = parcel.daysLeft ... \"Осталось \\($a) дн.\"","if let $a = parcel.daysLeft { ... \"Осталось \\($a) дн.\" ... }","parcel.daysLeft.map { \"Осталось \\($0) дн.\" }","parcel.daysLeft.map { $a in \"Осталось \\($a) дн.\" }"],"miss":"Не вижу «Осталось N дн.» с уже развёрнутым числом. В строку нужно подставлять то, что достал guard let или if let, а не исходный Optional."}],"not":[{"pat":["?? 0"],"msg":"Запасной ноль соврёт: «Осталось 0 дн.» значит, что посылка приходит сегодня, а срок на деле неизвестен."},{"pat":["parcel.daysLeft!"],"msg":"Force unwrap: для посылки без прогноза приложение упадёт. Развёртывай безопасно и отдельно обработай nil."}],"complete":true}},{"id":"opt-b3","kind":"oral","type":"Устно","title":"Тёмная тема: три состояния","prompt":"Объясни как на собеседовании: сколько состояний у prefersDark и что означает каждое; почему закомментированная строка не компилируется и как экрану выбрать тему.","code":"struct ThemeSettings {\n    var prefersDark: Bool?   // из настроек аккаунта\n}\nlet settings = ThemeSettings(prefersDark: nil)\nlet systemIsDark = true\n// if settings.prefersDark { ... }   // не компилируется","key":"Три состояния: true — пользователь выбрал тёмную тему, false — выбрал светлую, nil — ещё не выбирал. Optional добавляет к Bool отдельный ответ «значения нет», поэтому nil нельзя молча считать false. if ждёт Bool, а не Bool?: Swift не решает за нас, что делать при nil. Выбор темы — settings.prefersDark ?? systemIsDark: явный выбор пользователя важнее, при nil следуем системе. Если нужна проверка только явного «да», пишут settings.prefersDark == true.","check":{"concepts":[{"label":"три состояния","groups":[["три","3","three"],["состоян","вариант","значен","случа"]],"miss":"Не названо число состояний: у Bool? их три — true, false и nil."},{"label":"nil — пользователь ещё не выбирал","groups":[["nil"],["не выбир","не задан","не указ","нет значен","не определ","отсутств","не знаем","не установ","нет выбора","не сделал"]],"miss":"Не объяснено, что значит nil: пользователь ещё не выбирал тему, значения нет."},{"label":"if ждёт Bool, а не Bool?","groups":[["bool?","optional","опционал","nil"],["ждёт","ждет","ожида","требу","нужен","нужно","не может","не знает","не решает","не понима","не компил"]],"miss":"Не объяснено, почему строка не компилируется: if ждёт Bool, а у Bool? есть ещё nil, и Swift не решает за нас, что с ним делать."},{"label":"?? systemIsDark: явный выбор важнее, при nil — система","groups":[["??","по умолчанию","запасн","фолбэк","fallback"],["систем","systemisdark","system"]],"miss":"Не сказано, как выбрать тему: prefersDark ?? systemIsDark. Явный выбор пользователя главнее, при nil следуем системе."},{"label":"== true — проверка только явного «да»","groups":[["== true","равно true","сравнить с true","сравнить с `true`","проверить на true","только явн","явное да","явного да","явный да"]],"miss":"Не упомянут вариант проверки только явного «да»: prefersDark == true, где nil даёт false."}],"false":[{"groups":[["nil"],["nil равен false","nil это false","nil — это false","nil - это false","nil == false","nil = false","nil и false одно","nil и есть false","nil эквивалент","nil то же, что false","nil это то же"]],"msg":"nil и false — разные состояния: false значит «выбрал светлую», nil — «ещё не выбирал». Молча считать nil за false нельзя."}]}},{"id":"queues.s1","kind":"predict","title":"Ступень 1. Порядок serial","prompt":"Назови три строки вывода. Почему async не меняет порядок двух задач serial-очереди, а последний sync находится снаружи неё?","code":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nqueue.async { print(\"Уровень 7\") }\nqueue.async { print(\"Уровень 8\") }\nqueue.sync {}\nprint(\"Готово\")","key":"Уровень 7\nУровень 8\nГотово\n\nОдин отправитель поставил работы на serial-очередь в этом порядке. Внешний sync ждёт предыдущие работы перед сообщением «Готово».","check":{"outs":[["Уровень 7","Уровень 8","Готово"]],"why":["Первая работа попала на serial-очередь раньше второй, а serial запускает работы по одной в порядке постановки.","Вторая работа идёт строго после первой: на serial-очереди две работы не перекрываются и не меняются местами.","Внешний sync стоит в очереди после обеих работ и держит вызывающий код, пока они не закончатся, поэтому «Готово» печатается последним."],"wrong":[{"out":["Уровень 8","Уровень 7","Готово"],"msg":"Ты допустил перестановку работ. Serial-очередь не переставляет их: они выполняются по одной в порядке отправки одним отправителем."},{"out":["Готово","Уровень 7","Уровень 8"],"msg":"Ты решил, что вызывающий код не ждёт. Но последний sync блокирует вызывающий код, пока очередь не дойдёт до него, то есть пока обе работы не отработают."}]}},{"id":"queues.s2","kind":"code","title":"Ступень 2. Выбери ожидание","prompt":"Заполни sync, если «После» должно печататься только после «Экспорт 7». Затем объясни допустимые порядки при async; не обещай, что он всегда печатает работу последней.","code":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nprint(\"До\")\nqueue./* Выбери метод */ { print(\"Экспорт 7\") }\nprint(\"После\")","key":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nprint(\"До\")\nqueue.sync { print(\"Экспорт 7\") }\nprint(\"После\")\n\nВывод «До», «Экспорт 7», «После». При async после «До» допустимы оба порядка оставшихся сообщений: вызывающий код не ждёт окончание работы.","check":{"accept":["queue.sync(execute: { print(\"Экспорт 7\") })"],"must":[{"pat":["queue.sync { ... }","queue.sync() { ... }","queue.sync(execute: ...)"],"miss":"Не вижу вызова sync на очереди. Нужно ожидание: вызывающий код должен дойти до «После» только когда работа закончится. Какой метод ждёт?"},{"pat":["queue.sync { ... print(\"Экспорт 7\") ... }","queue.sync() { ... print(\"Экспорт 7\") ... }","queue.sync(execute: { ... print(\"Экспорт 7\") ... })"],"miss":"Печать «Экспорт 7» должна лежать внутри блока очереди: иначе нечего ждать, и порядок «До, Экспорт 7, После» не гарантирован."}],"not":[{"pat":["queue.async { ... }","queue.async(execute: ...)","queue.asyncAfter(...) { ... }"],"msg":"async не ждёт окончания работы: «После» может напечататься раньше «Экспорт 7». Задача просит гарантию порядка, значит нужен метод, который блокирует вызывающий код."},{"pat":["sleep(...)","Thread.sleep(...)","usleep(...)"],"msg":"Пауза не гарантирует порядок, а лишь прячет гонку. Ожидание должно быть выражено самим вызовом на очереди."}],"complete":true}},{"id":"queues.s3","kind":"code","title":"Ступень 3. Напиши возврат результата","prompt":"Самостоятельно напиши encodeLevel(id:) -> String и получи результат через queue.sync. Ожидается строка level-7; без async-записи в общую переменную.","code":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\n// Напиши помощник, sync и вывод результата","key":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nfunc encodeLevel(id: Int) -> String { \"level-\\(id)\" }\nlet result = queue.sync { encodeLevel(id: 7) }\nprint(result)\n\nВывод level-7. sync завершает тело и возвращает его значение до следующей строки.","check":{"accept":["func encodeLevel(id: Int) -> String {\n    return \"level-\\(id)\"\n}\nlet result = queue.sync { return encodeLevel(id: 7) }\nprint(result)","func encodeLevel(id: Int) -> String { \"level-\\(id)\" }\nprint(queue.sync { encodeLevel(id: 7) })"],"must":[{"pat":["func encodeLevel(id: Int) -> String { ... \"level-\\(id)\" ... }","func encodeLevel(id: Int) -> String { ... \"level-\" + String(id) ... }"],"miss":"Не вижу помощника encodeLevel(id:) -> String, который собирает строку вида «level-» и номер. Параметр называется id, результат возвращается как String."},{"pat":["queue.sync { ... encodeLevel(id: 7) ... }","queue.sync(execute: { ... encodeLevel(id: 7) ... })"],"miss":"Вызов encodeLevel(id: 7) должен быть внутри sync: sync вернёт значение блока, и результат придёт прямо в этот вызов, без общей переменной."},{"pat":["print(...)"],"miss":"Результат нужно вывести: после sync у тебя в руках обычная строка, её остаётся напечатать."}],"not":[{"pat":["queue.async { ... }","queue.async(execute: ...)"],"msg":"async не вернёт строку: блок выполнится позже, а вызывающий код пойдёт дальше. Для результата прямо в вызове нужен sync."},{"pat":["queue.sync { ... print(...) ... }"],"msg":"Печать внутри блока — не возврат результата. Пусть блок вернёт строку, а print сделай снаружи, после sync."}],"complete":true}},{"id":"queues.s4","kind":"code","title":"Ступень 4. Очередь ждёт себя","prompt":"Исправь вложенный sync на текущую serial-очередь: вынеси печать «Экспорт 7» в encodeLevel() и вызови напрямую из внешнего блока. Сохрани порядок «Начало», экспорт, «Конец». Не запускай исходный блок как успешный пример.","code":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nqueue.sync {\n    print(\"Начало\")\n    queue.sync { print(\"Экспорт 7\") }\n    print(\"Конец\")\n}","key":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nfunc encodeLevel() { print(\"Экспорт 7\") }\nqueue.sync {\n    print(\"Начало\")\n    encodeLevel()\n    print(\"Конец\")\n}\n\nПосле исправления «Начало», «Экспорт 7», «Конец». Внутреннего ожидания собственной очереди больше нет; исходник содержит deadlock или его диагностику Dispatch.","check":{"must":[{"pat":["func encodeLevel() { ... print(\"Экспорт 7\") ... }"],"miss":"Не вижу функции encodeLevel(), в которую вынесена печать «Экспорт 7». Без неё работа остаётся внутри вложенного sync."},{"pat":["queue.sync { ... print(\"Начало\") ... encodeLevel() ... print(\"Конец\") ... }"],"miss":"Внешний блок должен печатать «Начало», потом напрямую вызывать encodeLevel(), потом печатать «Конец». Тогда порядок сохранён, а ожидания собственной очереди нет."}],"not":[{"pat":["queue.sync { ... queue.sync { ... encodeLevel() ... } ... }"],"msg":"Ты снова вызываешь sync на ту же serial-очередь изнутри её блока: он ждёт работу, которая не начнётся, пока он сам не вернётся. Вызови функцию напрямую."},{"pat":["queue.async { ... }","queue.async(execute: ...)"],"msg":"async лишь прячет deadlock и может поменять порядок вывода. Задание: вызвать функцию напрямую из внешнего блока."},{"pat":["sleep(...)","Thread.sleep(...)","usleep(...)"],"msg":"Паузы не лечат ожидание очереди самой себя. Нужно убрать вложенный вызов на ту же очередь."}],"complete":false}},{"id":"queues.s5","kind":"oral","title":"Ступень 5. Объясни оси","prompt":"Своими словами, как на собесе: что → почему → последствия.","code":"Что меняет serial/concurrent? Что меняет sync/async? Почему вложенный sync на текущую serial-очередь ошибочен?","key":"serial исключает перекрытие своих работ, concurrent допускает его; из этого не следует конкретный поток или порядок окончания конкурентных задач. sync ждёт отправленную работу и может вернуть результат, async не ждёт её окончания. Вложенный sync на текущую serial-очередь ждёт работу, которую нельзя начать до завершения самого ожидающего блока.","check":{"concepts":[{"label":"serial: работы по одной, concurrent: могут перекрываться","groups":[["serial","сериал","последовательн","по одной","друг за другом","по очереди","не перекрыва"],["concurrent","конкурент","параллел","одновременно","перекрыва","нескольк"]],"miss":"Не раскрыто serial/concurrent: serial не допускает перекрытия своих работ (по одной), concurrent допускает одновременное выполнение."},{"label":"serial/concurrent не задаёт поток и порядок окончания","groups":[["поток","порядок","окончан","заверш"],["не гаранти","не следует","не значит","не задан","не определ","непредсказ","не обещ","не факт"]],"miss":"Не сказано, чего serial/concurrent не обещает: конкретный поток и порядок окончания конкурентных задач из этого не следуют."},{"label":"sync ждёт и может вернуть результат","groups":[["sync","синхрон"],["результат","возвраща","вернуть","вернёт","вернет","значени"]],"miss":"Про sync не сказано главное: он ждёт завершения отправленной работы и может вернуть её значение вызывающему коду."},{"label":"async не ждёт завершения","groups":[["async","асинхрон"],["не жд","не дожида","не блокир","сразу","не останавлива","продолжа","идёт дальше","идет дальше"]],"miss":"Про async не сказано: он ставит работу и сразу возвращает управление, не дожидаясь её окончания."},{"label":"вложенный sync на текущую serial-очередь ждёт сам себя (deadlock)","groups":[["deadlock","дедлок","взаимн","завис","тупик","ждёт себя","ждет себя","сам себя","сама себя","сам себ","никогда не","не начнёт","не начнет","не сможет"],["serial","очеред","блок","текущ","та же","ту же"]],"miss":"Не объяснено, почему вложенный sync на текущую serial-очередь ошибочен: внутренняя работа не начнётся, пока не закончится внешний блок, а он её ждёт, то есть deadlock."}],"false":[{"groups":[["serial","последовательн"],["один поток","одном потоке","одним потоком","в одном треде","main thread","главн"]],"msg":"Похоже, ты связываешь serial с одним конкретным потоком. Serial говорит лишь о том, что работы не перекрываются; на каком потоке они пойдут, он не обещает."}]}},{"id":"queues.s6","kind":"code","title":"Ступень 6. Разреши независимый экспорт","prompt":"Сделай очередь concurrent: оба WorkItem уже независимы и отправляются до wait. Запиши гарантии для пяти сообщений. Потом замени очередь на serial и запиши её точный порядок. Не добавляй sleep для получения нужного вывода.","code":"import Dispatch\nlet queue = DispatchQueue(\n    label: \"levels.export\",\n    attributes: /* Выбери атрибут */\n)\nlet first = DispatchWorkItem {\n    print(\"7:начало\")\n    print(\"7:конец\")\n}\nlet second = DispatchWorkItem {\n    print(\"8:начало\")\n    print(\"8:конец\")\n}\nqueue.async(execute: first)\nqueue.async(execute: second)\nfirst.wait()\nsecond.wait()\nprint(\"Готово\")","key":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\", attributes: .concurrent)\nlet first = DispatchWorkItem {\n    print(\"7:начало\")\n    print(\"7:конец\")\n}\nlet second = DispatchWorkItem {\n    print(\"8:начало\")\n    print(\"8:конец\")\n}\nqueue.async(execute: first)\nqueue.async(execute: second)\nfirst.wait()\nsecond.wait()\nprint(\"Готово\")\n\nConcurrent: каждый «начало» раньше своего «конец», «Готово» последнее; относительный порядок двух работ не задан. Serial при таком отправителе: 7:начало, 7:конец, 8:начало, 8:конец, Готово.","check":{"must":[{"pat":[".concurrent"],"miss":"Не вижу атрибута .concurrent для очереди. Без него очередь serial, и два независимых экспорта не смогут идти одновременно."},{"pat":["attributes: .concurrent","attributes: [.concurrent]","attributes: [.concurrent, ...]","attributes: [..., .concurrent]"],"miss":"Атрибут передаётся аргументом attributes: в инициализатор DispatchQueue. Проверь, что ты указал его именно там."}],"not":[{"pat":[".initiallyInactive"],"msg":"С .initiallyInactive очередь не запустит работы, пока её не активируют, и «Готово» не дождётся. Нужен атрибут, который разрешает параллельность."},{"pat":["sleep(...)","Thread.sleep(...)","usleep(...)"],"msg":"Задание запрещает паузы: порядок нельзя подгонять sleep. Гарантии записываются словами, а код остаётся без пауз."},{"pat":["flags: .barrier","flags: [.barrier]"],"msg":"Барьер снова упорядочивает работы, то есть возвращает serial-поведение. Здесь они должны быть независимы."}],"complete":true}},{"id":"queues.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"Восстанови по памяти custom serial-очередь экспорта и encodeManifest(count:) -> String, возвращающую manifest-2 для count 2. Получи строку через sync и выведи её после возврата. Отдельно назови, что нужно изменить, если вызывающий код не должен ждать завершения: async требует другого контракта доставки результата.","key":"import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nfunc encodeManifest(count: Int) -> String { \"manifest-\\(count)\" }\nlet result = queue.sync { encodeManifest(count: 2) }\nprint(result)\n\nВывод manifest-2. Для ожидания и прямого возврата выбран sync; async не подменяет возвращаемое значение синхронной строки.","check":{"accept":["import Dispatch\nlet queue = DispatchQueue(label: \"levels.export\")\nfunc encodeManifest(count: Int) -> String {\n    return \"manifest-\\(count)\"\n}\nprint(queue.sync { encodeManifest(count: 2) })"],"must":[{"pat":["func encodeManifest(count: Int) -> String { ... \"manifest-\\(count)\" ... }","func encodeManifest(count: Int) -> String { ... \"manifest-\" + String(count) ... }"],"miss":"Не вижу функции encodeManifest(count:) -> String, которая собирает «manifest-» и число из count. Проверь сигнатуру и тело."},{"pat":["DispatchQueue(label: ...)"],"miss":"Нет собственной очереди: создай DispatchQueue с label. По умолчанию такая очередь serial, это и нужно."},{"pat":["$q.sync { ... encodeManifest(count: 2) ... }","$q.sync(execute: { ... encodeManifest(count: 2) ... })"],"miss":"Строку нужно получить через sync на очереди: вызови encodeManifest(count: 2) внутри блока и забери значение, которое sync вернёт."},{"pat":["print(...)"],"miss":"Результат нужно вывести после возврата из sync: у тебя в руках строка, её остаётся напечатать."}],"not":[{"pat":["$q.async { ... }","$q.async(execute: ...)"],"msg":"async не вернёт строку напрямую: вызывающий код не ждёт блок. Для результата в этом вызове нужен sync."},{"pat":["print(\"manifest-2\")"],"msg":"Это жёстко заданный вывод, а не результат функции через очередь. Строку должна построить encodeManifest(count:)."},{"pat":["$q.sync { ... print(...) ... }"],"msg":"Печать внутри блока — не возврат значения. Пусть sync вернёт строку, а выведи её уже после возврата."}],"complete":true}},{"id":"queues-b1","kind":"predict","type":"Предскажи вывод","title":"Распечатка коллекции наклеек","prompt":"Назови все допустимые порядки A и B относительно Start, без sleep. Последний sync находится снаружи serial-очереди и ждёт предыдущую работу.","code":"import Dispatch\nlet queue = DispatchQueue(label: \"stickers.print\")\nprint(\"Start\")\nqueue.async { print(\"A\") }\nprint(\"B\")\nqueue.sync {}","key":"Start, A, B или Start, B, A.\n\nStart печатается до постановки A. После постановки async не ждёт её, поэтому B и A могут поменяться местами.","check":{"outs":[["Start","A","B"],["Start","B","A"]],"needAll":true,"why":["Start печатается первым: он стоит до постановки A, ничто его не опережает.","A печатает фоновая работа serial-очереди: она может успеть до B или после него, порядок не задан.","B печатает вызывающий код сразу после постановки async: он не ждёт A, поэтому B и A могут поменяться."],"wrong":[{"out":["Start","A","B"],"msg":"Это лишь один из допустимых порядков. async не ждёт окончания работы, поэтому B может напечататься раньше A; нужно назвать оба порядка."},{"out":["A","Start","B"],"msg":"Ты поставил A перед Start. Но Start печатается до постановки работы, поэтому A не может его опередить."}]}},{"id":"queues-b2","kind":"code","type":"Перепиши","title":"Экспорт схемы метро","prompt":"Нужно сначала построить схему, затем её легенду. Убери ложную зависимость от двух работ concurrent: поставь обе фазы в один WorkItem в нужном порядке, дождись его в локальной проверке.","code":"import Dispatch\nlet queue = DispatchQueue(label: \"metro.export\", attributes: .concurrent)\nlet map = DispatchWorkItem { print(\"Схема\") }\nlet legend = DispatchWorkItem { print(\"Легенда\") }\nqueue.async(execute: map)\nqueue.async(execute: legend)\nmap.wait()\nlegend.wait()","key":"import Dispatch\nlet queue = DispatchQueue(label: \"metro.export\", attributes: .concurrent)\nlet export = DispatchWorkItem {\n    print(\"Схема\")\n    print(\"Легенда\")\n}\nqueue.async(execute: export)\nexport.wait()\n\nВывод «Схема», «Легенда». Зависимость выражена внутри одной работы; concurrent других работ этого порядка не меняет.","check":{"accept":["import Dispatch\nlet queue = DispatchQueue(label: \"metro.export\", attributes: .concurrent)\nlet export = DispatchWorkItem(block: {\n    print(\"Схема\")\n    print(\"Легенда\")\n})\nqueue.async(execute: export)\nexport.wait()"],"must":[{"pat":["DispatchWorkItem { ... print(\"Схема\") ... print(\"Легенда\") ... }"],"miss":"Обе фазы должны лежать в одном DispatchWorkItem: сначала «Схема», потом «Легенда». Внутри одной работы порядок строк гарантирован."},{"pat":["queue.async(execute: $w)"],"miss":"Не вижу отправки объединённой работы на очередь через queue.async(execute: ...)."},{"pat":["$w.wait()"],"miss":"Дождись работы через wait(): иначе локальная проверка закончится раньше, чем она отработает."}],"not":[{"pat":["print(\"Легенда\") ... print(\"Схема\")"],"msg":"Легенда стоит раньше схемы: порядок фаз перевёрнут. Сначала нужно построить схему, потом легенду."},{"pat":["flags: .barrier","flags: [.barrier]"],"msg":"Барьер лишь латает порядок между двумя работами. Задание просит убрать зависимость: обе фазы в одной работе."},{"pat":["sleep(...)","Thread.sleep(...)","usleep(...)"],"msg":"Паузы не выражают зависимость, а лишь подгоняют результат. Порядок задаётся составом одной работы."}],"complete":true}},{"id":"queues-b3","kind":"code","type":"Допиши","title":"Подпись электронной книги","prompt":"Для title нужен sync-результат без хранения callback. Восстанови return queue.sync { title } в readTitle(); после setTitle ожидается «Тихий город». Почему async не вернёт String прямо этому вызову?","code":"import Dispatch\nfinal class BookCaption {\n    private let queue = DispatchQueue(label: \"book.caption\")\n    private var title = \"Без названия\"\n    func setTitle(_ value: String) { queue.sync { title = value } }\n    func readTitle() -> String {\n        // Верни результат sync\n        return \"\"\n    }\n}\nlet caption = BookCaption()\ncaption.setTitle(\"Тихий город\")\nprint(caption.readTitle())","key":"import Dispatch\nfinal class BookCaption {\n    private let queue = DispatchQueue(label: \"book.caption\")\n    private var title = \"Без названия\"\n    func setTitle(_ value: String) { queue.sync { title = value } }\n    func readTitle() -> String { queue.sync { title } }\n}\nlet caption = BookCaption()\ncaption.setTitle(\"Тихий город\")\nprint(caption.readTitle())\n\nВывод «Тихий город». readTitle возвращает завершённый результат, а не ещё не выполненную async-работу. Методы вызываются снаружи приватной очереди.","check":{"accept":["let value = queue.sync { title }\nreturn value","return queue.sync { return title }"],"must":[{"pat":["queue.sync { title }","queue.sync { return title }","queue.sync(execute: { title })","queue.sync(execute: { return title })"],"miss":"Не вижу чтения title внутри sync на queue. Блок sync возвращает своё значение, и чтение идёт через очередь, без гонок."}],"not":[{"pat":["queue.async { ... }","queue.async(execute: ...)"],"msg":"async не может вернуть String в это место: он вернётся раньше, чем блок выполнится. Для результата нужен sync."},{"pat":["DispatchQueue.main.sync { ... }","DispatchQueue.global().sync { ... }"],"msg":"Читать title нужно через приватную очередь класса queue: именно она охраняет это свойство."}],"complete":true}},{"id":"state.s1","kind":"predict","title":"Ступень 1. Предскажи экран","prompt":"Заметка 41 открыта. Пользователь заменил весь текст поля на «Заказать билеты». Что покажут номер, верхний заголовок и поле после обновления интерфейса? Укажи, какое значение изменилось. Здесь нет print: предскажи именно содержимое экрана.","code":"import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            TitleEditor(title: $note.title)\n        }\n    }\n}\nstruct TitleEditor: View {\n    @Binding var title: String\n    var body: some View {\n        TextField(\"Заголовок\", text: $title)\n    }\n}","key":"Номер: «Заметка 41». Верхний заголовок: «Заказать билеты». Поле: «Заказать билеты». Изменилось note.title в состоянии NoteScreen. TextField записал строку через Binding к этому заголовку.","check":{"outs":[["Заметка 41","Заказать билеты","Заказать билеты"]],"why":["id у заметки не менялся: let id остаётся 41.","TextField записал строку в note.title через Binding, верхний Text читает то же свойство.","Поле показывает текущее значение того же note.title, то есть новую строку."],"wrong":[{"out":["Заметка 41","Купить билеты","Заказать билеты"],"msg":"Ты решил, что верхняя надпись не обновится. Но поле пишет через Binding в тот же note.title, поэтому после обновления экрана Text читает новую строку."},{"out":["Заметка 41","Купить билеты","Купить билеты"],"msg":"Состояние при вводе меняется: TextField записывает строку в note.title, и обновление интерфейса показывает её и в надписи, и в поле."},{"out":["Заметка Заказать билеты","Заказать билеты","Заказать билеты"],"msg":"Номер берётся из note.id, а редактируется только title. Номер остаётся 41."}]}},{"id":"state.s2","kind":"code","title":"Ступень 2. Дай полю состояние","prompt":"Замени два комментария рабочим кодом. Экран должен владеть черновиком; ввод в поле должен менять надпись сверху. Начальный заголовок — «Купить билеты».","code":"import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    /* обёртка */ private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            TextField(\"Заголовок\", text: /* связь к заголовку */)\n        }\n    }\n}","key":"import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            TextField(\"Заголовок\", text: $note.title)\n        }\n    }\n}\n\n@State даёт экрану хранилище черновика. $note.title передаёт полю связь для чтения и записи заголовка.","check":{"accept":[],"must":[{"pat":["@State private var note","@State var note","@State fileprivate var note"],"miss":"Нет обёртки @State у note. Без неё экран не владеет черновиком: значение нельзя менять, а интерфейс не обновится."},{"pat":["text: $a.title","text: Binding(get: { ... }, set: { ... })"],"miss":"В TextField нет связи с заголовком. Полю нужна запись в note.title, а не копия строки: берётся связь через $ у состояния."},{"pat":["Note(id: 41, title: \"Купить билеты\")"],"miss":"Не вижу начального значения Note с id 41 и заголовком «Купить билеты». Состояние должно стартовать с него."}],"not":[{"pat":["text: note.title"],"msg":"Без $ в поле уходит просто строка: TextField не сможет её менять, и код не соберётся. Нужна связь для записи."},{"pat":["text: .constant(...)","text: Binding.constant(...)"],"msg":".constant создаёт неизменяемую связь: ввод не попадёт в note, и надпись сверху не обновится."},{"pat":["@Binding var note","@Binding private var note","@StateObject private var note","@StateObject var note"],"msg":"Здесь экран сам владеет черновиком, а значит, нужна обёртка владельца состояния — @State. @Binding — для получения чужого значения."}],"complete":true}},{"id":"state.s3","kind":"code","title":"Ступень 3. Вынеси редактор","prompt":"Допиши два места. TitleEditor не должен хранить отдельную копию строки: редактор и Text на родительском экране работают с одним заголовком.","code":"import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            // Вызови дочерний редактор с нужной связью.\n        }\n    }\n}\nstruct TitleEditor: View {\n    // Объяви доступ к чужому заголовку.\n    var body: some View {\n        TextField(\"Заголовок\", text: $title)\n    }\n}","key":"import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            TitleEditor(title: $note.title)\n        }\n    }\n}\nstruct TitleEditor: View {\n    @Binding var title: String\n    var body: some View {\n        TextField(\"Заголовок\", text: $title)\n    }\n}\n\nРодитель владеет note, дочерний TitleEditor получает Binding<String>. Внутри него $title передаёт связь в TextField.","check":{"accept":[],"must":[{"pat":["TitleEditor(title: $a.title)","TitleEditor(title: Binding(get: { ... }, set: { ... }))"],"miss":"Не вижу вызова TitleEditor со связью к заголовку. Дочернему экрану нужен доступ на запись к note.title, а не копия."},{"pat":["@Binding var title: String","@Binding private var title: String"],"miss":"У TitleEditor нет @Binding для title. Без него редактор не получит чужой заголовок и не сможет менять его."}],"not":[{"pat":["TitleEditor(title: note.title)"],"msg":"Без $ ребёнку уходит лишь копия строки: он сможет её показать, но не изменить, и родительская надпись не обновится."},{"pat":["@State var title","@State private var title"],"msg":"@State в дочернем редакторе создаст отдельную строку. Задание требует одну общую: нужна обёртка для чужого значения."},{"pat":["let title: String"],"msg":"let только читает значение: TextField не сможет записать в него. Редактору нужна связь с правом записи."}],"complete":true}},{"id":"state.s4","kind":"code","title":"Ступень 4. Найди второй черновик","prompt":"Введи мысленно «Заказать билеты». Поле показывает новую строку, верхняя надпись остаётся «Купить билеты». Найди причину и исправь обе стороны передачи, сохранив дочерний редактор.","code":"import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            TitleEditor()\n        }\n    }\n}\nstruct TitleEditor: View {\n    @State private var title = \"Купить билеты\"\n    var body: some View {\n        TextField(\"Заголовок\", text: $title)\n    }\n}","key":"import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            TitleEditor(title: $note.title)\n        }\n    }\n}\nstruct TitleEditor: View {\n    @Binding var title: String\n    var body: some View {\n        TextField(\"Заголовок\", text: $title)\n    }\n}\n\nВ ошибочном варианте дочерний @State менял собственную строку. Исправлены и свойство ребёнка, и вызов родителя: @Binding плюс $note.title.","check":{"accept":[],"must":[{"pat":["@Binding var title: String","@Binding private var title: String"],"miss":"В TitleEditor всё ещё нет связи с родителем. Пока там отдельный @State, у ребёнка своя строка. Замени свойство."},{"pat":["TitleEditor(title: $a.title)","TitleEditor(title: Binding(get: { ... }, set: { ... }))"],"miss":"Родитель не передаёт связь к заголовку. Исправляй обе стороны: свойство у ребёнка и вызов TitleEditor у родителя."}],"not":[{"pat":["TitleEditor(title: note.title)"],"msg":"Без $ передаётся копия строки, а не связь: поле не сможет менять заголовок родителя."},{"pat":["@State var title: String","@State private var title: String"],"msg":"Параметр с @State всё равно создаёт отдельную строку у ребёнка. Здесь нужна связь с родительским значением."},{"pat":["@Binding private var title"],"msg":"private скрывает свойство от инициализатора: родитель не сможет передать связь. Оставь доступ открытым."}],"complete":true}},{"id":"state.s5","kind":"oral","title":"Ступень 5. Объясни напарнику (устно)","prompt":"Своими словами, как на собесе: что → почему → последствия.","code":"Заметка 41 «Купить билеты». NoteScreen показывает заголовок, TitleEditor редактирует его.\n- Кто владеет черновиком и почему?\n- Чем note.title отличается от $note.title?\n- Что сломается, если заменить дочерний @Binding отдельным @State?","key":"Черновиком владеет NoteScreen: это общий источник для надписи и редактора, поэтому note объявлен @State. note.title — String для чтения; $note.title — Binding<String> к тому же свойству для чтения и записи. Отдельный дочерний @State создаст независимую строку: поле изменится, а родительская надпись останется прежней. Через @Binding ребёнок редактирует родительский заголовок, поэтому надпись и поле всегда показывают одно и то же.","check":{"concepts":[{"label":"владелец — NoteScreen (@State)","groups":[["notescreen","родител","экран","parent"],["@state","state","владе","хранит","источник","хозяин"]],"miss":"Не сказано, кто владеет черновиком: NoteScreen, и note объявлен @State там, где живут и надпись, и редактор."},{"label":"note.title — значение, $note.title — Binding","groups":[["$note.title","binding","связь","ссылк","доступ"],["чтени","запис","изменя","читать","писать","менять"]],"miss":"Не объяснено различие: note.title — просто строка для чтения, а $note.title — связь, через которую можно читать и записывать."},{"label":"@Binding — один общий источник","groups":[["binding"],["один","общ","тот же","тому же","source of truth","источник","одну и ту же"]],"miss":"Не сказано, что @Binding даёт ребёнку доступ к тому же значению родителя, без собственной копии."},{"label":"отдельный @State — независимая копия","groups":[["копи","отдельн","независим","своя","два источник","второй","свой"],["state","строк","черновик","заголов"]],"miss":"Не объяснено, что дочерний @State создаст независимую строку, не связанную с родителем."},{"label":"последствие — надпись родителя не обновится","groups":[["надпис","text","родител","верхн","заголов"],["не обнов","не меняет","не изменит","остан","прежн","рассинхрон","разъед","не измен"]],"miss":"Не названо последствие: поле изменится, а родительская надпись останется прежней."}],"false":[{"groups":[["state"],["тоже изменится","обновится и надпись","оба изменятся","всё равно обновит","все равно обновит","ничего не сломается","ничего не сломаетс"]],"msg":"С отдельным @State у ребёнка родитель не узнает об изменении: у каждого будет своя строка, и они разойдутся."}]}},{"id":"state.s6","kind":"code","title":"Ступень 6. Передай отметку закрепления","prompt":"Теперь редактируем не строку: у заметки есть isPinned: Bool. Допиши передачу связи и дочернее свойство. Переключение «Закрепить» должно менять родительскую надпись «Закреплена: false» на «Закреплена: true» и обратно. Отдельную копию отметки не создавай.","code":"import SwiftUI\nstruct Note { let id: Int; let title: String; var isPinned: Bool }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\",\n                                   isPinned: false)\n    var body: some View {\n        VStack {\n            Text(note.title)\n            Text(\"Закреплена: \\(note.isPinned)\")\n            // Вызови PinEditor со связью к отметке.\n        }\n    }\n}\nstruct PinEditor: View {\n    // Объяви доступ к чужой отметке.\n    var body: some View {\n        Toggle(\"Закрепить\", isOn: $isPinned)\n    }\n}","key":"import SwiftUI\nstruct Note { let id: Int; let title: String; var isPinned: Bool }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\",\n                                   isPinned: false)\n    var body: some View {\n        VStack {\n            Text(note.title)\n            Text(\"Закреплена: \\(note.isPinned)\")\n            PinEditor(isPinned: $note.isPinned)\n        }\n    }\n}\nstruct PinEditor: View {\n    @Binding var isPinned: Bool\n    var body: some View {\n        Toggle(\"Закрепить\", isOn: $isPinned)\n    }\n}\n\nУ NoteScreen одно состояние note. PinEditor получает Binding<Bool> к note.isPinned; Toggle записывает через $isPinned. После включения родитель читает true, после выключения — false.","check":{"accept":[],"must":[{"pat":["PinEditor(isPinned: $a.isPinned)","PinEditor(isPinned: Binding(get: { ... }, set: { ... }))"],"miss":"Не вижу вызова PinEditor со связью к isPinned. Дочернему переключателю нужен доступ на запись к отметке заметки."},{"pat":["@Binding var isPinned: Bool","@Binding private var isPinned: Bool"],"miss":"У PinEditor нет @Binding для isPinned. Без него переключатель работает не с родительской отметкой."}],"not":[{"pat":["PinEditor(isPinned: note.isPinned)"],"msg":"Без $ ребёнку уходит копия значения: Toggle не сможет изменить отметку, и надпись родителя не поменяется."},{"pat":["@State var isPinned","@State private var isPinned"],"msg":"Отдельный @State у ребёнка — это вторая копия отметки. Задание просит её не создавать."},{"pat":["let isPinned: Bool"],"msg":"let только читает значение: Toggle не сможет в него записать. Нужна связь с правом записи."},{"pat":["PinEditor(isPinned: .constant(...))","PinEditor(isPinned: Binding.constant(...))"],"msg":".constant даёт неизменяемую связь: переключатель не повлияет на note."}],"complete":true}},{"id":"state.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"С нуля создай Note: id и title неизменяемые, text — изменяемая строка.\nОткрой заметку 45 с заголовком «Поездка» и текстом «Проверить даты».\nРодитель хранит черновик и показывает заголовок и текст. Отдельный NoteTextEditor редактирует text через TextField.\nПосле ввода «Купить билеты» родительский текст должен измениться; заголовок «Поездка» не меняется. Пустой text разрешён.","key":"import SwiftUI\nstruct Note { let id: Int; let title: String; var text: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 45, title: \"Поездка\",\n                                   text: \"Проверить даты\")\n    var body: some View {\n        VStack {\n            Text(note.title)\n            Text(note.text)\n            NoteTextEditor(text: $note.text)\n        }\n    }\n}\nstruct NoteTextEditor: View {\n    @Binding var text: String\n    var body: some View {\n        TextField(\"Текст заметки\", text: $text)\n    }\n}\n\nВ начале родитель и поле показывают «Проверить даты». После ввода — «Купить билеты», после стирания — пустую строку. Заголовок «Поездка» читается отдельно. Владелец черновика — NoteScreen, редактор получает Binding к text.","check":{"accept":[],"must":[{"pat":["struct Note { ... let title: String ... var text: String ... }","struct Note { ... var text: String ... let title: String ... }"],"miss":"Модель Note собрана не по условию: title нужен неизменяемым (let), а text изменяемым (var), иначе редактор не сможет менять текст, а заголовок защищён."},{"pat":["@State private var $a = Note(id: 45, title: \"Поездка\", text: \"Проверить даты\")","@State var $a = Note(id: 45, title: \"Поездка\", text: \"Проверить даты\")","@State private var $a: Note = Note(id: 45, title: \"Поездка\", text: \"Проверить даты\")","@State var $a: Note = Note(id: 45, title: \"Поездка\", text: \"Проверить даты\")"],"miss":"Не вижу, что родитель хранит заметку 45 в @State с заголовком «Поездка» и текстом «Проверить даты». Владелец черновика — родительский экран."},{"pat":["struct NoteTextEditor: View { ... @Binding var $a: String ... }","struct NoteTextEditor: View { ... @Binding private var $a: String ... }"],"miss":"В NoteTextEditor нет @Binding на строку. Чтобы редактировать text родителя, а не свою копию, нужна связь."},{"pat":["NoteTextEditor($a: $b.text)","NoteTextEditor(... Binding(get: { ... }, set: { ... }))"],"miss":"Родитель не передаёт редактору связь к text. Нужен доступ на запись к свойству заметки, а не копия строки."},{"pat":["TextField(... text: $a)","TextField(... text: Binding(get: { ... }, set: { ... }))"],"miss":"В редакторе нет TextField, привязанного к связи. Без него ввод не дойдёт до родительского text."}],"not":[{"pat":["@State private var text","@State var text"],"msg":"Отдельный @State в редакторе — это своя копия строки: родительский текст не изменится. Редактору нужна связь с родителем."},{"pat":["NoteTextEditor(text: note.text)"],"msg":"Без $ редактору уходит лишь копия строки. Он не сможет её записать, и родительский текст не изменится."},{"pat":["struct Note { ... var title ... }","struct Note { ... var id ... }"],"msg":"По условию id и title неизменяемые: объявляй их через let. Изменяемым должен быть только text."},{"pat":["struct Note { ... let text ... }"],"msg":"text должен быть изменяемым (var): иначе редактор не сможет записать в него новую строку."}],"complete":false}},{"id":"state-b1","kind":"predict","type":"Предскажи вывод","title":"Настройки: включили и выключили","prompt":"Сначала пользователь включил Toggle, затем нажал родительскую кнопку «Выключить». Какой текст и какое положение переключателя увидит на каждом шаге? Здесь предсказываем экран, не консоль. В условии Text запись условие ? A : B выбирает A при true и B при false.","code":"import SwiftUI\nstruct SettingsScreen: View {\n    @State private var notifications = false\n    var body: some View {\n        VStack {\n            Text(notifications ? \"Уведомления включены\"\n                              : \"Уведомления выключены\")\n            NotificationsSwitch(isEnabled: $notifications)\n            Button(\"Выключить\") { notifications = false }\n        }\n    }\n}\nstruct NotificationsSwitch: View {\n    @Binding var isEnabled: Bool\n    var body: some View {\n        Toggle(\"Уведомления\", isOn: $isEnabled)\n    }\n}","key":"Вначале: «Уведомления выключены», Toggle выключен. После включения: «Уведомления включены», Toggle включён. После кнопки: «Уведомления выключены», Toggle выключен. Дочерний переключатель пишет через Binding в notifications; кнопка родителя меняет тот же источник.","check":{"self":"ответ — три шага (старт, после включения, после кнопки) с текстом и положением переключателя в свободной форме; сверь с ключом"}},{"id":"state-b2","kind":"code","type":"Найди ошибку","title":"Счётчик не растёт","prompt":"В счётчике напоминаний начальное значение 2. Пользователь нажимает плюс, но count остаётся 2. Найди причину и исправь аргумент Stepper. После исправления два нажатия плюс должны дать 4. Диапазон оставь 1...5.","code":"import SwiftUI\nstruct CounterScreen: View {\n    @State private var count = 2\n    var body: some View {\n        VStack {\n            Text(\"Напоминаний: \\(count)\")\n            Stepper(\"Количество\", value: .constant(count), in: 1...5)\n        }\n    }\n}","key":"import SwiftUI\nstruct CounterScreen: View {\n    @State private var count = 2\n    var body: some View {\n        VStack {\n            Text(\"Напоминаний: \\(count)\")\n            Stepper(\"Количество\", value: $count, in: 1...5)\n        }\n    }\n}\n\n.constant создаёт фиксированный Binding: он не меняет count. $count даёт доступ к состоянию владельца; последовательность после исправления — 2 → 3 → 4, а допустимые границы — 1 и 5.","check":{"accept":[],"must":[{"pat":["Stepper(... value: $a ...)","Stepper(... value: Binding(get: { ... }, set: { ... }) ...)"],"miss":"Stepper не получает связь с count. Ему нужен доступ на запись к состоянию владельца, а не копия числа."},{"pat":["in: ..."],"miss":"Пропал диапазон: по условию его нужно оставить, граница значения 1 и 5."}],"not":[{"pat":["value: count"],"msg":"Без $ передаётся копия числа: Stepper не сможет менять count, и он останется 2. Нужна связь с состоянием."},{"pat":["value: &$a","value: &count"],"msg":"В SwiftUI связь берётся через $ у состояния, а не через &. & тут не подходит."},{"pat":["Binding.constant(...)"],"msg":"Фиксированная связь не меняет count: плюс будет нажиматься вхолостую."},{"pat":["..< 5"],"msg":"Диапазон нужно оставить 1...5: так максимальное значение 5 тоже допустимо."}],"complete":false}},{"id":"state-b3","kind":"code","type":"Допиши","title":"Профиль: значение или доступ","prompt":"Допиши два аргумента. NameLabel только показывает имя, NameEditor должен менять имя родителя. Объясни, куда передашь name, а куда $name. После замены «Анна» на «Мария» надпись тоже должна измениться.","code":"import SwiftUI\nstruct ProfileScreen: View {\n    @State private var name = \"Анна\"\n    var body: some View {\n        VStack {\n            NameLabel(name: /* значение или связь? */)\n            NameEditor(name: /* значение или связь? */)\n        }\n    }\n}\nstruct NameLabel: View {\n    let name: String\n    var body: some View { Text(name) }\n}\nstruct NameEditor: View {\n    @Binding var name: String\n    var body: some View { TextField(\"Имя\", text: $name) }\n}","key":"import SwiftUI\nstruct ProfileScreen: View {\n    @State private var name = \"Анна\"\n    var body: some View {\n        VStack {\n            NameLabel(name: name)\n            NameEditor(name: $name)\n        }\n    }\n}\nstruct NameLabel: View {\n    let name: String\n    var body: some View { Text(name) }\n}\nstruct NameEditor: View {\n    @Binding var name: String\n    var body: some View { TextField(\"Имя\", text: $name) }\n}\n\nNameLabel получает строку name для чтения. NameEditor получает $name для чтения и записи родительского состояния. Обычное let у NameLabel не замораживает надпись навсегда: при обновлении родитель передаст новое значение, и Text покажет «Мария».","check":{"accept":[],"must":[{"pat":["NameLabel(name: name)"],"miss":"NameLabel только показывает имя: ему достаточно значения, без связи. Передавай именно значение состояния."},{"pat":["NameEditor(name: $a)","NameEditor(name: Binding(get: { ... }, set: { ... }))"],"miss":"NameEditor должен менять имя родителя, значит, ему нужна связь, а не значение: возьми её через $ у состояния."}],"not":[{"pat":["NameEditor(name: name)"],"msg":"Без $ редактору уходит копия строки: он не сможет её изменить, и родительское имя останется «Анна»."},{"pat":["NameLabel(name: .constant(...))","NameEditor(name: .constant(...))"],"msg":".constant создаёт неизменяемую связь: изменения не дойдут до состояния родителя."}],"complete":true}},{"id":"table.s1","kind":"predict","title":"Ступень 1. Одна ячейка, две модели","prompt":"Предскажи вывод после двух configure и ручного prepareForReuse. Настройка строк задана полностью; реального скролла нет.","code":"import UIKit\nstruct Game {\n    let id: Int\n    let title: String\n    let saved: Bool\n}\nfinal class GameCell: UITableViewCell {\n    var representedID: Int?\n    func configure(_ game: Game) {\n        representedID = game.id\n        textLabel?.text = game.title\n        accessoryType = game.saved ? .checkmark : .none\n        imageView?.image = nil\n    }\n    override func prepareForReuse() {\n        super.prepareForReuse()\n        representedID = nil\n    }\n}\nlet games = [\n    Game(id: 61, title: \"Маяки\", saved: true),\n    Game(id: 62, title: \"Остров\", saved: false)\n]\nlet cell = GameCell(style: .default, reuseIdentifier: \"Game\")\ncell.configure(games[0])\ncell.configure(games[1])\nprint(cell.textLabel?.text ?? \"Пусто\")\nprint(cell.representedID ?? -1, cell.accessoryType == .none)\ncell.prepareForReuse()\nprint(cell.representedID == nil)","key":"Остров\n62 true\ntrue\n\nВторая модель сняла галочку и сменила id; prepareForReuse затем сделал id пустым.","check":{"outs":[["Остров","62 true","true"]],"why":["Последний configure взял вторую модель, поэтому подпись «Остров».","id стал 62, а галочка снята: у «Острова» saved равно false, accessoryType равен .none, значит сравнение даёт true.","prepareForReuse обнулил representedID, и сравнение с nil даёт true."],"wrong":[{"out":["Маяки","61 false","true"],"msg":"Ты смотришь на первую модель. Каждый configure перезаписывает всё: после второго вызова в ячейке данные «Острова»."},{"out":["Остров","62 false","true"],"msg":"Ты решил, что галочка осталась. configure ставит accessoryType заново для каждой модели: у «Острова» saved равно false, значит .none."},{"out":["Остров","62 true","false"],"msg":"Ты решил, что prepareForReuse не сбросил id. Он вызван вручную и обнуляет representedID, поэтому сравнение с nil истинно."}]}},{"id":"table.s2","kind":"code","title":"Ступень 2. Число строк и регистрация","prompt":"Допиши numberOfRowsInSection в GameSource и подключи таблицу: frame 320×480, register GameCell под Game, dataSource=source. Источник сохрани локальной переменной. Проверь количество 2.","code":"import UIKit\nstruct Game {\n    let id: Int\n    let title: String\n    let saved: Bool\n}\nfinal class GameCell: UITableViewCell {\n    var representedID: Int?\n    func configure(_ game: Game) {\n        representedID = game.id\n        textLabel?.text = game.title\n        accessoryType = game.saved ? .checkmark : .none\n        imageView?.image = nil\n    }\n    override func prepareForReuse() {\n        super.prepareForReuse()\n        representedID = nil\n    }\n}\nlet games = [\n    Game(  let cell = GameCell(style: .default, reuseIdentifier: \"Game\")\n    let first = Game(id: 61, title: \"Маяки\", saved: true)\n    let second = Game(id: 62, title: \"Остров\", saved: false)\n    let oldImage = UIImage()\n    let newImage = UIImage()\n    cell.configure(first)\n    requestCover(cell: cell, id: first.id, source: source)\n    cell.prepareForReuse()\n    cell.configure(second)\n    requestCover(cell: cell, id: second.id, source: source)\n    source.finish(id: second.id, image: newImage)\n    source.finish(id: first.id, image: oldImage)\n    assert(cell.imageView?.image === newImage)\n}","key":"import UIKit\nstruct Game {\n    let id: Int\n    let title: String\n    let saved: Bool\n}\nfinal class GameCell: UITableViewCell {\n    var representedID: Int?\n    func configure(_ game: Game) {\n        representedID = game.id\n        textLabel?.text = game.title\n        accessoryType = game.saved ? .checkmark : .none\n        imageView?.image = nil\n    }\n    override func prepareForReuse() {\n        super.prepareForReuse()\n        representedID = nil\n    }\n}\n@MainActor\nfinal class CoverSource {\n    private var pending: [Int: (UIImage) -> Void] = [:]\n    func load(id: Int, done: @escaping (UIImage) -> Void) {\n        pending[id] = done\n    }\n    func finish(id: Int, image: UIImage) {\n        pending.removeValue(forKey: id)?(image)\n    }\n}\n@MainActor\nfunc requestCover(cell: GameCell, id: Int, source: CoverSource) {\n    source.load(id: id) { [weak cell] image in\n        guard let cell, cell.representedID == id else { return }\n        cell.imageView?.image = image\n        cell.setNeedsLayout()\n    }\n}\n@MainActor\nfunc checkLateCover() {\n    let source = CoverSource()\n    let cell = GameCell(style: .default, reuseIdentifier: \"Game\")\n    let first = Game(id: 61, title: \"Маяки\", saved: true)\n    let second = Game(id: 62, title: \"Остров\", saved: false)\n    let oldImage = UIImage()\n    let newImage = UIImage()\n    cell.configure(first)\n    requestCover(cell: cell, id: first.id, source: source)\n    cell.prepareForReuse()\n    cell.configure(second)\n    requestCover(cell: cell, id: second.id, source: source)\n    source.finish(id: second.id, image: newImage)\n    source.finish(id: first.id, image: oldImage)\n    assert(cell.imageView?.image === newImage)\n}\n\nОстаётся newImage: поздний ответ для 61 отклонён, потому что representedID уже 62. weak не заменяет проверку актуальности.","points":["В completion после `[weak cell]` стоит `guard let cell, cell.representedID == id else { return }`.","Сравниваешь с `id`, с которым запрос запускали, — его захватило замыкание.","Картинка и `setNeedsLayout()` — только после guard.","Итог: в ячейке остаётся `newImage`, поздний ответ для 61 отброшен."],"check":{"accept":["source.load(id: id) { [weak cell] image in\n    if let cell, cell.representedID == id {\n        cell.imageView?.image = image\n        cell.setNeedsLayout()\n    }\n}","source.load(id: id) { [weak cell] image in\n    guard cell?.representedID == id else { return }\n    cell?.imageView?.image = image\n    cell?.setNeedsLayout()\n}"],"must":[{"pat":["[weak $a] $i in ... guard let $a, $a.representedID == id else { return }","[weak $a] $i in ... guard let $b = $a, $b.representedID == id else { return }","[weak $a] $i in ... guard let $a else { return } ... guard $a.representedID == id else { return }","[weak $a] $i in ... guard $a?.representedID == id else { return }","[weak $a] $i in ... if let $a, $a.representedID == id { ... }","[weak $a] $i in ... if let $b = $a, $b.representedID == id { ... }","[weak $a] $i in ... if $a?.representedID == id { ... }"],"miss":"В completion нет проверки, что ячейка всё ещё показывает ту игру, чей id захвачен. Сравни representedID ячейки с id запроса внутри замыкания."},{"pat":["representedID == id else { return } ... imageView?.image = $i","representedID == id { ... imageView?.image = $i ... }"],"miss":"Картинку нужно ставить только после проверки id. Е t?\n    func configure(_ game: Game) {\n        representedID = game.id\n        textLabel?.text = game.title\n        accessoryType = game.saved ? .checkmark : .none\n        imageView?.image = nil\n    }\n    override func prepareForReuse() {\n        super.prepareForReuse()\n        representedID = nil\n    }\n}\nfinal class GameSource: NSObject, UITableViewDataSource {\n    let games: [Game]\n    init(games: [Game]) { self.games = games }\n    func tableView(\n        _ tableView: UITableView, numberOfRowsInSection section: Int\n    ) -> Int { games.count }\n    func tableView(\n        _ tableView: UITableView, cellForRowAt indexPath: IndexPath\n    ) -> UITableViewCell {\n        let cell = tableView.dequeueReusableCell(\n            withIdentifier: \"Game\", for: indexPath\n        ) as! GameCell\n        cell.configure(games[indexPath.row])\n        return cell\n    }\n}\nlet games = [\n    Game(id: 61, title: \"Маяки\", saved: true),\n    Game(id: 62, title: \"Остров\", saved: false)\n]","key":"import UIKit\nstruct Game {\n    let id: Int\n    let title: String\n    let saved: Bool\n}\nfinal class GameCell: UITableViewCell {\n    var representedID: Int?\n    func configure(_ game: Game) {\n        representedID = game.id\n        textLabel?.text = game.title\n        accessoryType = game.saved ? .checkmark : .none\n        imageView?.image = nil\n    }\n    override func prepareForReuse() {\n        super.prepareForReuse()\n        representedID = nil\n    }\n}\nfinal class GameSource: NSObject, UITableViewDataSource, UITableViewDelegate {\n    let games: [Game]\n    private(set) var selectedID: Int?\n    init(games: [Game]) { self.games = games }\n    func tableView(\n        _ tableView: UITableView, numberOfRowsInSection section: Int\n    ) -> Int { games.count }\n    func tableView(\n        _ tableView: UITableView, cellForRowAt indexPath: IndexPath\n    ) -> UITableViewCell {\n        let cell = tableView.dequeueReusableCell(\n            withIdentifier: \"Game\", for: indexPath\n        ) as! GameCell\n        cell.configure(games[indexPath.row])\n        return cell\n    }\n    func tableView(\n        _ tableView: UITableView, didSelectRowAt indexPath: IndexPath\n    ) {\n        selectedID = games[indexPath.row].id\n        tableView.deselectRow(at: indexPath, animated: false)\n    }\n}\nlet games = [\n    Game(id: 61, title: \"Маяки\", saved: true),\n    Game(id: 62, title: \"Остров\", saved: false)\n]\nlet table = UITableView(\n    frame: CGRect(x: 0, y: 0, width: 320, height: 480), style: .plain\n)\nlet source = GameSource(games: games)\ntable.register(GameCell.self, forCellReuseIdentifier: \"Game\")\ntable.dataSource = source\ntable.delegate = source\nsource.tableView(table, didSelectRowAt: IndexPath(row: 1, section: 0))\nassert(source.selectedID == 62)\n\nОбработчик выбора сохраняет 62, не индекс 1. Вручную вызван метод delegate, а не событие реального касания.","points":["`GameSource` дополнительно принимает `UITableViewDelegate`.","Есть `var selectedID: Int?` (можно `private(set)`).","`didSelectRowAt`: `selectedID = games[indexPath.row].id`, потом `deselectRow(at: indexPath, animated: false)`.","`table.delegate = source` рядом с `dataSource`.","Ручной выбор строки 1 даёт `selectedID == 62`, а не 1."],"check":{"accept":[],"must":[{"pat":["UITableViewDataSource, UITableViewDelegate","UITableViewDelegate, UITableViewDataSource","extension GameSource: UITableViewDelegate"],"miss":"GameSource не подписан на UITableViewDelegate. Без этого протокола метод didSelectRowAt не будет вызываться."},{"pat":["var selectedID"],"miss":"Нет свойства selectedID. Выбор хранится в источнике, и тип подойдёт Optional: до выбора ничего не выбрано."},{"pat":["selectedID = $g[$p.row].id ... deselectRow(at: $p, animated: false)","deselectRow(at: $p, animated: false) ... selectedID = $g[$p.row].id","let $x = $g[$p.row] ... selectedID = $x.id ... deselectRow(at: $p, animated: false)","let $x = $g[$p.row] ... deselectRow(at: $p, animated: false) ... selectedID = $x.id"],"miss":"В didSelectRowAt нужно сохранить id игры из массива по строке и снять выделение без анимации. Проверь оба действия."},{"pat":["$t.delegate = $s"],"miss":"Нет table.delegate = source. Таблица сообщает о выборе только своему делегату, и без присваивания didSelectRowAt не вызовется."},{"pat":["$s.tableView($t, didSelectRowAt: IndexPath(row: 1, section: 0))"],"miss":"Не вижу ручного выбора строки 1: вызови метод делегата с IndexPath(row: 1, section: 0) и сверь selectedID с 62."}],"not":[{"pat":["selectedID = $p.row","selectedID = $p.item"],"msg":"Ты сохраняешь индекс строки, а не id игры. После сортировки или удаления индекс укажет на другую игру. Сохраняй id модели."},{"pat":["selectedID = 62","selectedID = 61","selectedID = $g[1].id","selectedID = $g[0].id"],"msg":"Значение вбито константой. Метод должен брать игру из массива по номеру строки, иначе любой выбор даст одно и то же."},{"pat":["deselectRow(at: $p, animated: true)"],"msg":"В задании просят снять выделение без анимации: animated здесь должно быть false."}],"complete":false}},{"id":"table.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"Восстанови Game(id,title,saved), GameCell с representedID, полной configure и prepareForReuse. Напиши requestCover с weak-захватом и проверкой id для локального CoverSource. В ручном контексте настрой игру 61 с галочкой, запусти запрос, переиспользуй ячейку для 63 Лес без галочки, затем доставь обложку 61. Проверь новую подпись, id, отсутствие галочки и картинки. CoverSource сохраняет по одному callback на id и вызывается на главном потоке.","key":"import UIKit\nstruct Game {\n    let id: Int\n    let title: String\n    let saved: Bool\n}\nfinal class GameCell: UITableViewCell {\n    var representedID: Int?\n    func configure(_ game: Game) {\n        representedID = game.id\n        textLabel?.text = game.title\n        accessoryType = game.saved ? .checkmark : .none\n        imageView?.image = nil\n    }\n    override func prepareForReuse() {\n        super.prepareForReuse()\n        representedID = nil\n    }\n}\n@MainActor\nfunc requestCover(cell: GameCell, id: Int, source: CoverSource) {\n    source.load(id: id) { [weak cell] image in\n        guard let cell, cell.representedID == id else { return }\n        cell.imageView?.image = image\n        cell.setNeedsLayout()\n    }\n}\n@MainActor\nfinal class CoverSource {\n    private var pending: [Int: (UIImage) -> Void] = [:]\n    func load(id: Int, done: @escaping (UIImage) -> Void) {\n        pending[id] = done\n    }\n    func finish(id: Int, image: UIImage) {\n        pending.removeValue(forKey: id)?(image)\n    }\n}\n@MainActor\nfunc checkRememberedCell() {\n    let source = CoverSource()\n    let cell = GameCell(style: .default, reuseIdentifier: \"Game\")\n    cell.configure(Game(id: 61, title: \"Маяки\", saved: true))\n    requestCover(cell: cell, id: 61, source: source)\n    cell.prepareForReuse()\n    cell.configure(Game(id: 63, title: \"Лес\", saved: false))\n    source.finish(id: 61, image: UIImage())\n    assert(cell.representedID == 63)\n    assert(cell.textLabel?.text == \"Лес\")\n    assert(cell.accessoryType == .none)\n    assert(cell.imageView?.image == nil)\n}\n\nПосле позднего ответа остаётся игра 63: новая конфигурация сняла галочку и очистила изображение, проверка id отклонила чужую картинку.","points":["`configure` задаёт всё: `representedID`, название, галочку через `? .checkmark : .none` и `image = nil`.","`prepareForReuse` вызывает `super` и сбрасывает `representedID`.","`requestCover`: `[weak cell]` и `guard let cell, cell.representedID == id`.","Порядок: configure 61 → запрос 61 → `prepareForReuse` → configure 63 → `finish(id: 61)`.","Проверки: id 63, «Лес», `.none`, картинка `nil`."],"check":{"accept":["import UIKit\nstruct Game {\n    var id: Int\n    var title: String\n    var saved: Bool\n}\nfinal class GameCell: UITableViewCell {\n    var representedID: Int?\n    func configure(_ game: Game) {\n        representedID = game.id\n        textLabel?.text = game.title\n        accessoryType = game.saved ? .checkmark : .none\n        imageView?.image = nil\n    }\n    override func prepareForReuse() {\n        representedID = nil\n        super.prepareForReuse()\n    }\n}\n@MainActor\nfinal class CoverSource {\n    private var pending: [Int: (UIImage) -> Void] = [:]\n    func load(id: Int, done: @escaping (UIImage) -> Void) {\n        pending[id] = done\n    }\n    func finish(id: Int, image: UIImage) {\n        pending[id]?(image)\n        pending[id] = nil\n    }\n}\n@MainActor\nfunc requestCover(cell: GameCell, id: Int, source: CoverSource) {\n    source.load(id: id) { [weak cell] image in\n        guard cell?.representedID == id else { return }\n        cell?.imageView?.image = image\n        cell?.setNeedsLayout()\n    }\n}\n@MainActor\nfunc checkRemembered() {\n    let source = CoverSource()\n    let cell = GameCell(style: .default, reuseIdentifier: \"Game\")\n    cell.configure(Game(id: 61, title: \"Маяки\", saved: true))\n    requestCover(cell: cell, id: 61, source: source)\n    cell.prepareForReuse()\n    cell.configure(Game(id: 63, title: \"Лес\", saved: false))\n    source.finish(id: 61, image: UIImage())\n    assert(cell.representedID == 63)\n    assert(cell.textLabel?.text == \"Лес\")\n    assert(cell.accessoryType == .none)\n    assert(cell.imageView?.image == nil)\n}"],"must":[{"pat":["struct Game { ... id: Int ... title: String ... saved: Bool ... }"],"miss":"Нет структуры Game с полями id, title и saved (в таком порядке): без неё нечем описать модель ячейки."},{"pat":["func configure(... $g: Game) { ... representedID = $g.id ... textLabel?.text = $g.title ... accessoryType = $g.saved ? .checkmark : .none ... imageView?.image = nil ... }","func configure(... $g: Game) { ... imageView?.image = nil ... representedID = $g.id ... textLabel?.text = $g.title ... accessoryType = $g.saved ? .checkmark ak $a] $i in ... $a!"],"msg":"Принудительное разворачивание weak-ссылки упадёт, если ячейки уже нет. Используй guard let или опциональную цепочку."}],"complete":false}},{"id":"table-b1","kind":"code","type":"Перепиши","title":"Пустой список покупок и владелец","prompt":"Временный ShoppingSource сразу потерян: dataSource слабое. Сохрани источник, удали последнюю позицию, вызови reloadData. Проверь вручную количество 0 и что таблица ссылается на сохранённый источник; не вызывай cellForRowAt для несуществующей строки.","code":"import UIKit\nstruct ShoppingItem { let id: Int; let title: String }\nfinal class ShoppingSource: NSObject, UITableViewDataSource {\n    var items = [ShoppingItem(id: 81, title: \"Хлеб\")]\n    func tableView(\n        _ tableView: UITableView, numberOfRowsInSection section: Int\n    ) -> Int { items.count }\n    func tableView(\n        _ tableView: UITableView, cellForRowAt indexPath: IndexPath\n    ) -> UITableViewCell {\n        let cell = tableView.dequeueReusableCell(\n            withIdentifier: \"Item\", for: indexPath\n        )\n        cell.textLabel?.text = items[indexPath.row].title\n        return cell\n    }\n}\nlet table = UITableView(\n    frame: CGRect(x: 0, y: 0, width: 320, height: 480)\n)\ntable.register(UITableViewCell.self, forCellReuseIdentifier: \"Item\")\ntable.dataSource = ShoppingSource()\nprint(table.dataSource == nil)","key":"import UIKit\nstruct ShoppingItem { let id: Int; let title: String }\nfinal class ShoppingSource: NSObject, UITableViewDataSource {\n    var items = [ShoppingItem(id: 81, title: \"Хлеб\")]\n    func tableView(\n        _ tableView: UITableView, numberOfRowsInSection section: Int\n    ) -> Int { items.count }\n    func tableView(\n        _ tableView: UITableView, cellForRowAt indexPath: IndexPath\n    ) -> UITableViewCell {\n        let cell = tableView.dequeueReusableCell(\n            withIdentifier: \"Item\", for: indexPath\n        )\n        cell.textLabel?.text = items[indexPath.row].title eselectRow(at: indexPath, animated: false)\n    }\n    func selectedName() -> String? {\n        places.first { $0.id == selectedID }?.name\n    }\n}\nlet table = UITableView(\n    frame: CGRect(x: 0, y: 0, width: 320, height: 480)\n)\nlet source = PlacesDelegate()\nsource.tableView(table, didSelectRowAt: IndexPath(row: 1, section: 0))\nsource.places.reverse()\nassert(source.selectedName() == \"Юг\")\n\nВыбор сохраняет 92. После reverse имя ищется по id, а не по устаревшей позиции.","check":{"accept":["func tableView(\n    _ tableView: UITableView, didSelectRowAt indexPath: IndexPath\n) {\n    selectedID = places[indexPath.row].id\n    tableView.deselectRow(at: indexPath, animated: false)\n}\nfunc selectedName() -> String? {\n    guard let id = selectedID else { return nil }\n    return places.first { $0.id == id }?.name\n}","func tableView(\n    _ tableView: UITableView, didSelectRowAt indexPath: IndexPath\n) {\n    let place = places[indexPath.row]\n    selectedID = place.id\n    tableView.deselectRow(at: indexPath, animated: false)\n}\nfunc selectedName() -> String? {\n    for place in places where place.id == selectedID {\n        return place.name\n    }\n    return nil\n}"],"must":[{"pat":["selectedID = $a[$b.row].id","let $x = $a[$b.row] ... selectedID = $x.id"],"miss":"В didSelectRowAt сохраняется не id места. Нужно взять место из массива по строке и записать его id: индекс после сортировки поплывёт."},{"pat":["places.first { ... id == $a ... }?.name","places.first { ... $a == $b.id ... }?.name","places.first(where: { ... id == $a ... })?.name","places.first(where: { ... $a == $b.id ... })?.name","places.filter { ... id == $a ... }.first?.name","for $p in places where $p.id == selectedID { return $p.name }","for $p in places { if $p.id == selectedID { return $p.name } }","places.firstIndex { ... id == $a ... }","places.firstIndex(where: { ... id == $a ... })"],"miss":"selectedName не ищет место по сохранённому id. Нужно найти в массиве место с нужным id и ве let version = requestVersion\n        imageView?.image = nil\n        return { [weak self] image in\n            guard let self, self.representedID == id,\n                  self.requestVersion == version else { return }\n            self.imageView?.image = image\n        }\n    }\n    override func prepareForReuse() {\n        super.prepareForReuse()\n        representedID = nil\n        requestVersion += 1\n    }\n}\nlet cell = AvatarCell(style: .default, reuseIdentifier: \"Avatar\")\nlet first = cell.newRequest(id: 101)\nlet second = cell.newRequest(id: 101)\nlet oldImage = UIImage()\nlet currentImage = UIImage()\nsecond(currentImage)\nfirst(oldImage)\nassert(cell.imageView?.image === currentImage)\n\nТекущая обложка сохраняется, потому что первый callback имеет прежнюю версию. prepareForReuse тоже делает ранее созданные callbacks недействительными.","check":{"accept":["return { [weak self] image in\n    guard let self else { return }\n    guard self.representedID == id else { return }\n    guard self.requestVersion == version else { return }\n    self.imageView?.image = image\n}","return { [weak self] image in\n    guard let self, self.representedID == id else { return }\n    if self.requestVersion == version {\n        self.imageView?.image = image\n    }\n}"],"must":[{"pat":["requestVersion == version","version == requestVersion"],"miss":"Нет сравнения версии запроса с текущей. Версия, запомненная при создании замыкания, должна совпадать с requestVersion на момент ответа."},{"pat":["requestVersion == version else { return }","version == requestVersion else { return }","if requestVersion == version { ... }","if version == requestVersion { ... }","if requestVersion != version { return }","if version != requestVersion { return }"],"miss":"Сравнение не отсекает ответ: если версия не совпала, замыкание должно выйти, не трогая картинку. Проверь guard или if."}],"not":[{"pat":["version == version","requestVersion == requestVersion"],"msg":"Ты сравниваешь значение сам
