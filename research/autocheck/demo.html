se { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\nfunc loadChapter(\n    id: Int, session: URLSession = .shared\n) async throws -> Chapter {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/chapters/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    return try decodeChapter(data: data, response: response)\n}\n\nСначала запрос возвращает пару, затем декодер проверяет статус и читает тело. Ошибки не скрыты.","points":["`let (data, response) = try await session.data(for: request)` — сессия из параметра, а не `.shared` напрямую.","`try` без `?` и `!`: сетевая ошибка (`URLError`) уходит наверх, а не глушится.","`response` не выбрасывается через `_`: пара целиком уходит в `decodeChapter(data: data, response: response)`.","`return try decodeChapter(...)` без `try?`: `LoadError.status` и `DecodingError` тоже доходят до вызывающего кода."],"check":{"accept":[],"must":[{"pat":["try await session.data(for: request ...)"],"miss":"Не вижу try await session.data(for: request): запрос идёт через переданную сессию и готовый URLRequest, а await обязателен."},{"pat":["let ($a, $b) = try await session.data(for: request ...)","let $a = try await session.data(for: request ...)"],"miss":"Результат запроса надо сохранить: это пара из тела и ответа. Без response статус потом не проверить."},{"pat":["return try decodeChapter(data: ..., response: ...)"],"miss":"Не вижу return try decodeChapter(data:response:): пару из запроса надо целиком передать декодеру, он проверит статус и разберёт тело."}],"not":[{"pat":["let ($a, _) = try await","let (_, $a) = try await"],"msg":"Одна половина пары выброшена. Без response не проверить статус, без data нечего декодировать: нужны обе."},{"pat":["try?","try!"],"msg":"try? прячет ошибку, try! роняет приложение. Здесь ошибки должны уходить наверх через простой try."},{"pat":["URLSession.shared.data(...)"],"msg":"Сессия приходит параметром session. Если брать .shared напрямую, подменить её в тесте не получится."},{"pat":["catch"],"msg":"catch здесь прячет ошибку. Функция помечена throws, пусть вызывающий код решает, что делать с ней."}],"complete":true}},{"id":"urls.s3","kind":"code","title":"Ступень 3. Проверь ответ самостоятельно","prompt":"Даны модель и локальный ответ 200. Напиши decodeChapter: проверь HTTP, затем именно 200, затем JSON. При успехе выведи title.","code":"import Foundation\nstruct Chapter: Decodable { let id: Int; let title: String }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\n// Напиши decodeChapter(data:response:)\nlet url = URL(string: \"https://api.example.invalid/chapters/12\")!\nlet data = Data(#\"{\"id\":12,\"title\":\"Первый снег\"}\"#.utf8)\nlet response = HTTPURLResponse(url: url, statusCode: 200,\n                               httpVersion: nil, headerFields: nil)!\ndo {\n    let chapter = try decodeChapter(data: data, response: response)\n    print(chapter.title)\n} catch LoadError.status(let code) {\n    print(\"HTTP \\(code)\")\n} catch { print(\"Другая ошибка\") }","key":"import Foundation\nstruct Chapter: Decodable { let id: Int; let title: String }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\nlet url = URL(string: \"https://api.example.invalid/chapters/12\")!\nlet data = Data(#\"{\"id\":12,\"title\":\"Первый снег\"}\"#.utf8)\nlet response = HTTPURLResponse(url: url, statusCode: 200,\n                               httpVersion: nil, headerFields: nil)!\ndo {\n    let chapter = try decodeChapter(data: data, response: response)\n    print(chapter.title)\n} catch LoadError.status(let code) {\n    print(\"HTTP \\(code)\")\n} catch { print(\"Другая ошибка\") }\n\nВывод «Первый снег». Только подходящий статус разрешает декодирование.","check":{"accept":["func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    if http.statusCode != 200 {\n        throw LoadError.status(http.statusCode)\n    }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    let decoder = JSONDecoder()\n    return try decoder.decode(Chapter.self, from: data)\n}","func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    let chapter = try JSONDecoder().decode(Chapter.self, from: data)\n    return chapter\n}"],"must":[{"pat":["response as? HTTPURLResponse"],"miss":"Не вижу приведения response к HTTPURLResponse: у общего URLResponse нет statusCode, без приведения статус не прочитать."},{"pat":["throw LoadError.notHTTP"],"miss":"Если ответ не HTTP, нужна своя ошибка: бросай notHTTP, а не продолжай и не молчи."},{"pat":["$a.statusCode == 200","$a.statusCode != 200","200 == $a.statusCode","200 != $a.statusCode"],"miss":"Не вижу проверки статуса именно на 200. Контракт обещает успех только с ним, остальные коды в декодер попадать не должны."},{"pat":["throw LoadError.status($a.statusCode)"],"miss":"При чужом статусе надо бросить ошибку status с самим кодом: по нему catch в конце печатает «HTTP код»."},{"pat":["decode(Chapter.self, from: $a)"],"miss":"Не вижу декодирования Chapter из data через JSONDecoder. После проверок функция должна вернуть модель."}],"not":[{"pat":["decode(Chapter.self, from: ...) ... statusCode == 200","decode(Chapter.self, from: ...) ... statusCode != 200"],"msg":"Тело декодируется раньше проверки статуса. Ошибочный ответ с правильным JSON тогда пройдёт как успех: сначала статус, потом JSON."},{"pat":["..< 300","contains($a.statusCode)"],"msg":"Диапазон 2xx пропустит, например, 204, а контракт обещает только 200 с телом. По заданию проверяй именно 200."},{"pat":["try?","try!","as! HTTPURLResponse"],"msg":"try? прячет ошибку, try! и as! роняют приложение. Нужна простая проверка с throw на каждом шаге."},{"pat":["guard $a.statusCode != 200","if $a.statusCode == 200 { throw"],"msg":"Условие перевёрнуто: ошибку надо бросать при статусе не 200, а пропускать дальше только 200."}],"complete":true}},{"id":"urls.s4","kind":"code","title":"Ступень 4. Сервер отказал, глава появилась","prompt":"Функция показывает главу при 503. Исправь порядок и назови результат до и после.","code":"import Foundation\nstruct Chapter: Decodable { let id: Int; let title: String }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\nlet url = URL(string: \"https://api.example.invalid/chapters/12\")!\nlet data = Data(#\"{\"id\":12,\"title\":\"Первый снег\"}\"#.utf8)\nlet response = HTTPURLResponse(url: url, statusCode: 503,\n                               httpVersion: nil, headerFields: nil)!\ndo {\n    let chapter = try decodeChapter(data: data, response: response)\n    print(chapter.title)\n} catch LoadError.status(let code) {\n    print(\"HTTP \\(code)\")\n} catch { print(\"Другая ошибка\") }","key":"import Foundation\nstruct Chapter: Decodable { let id: Int; let title: String }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\nlet url = URL(string: \"https://api.example.invalid/chapters/12\")!\nlet data = Data(#\"{\"id\":12,\"title\":\"Первый снег\"}\"#.utf8)\nlet response = HTTPURLResponse(url: url, statusCode: 503,\n                               httpVersion: nil, headerFields: nil)!\ndo {\n    let chapter = try decodeChapter(data: data, response: response)\n    print(chapter.title)\n} catch LoadError.status(let code) {\n    print(\"HTTP \\(code)\")\n} catch { print(\"Другая ошибка\") }\n\nДо правки — «Первый снег», после — «HTTP 503». Правильный JSON не отменяет ошибочный статус.","check":{"accept":["func decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    if http.statusCode != 200 {\n        throw LoadError.status(http.statusCode)\n    }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}"],"must":[{"pat":["response as? HTTPURLResponse"],"miss":"Не вижу приведения response к HTTPURLResponse: без него statusCode недоступен, и проверять нечего."},{"pat":["throw LoadError.notHTTP"],"miss":"Для ответа не-HTTP нужна своя ошибка notHTTP. Без неё функция либо падает, либо идёт дальше вслепую."},{"pat":["$a.statusCode == 200","$a.statusCode != 200","200 == $a.statusCode","200 != $a.statusCode"],"miss":"Не вижу проверки на 200. Именно её не хватало: при 503 глава показывалась, потому что статус не смотрели."},{"pat":["throw LoadError.status($a.statusCode)"],"miss":"При чужом статусе нужно бросить status с кодом ответа: catch в конце напечатает «HTTP» и номер."}],"not":[{"pat":["decode(Chapter.self, from: ...) ... statusCode == 200","decode(Chapter.self, from: ...) ... statusCode != 200"],"msg":"Проверка статуса стоит после декодирования: к этому моменту глава уже прочитана. Статус надо проверять до JSONDecoder."},{"pat":["..< 300","contains($a.statusCode)"],"msg":"Диапазон 2xx шире контракта: тот обещает только 200. Проверяй именно 200."},{"pat":["try?","try!","as! HTTPURLResponse"],"msg":"try? глотает ошибку, try! и as! роняют программу. Здесь нужен throw с понятной ошибкой."},{"pat":["guard $a.statusCode != 200","if $a.statusCode == 200 { throw"],"msg":"Условие перевёрнуто: бросать надо при статусе не 200, а на 200 идти дальше к декодированию."}],"complete":false}},{"id":"urls.s5","kind":"oral","title":"Ступень 5. Объясни загрузку","prompt":"Своими словами, как на собесе: что → почему → последствия.","code":"Глава 12 загружается через URLSession.\nПочему храним response вместе с data?\nЧем различаются URLError, LoadError.status и DecodingError?\nПочему await не разрешает менять любой UI из любого контекста?","key":"response несёт HTTP-статус, который проверяем до тела. URLError сообщает об отказе транспорта, status — об HTTP-ответе вне контракта, DecodingError — о неподходящих данных успешного ответа. await приостанавливает задачу, а изменение UI требует нужной изоляции MainActor.","check":{"concepts":[{"label":"response хранится рядом с data, чтобы проверить HTTP-статус до декодирования","groups":[["статус","status","код ответ"],["до декод","до тел","до разбор","перед декод","перед тел","перед разбор","сначала","прежде"]],"miss":"Не сказано, зачем нужен response: в нём HTTP-статус, и его проверяют до разбора тела."},{"label":"URLError: отказ транспорта (сеть, соединение)","groups":[["urlerror"],["сет","транспорт","соедин","интернет","доступ","таймаут","timeout","не дошл","не удалось"]],"miss":"Про URLError не сказано главное: это отказ на уровне транспорта, ответ вообще не получен (сети нет, соединение оборвалось)."},{"label":"LoadError.status: ответ получен, но статус вне контракта","groups":[["status","статус"],["не 200","не подходящ","неподходящ","503","404","сервер","вне контракт","неуспеш","ошибочн","http-ответ","http ответ","ответ есть","ответ пришёл","ответ пришел"]],"miss":"Про LoadError.status не сказано: ответ пришёл, но с неподходящим кодом (не 200), и сервер сам сообщил об ошибке."},{"label":"DecodingError: успешный ответ с данными неподходящей формы","groups":[["decodingerror","decoding"],["данн","json","формат","структур","модел","тип","не соответств","не подход","тел"]],"miss":"Про DecodingError не сказано: статус подошёл, но тело не совпало с моделью, например другой тип или нет поля."},{"label":"await приостанавливает задачу; UI меняют только в нужной изоляции (MainActor)","groups":[["mainactor","main actor","главн","основн","изоляц","main thread"],["await","приостанав","возобнов","задач","контекст"]],"miss":"Не сказано про UI: await лишь приостанавливает задачу и не выбирает контекст. Менять интерфейс нужно в MainActor-изоляции."}],"false":[{"groups":[["await разрешает","await позволяет","await делает"],["ui","главн","интерфейс","main"]],"msg":"Похоже, ты говоришь, что await сам делает безопасным изменение UI. Нет: он только приостанавливает задачу, а изоляцию задаёт MainActor."}]}},{"id":"urls.s6","kind":"code","title":"Ступень 6. Результат отменённой задачи","prompt":"Добавь checkCancellation до запроса и после await. Остальной контракт прежний: 200 и JSON главы. Отмена не должна превращаться в успешный результат.","code":"import Foundation\nstruct Chapter: Decodable { let id: Int; let title: String }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\nfunc loadChapter(\n    id: Int, session: URLSession = .shared\n) async throws -> Chapter {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/chapters/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    return try decodeChapter(data: data, response: response)\n}","key":"import Foundation\nstruct Chapter: Decodable { let id: Int; let title: String }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\nfunc loadChapter(\n    id: Int, session: URLSession = .shared\n) async throws -> Chapter {\n    try Task.checkCancellation()\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/chapters/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    try Task.checkCancellation()\n    return try decodeChapter(data: data, response: response)\n}\n\nОбнаруженная отмена бросает CancellationError. Проверка после await закрывает путь к возврату уже ненужной модели.","points":["`try Task.checkCancellation()` стоит первой строкой `loadChapter`, до сборки запроса.","Вторая `try Task.checkCancellation()` — сразу после `try await session.data(for: request)` и до `decodeChapter`.","Отмена бросает `CancellationError` наружу: не `return nil`, не пустая глава и не глушение в `catch`.","Остальной контракт прежний: `HTTPURLResponse`, `statusCode == 200`, затем `decode(Chapter.self, from: data)`."],"check":{"accept":["func loadChapter(\n    id: Int, session: URLSession = .shared\n) async throws -> Chapter {\n    guard !Task.isCancelled else { throw CancellationError() }\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/chapters/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    guard !Task.isCancelled else { throw CancellationError() }\n    return try decodeChapter(data: data, response: response)\n}"],"must":[{"pat":["session.data(for: request ...) ... Task.checkCancellation() ... decodeChapter(data: ..., response: ...)","session.data(for: request ...) ... Task.isCancelled ... decodeChapter(data: ..., response: ...)"],"miss":"Нет проверки отмены после await и до decodeChapter. Пока ждали ответ, задачу могли отменить: без проверки вернётся уже ненужная модель."},{"pat":["Task.checkCancellation()","throw CancellationError()"],"miss":"Отмена должна выбрасывать CancellationError наверх: через checkCancellation или явный throw, а не превращаться в обычный результат."}],"not":[{"pat":["try? Task.checkCancellation()"],"msg":"try? гасит CancellationError, и проверка ничего не останавливает. Нужен обычный try, чтобы ошибка ушла наверх."},{"pat":["if Task.isCancelled { return ... }","guard !Task.isCancelled else { return ... }"],"msg":"Возврат вместо ошибки превращает отмену в «успех» или не компилируется. Отмена должна быть брошена как ошибка."},{"pat":["catch is CancellationError","catch let $a as CancellationError"],"msg":"Ловить CancellationError внутри и глушить его нельзя: вызывающий код не узнает об отмене. Пусть ошибка идёт наверх."}],"complete":true}},{"id":"urls.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"Без готового кода восстанови загрузку длительности главы: Chapter содержит id: Int и duration: Int. GET /chapters/12 обещает только 200 с {\"id\":12,\"duration\":180}. Передай session параметром, проверь положительный id, HTTP и статус, затем декодируй. Ошибки не скрывай. На 204 JSON читать нельзя.","key":"import Foundation\nstruct Chapter: Decodable { let id: Int; let duration: Int }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeChapter(data: Data, response: URLResponse) throws -> Chapter {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}\nfunc loadChapter(\n    id: Int, session: URLSession = .shared\n) async throws -> Chapter {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/chapters/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    return try decodeChapter(data: data, response: response)\n}\n\nВернётся duration 180 только из подходящего ответа. 204 и 503 остановятся на проверке статуса, а неверный тип duration даст ошибку декодирования.","points":["`struct Chapter: Decodable { let id: Int; let duration: Int }`.","`guard id > 0` → `LoadError.invalidID`, адрес `/chapters/\\(id)` через `guard let url` → `LoadError.invalidURL`.","`session: URLSession = .shared` параметром и `let (data, response) = try await session.data(for: request)`.","`response as? HTTPURLResponse` (иначе `notHTTP`) и `statusCode == 200` (иначе `LoadError.status`) — до `JSONDecoder`.","Итог: 180 только из ответа 200; 204 и 503 останавливаются на статусе, неверный тип `duration` даёт `DecodingError`."],"check":{"accept":["struct Chapter: Decodable { let id: Int; let duration: Int }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc loadChapter(\n    id: Int, session: URLSession = .shared\n) async throws -> Chapter {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/chapters/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    let (data, response) = try await session.data(from: url)\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(Chapter.self, from: data)\n}"],"must":[{"pat":["struct Chapter: Decodable ... { ... duration: Int ... }","struct Chapter: Codable ... { ... duration: Int ... }"],"miss":"Не вижу модели Chapter с полем duration типа Int и протоколом Decodable. Без неё декодировать ответ не во что."},{"pat":["as? HTTPURLResponse ... statusCode == 200","as? HTTPURLResponse ... statusCode != 200"],"miss":"Не вижу порядка «приведение к HTTPURLResponse, затем статус именно 200». Без них 204 и 503 пройдут к декодеру."},{"pat":["decode(Chapter.self, from: $a)"],"miss":"Не вижу JSONDecoder().decode(Chapter.self, from: данные): после проверок ответ надо превратить в модель."}],"not":[{"pat":["try?","try!"],"msg":"try? прячет ошибки, try! роняет приложение. По условию ошибки не скрываются: простой try и throw."},{"pat":["as! HTTPURLResponse","URL(string: ...)!"],"msg":"Принудительное приведение или ! роняют приложение при плохих данных. Разворачивай через guard let и бросай ошибку."},{"pat":["..< 300","contains($a.statusCode)"],"msg":"Диапазон 2xx пропустит 204, а там тела нет, и декодер упадёт. По контракту нужен именно 200."},{"pat":["decode(Chapter.self, from: ...) ... statusCode == 200","decode(Chapter.self, from: ...) ... statusCode != 200"],"msg":"Декодирование идёт раньше проверки статуса. Тело ошибочного ответа читать нельзя: сначала статус, потом JSON."}],"complete":true}},{"id":"urls-b1","kind":"code","type":"Допиши","title":"Велостанция","prompt":"Заполни сетевой шаг и проверку ответа. GET станции 12 при 200 возвращает {\"id\":12,\"available\":3}; 503 нельзя декодировать как успех.","code":"import Foundation\nstruct BikeStation: Decodable { let id: Int; let available: Int }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeBikeStation(\n    data: Data, response: URLResponse\n) throws -> BikeStation {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard /* успешный статус */ else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(BikeStation.self, from: data)\n}\nfunc loadBikeStation(\n    id: Int, session: URLSession = .shared\n) async throws -> BikeStation {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/bike-stations/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = /* запрос */\n    return try decodeBikeStation(data: data, response: response)\n}","key":"import Foundation\nstruct BikeStation: Decodable { let id: Int; let available: Int }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeBikeStation(\n    data: Data, response: URLResponse\n) throws -> BikeStation {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(BikeStation.self, from: data)\n}\nfunc loadBikeStation(\n    id: Int, session: URLSession = .shared\n) async throws -> BikeStation {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/bike-stations/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    return try decodeBikeStation(data: data, response: response)\n}\n\nЛокальный ответ 200 даёт available 3. Статус проверяется до данных.","check":{"accept":["guard (200..<300).contains(http.statusCode) else { throw LoadError.status(http.statusCode) }","let (data, response) = try await session.data(for: request, delegate: nil)"],"must":[{"pat":["http.statusCode == 200","200 == http.statusCode","(200..<300).contains(http.statusCode)","http.statusCode >= 200 && http.statusCode < 300","200..<300 ~= http.statusCode"],"miss":"Не вижу условия успешного статуса. В guard стоит то, что должно быть истиной для успеха, иначе 503 пройдёт к декодеру."},{"pat":["try await session.data(for: request ...)"],"miss":"Не вижу запроса try await session.data(for: request): сеть идёт через переданную сессию и готовый запрос, с await."}],"not":[{"pat":["try?","try!"],"msg":"try? глотает ошибку, try! роняет приложение. Здесь нужен обычный try, ошибка уйдёт наверх по throws."},{"pat":["statusCode != 200"],"msg":"Условие guard перевёрнуто: он пропускает дальше, когда условие истинно. Для успеха нужно сравнение на равенство."},{"pat":["URLSession.shared.data(...)"],"msg":"Запрос должен идти через session из параметра, а не через .shared напрямую: так сессию можно подменить."},{"pat":["statusCode != 503","statusCode == 503"],"msg":"Проверка одного кода 503 пропускает 404, 500 и другие. Условие должно описывать успех, а не одну известную ошибку."}],"complete":true}},{"id":"urls-b2","kind":"code","type":"Найди ошибку","title":"Быстрый выбор главы аудиокниги","prompt":"Экран уже выбрал 13. Сначала пришёл ответ 13, потом 12. Исправь применение по актуальному selectedID, не меняя порядок ответов. UI и сеть здесь не запускаются.","code":"struct Chapter { let id: Int; let title: String }\nstruct ChapterScreen {\n    var selectedID = 13\n    private(set) var title = \"Загрузка\"\n    mutating func apply(_ chapter: Chapter) {\n        title = chapter.title\n    }\n}\nvar screen = ChapterScreen()\nscreen.apply(Chapter(id: 13, title: \"Глава 13\"))\nscreen.apply(Chapter(id: 12, title: \"Глава 12\"))\nprint(screen.title)","key":"struct Chapter { let id: Int; let title: String }\nstruct ChapterScreen {\n    var selectedID = 13\n    private(set) var title = \"Загрузка\"\n    mutating func apply(_ chapter: Chapter) {\n        guard chapter.id == selectedID else { return }\n        title = chapter.title\n    }\n}\nvar screen = ChapterScreen()\nscreen.apply(Chapter(id: 13, title: \"Глава 13\"))\nscreen.apply(Chapter(id: 12, title: \"Глава 12\"))\nprint(screen.title)\n\nДо правки «Глава 12», после — «Глава 13». Сверяем текущий выбор при применении, а не только захваченный id запроса. Повторы запросов того же id потребуют дополнительного номера запроса.","check":{"accept":["mutating func apply(_ chapter: Chapter) {\n    if chapter.id == selectedID {\n        title = chapter.title\n    }\n}","mutating func apply(_ chapter: Chapter) {\n    guard selectedID == chapter.id else { return }\n    title = chapter.title\n}"],"must":[{"pat":["chapter.id == selectedID","selectedID == chapter.id","chapter.id != selectedID","selectedID != chapter.id"],"miss":"Не вижу сравнения id пришедшей главы с selectedID. Устаревший ответ можно отличить только сверкой с текущим выбором."},{"pat":["guard chapter.id == selectedID else { return }","guard selectedID == chapter.id else { return }","if chapter.id != selectedID { return }","if selectedID != chapter.id { return }","if chapter.id == selectedID { title = chapter.title }","if selectedID == chapter.id { title = chapter.title }"],"miss":"Сверка должна стоять до присвоения title: чужая глава не применяется вообще. Проверь, что присвоение защищено условием."},{"pat":["title = chapter.title"],"miss":"Присвоение title = chapter.title для актуальной главы должно остаться: иначе экран вообще не обновится."}],"not":[{"pat":["apply(Chapter(id: 12, title: \"Глава 12\")) ... apply(Chapter(id: 13, title: \"Глава 13\"))"],"msg":"Ты поменял порядок ответов. По условию он остаётся прежним: сначала 13, потом 12. Чинится сам apply."},{"pat":["selectedID = chapter.id"],"msg":"Так выбор подгоняется под пришедший ответ, и защита исчезает. selectedID — то, что хочет пользователь, его не трогают."},{"pat":["title = \"Глава 13\"","print(\"Глава 13\")","chapter.id == 13","chapter.id != 12","chapter.id == 12"],"msg":"Подгонка под конкретный пример. Сравнивай с selectedID, а не с константой: проверка должна работать при любом выборе."},{"pat":["title = chapter.title ... guard","title = chapter.title ... chapter.id == selectedID"],"msg":"Проверка стоит после присвоения: title уже изменён. Сверку надо сделать до записи."}],"complete":true}},{"id":"urls-b3","kind":"code","type":"Допиши","title":"Свободные стиральные машины","prompt":"Восстанови проверку HTTP и именно 200 до decode. GET комнаты 12 отдаёт {\"id\":12,\"available\":2}. Для 204 контракт запрещает декодирование.","code":"import Foundation\nstruct LaundryRoom: Decodable { let id: Int; let available: Int }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeLaundryRoom(\n    data: Data, response: URLResponse\n) throws -> LaundryRoom {\n    // Проверь тип ответа и статус\n    return try JSONDecoder().decode(LaundryRoom.self, from: data)\n}\nfunc loadLaundryRoom(\n    id: Int, session: URLSession = .shared\n) async throws -> LaundryRoom {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/laundry-rooms/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    return try decodeLaundryRoom(data: data, response: response)\n}","key":"import Foundation\nstruct LaundryRoom: Decodable { let id: Int; let available: Int }\nenum LoadError: Error {\n    case invalidID, invalidURL, notHTTP\n    case status(Int)\n}\nfunc decodeLaundryRoom(\n    data: Data, response: URLResponse\n) throws -> LaundryRoom {\n    guard let http = response as? HTTPURLResponse\n    else { throw LoadError.notHTTP }\n    guard http.statusCode == 200\n    else { throw LoadError.status(http.statusCode) }\n    return try JSONDecoder().decode(LaundryRoom.self, from: data)\n}\nfunc loadLaundryRoom(\n    id: Int, session: URLSession = .shared\n) async throws -> LaundryRoom {\n    guard id > 0 else { throw LoadError.invalidID }\n    let address = \"https://api.example.invalid/laundry-rooms/\\(id)\"\n    guard let url = URL(string: address) else {\n        throw LoadError.invalidURL\n    }\n    var request = URLRequest(url: url)\n    request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n    let (data, response) = try await session.data(for: request)\n    return try decodeLaundryRoom(data: data, response: response)\n}\n\navailable равен 2 только после успешного HTTP и декодирования. Для 204 получим LoadError.status(204).","check":{"accept":["guard let http = response as? HTTPURLResponse\nelse { throw LoadError.notHTTP }\nif http.statusCode != 200 {\n    throw LoadError.status(http.statusCode)\n}"],"must":[{"pat":["response as? HTTPURLResponse"],"miss":"Не вижу приведения response к HTTPURLResponse. У общего URLResponse статуса нет, без приведения проверять нечего."},{"pat":["throw LoadError.notHTTP"],"miss":"Для ответа не-HTTP не хватает ошибки: бросай notHTTP, иначе такой ответ молча уйдёт к декодеру."},{"pat":["$a.statusCode == 200","$a.statusCode != 200","200 == $a.statusCode","200 != $a.statusCode"],"miss":"Не вижу сравнения статуса с 200. Контракт запрещает декодировать любые другие коды, в том числе 204."},{"pat":["throw LoadError.status($a.statusCode)"],"miss":"При статусе не 200 нужно бросить status с самим кодом: так вызывающий код увидит, что именно пришло, например 204."}],"not":[{"pat":["decode(LaundryRoom.self, from: ...) ... statusCode == 200","decode(LaundryRoom.self, from: ...) ... statusCode != 200"],"msg":"Декодирование стоит раньше проверки. Для 204 тела нет, декодер упадёт не с той ошибкой: статус проверяется до JSON."},{"pat":["..< 300","contains($a.statusCode)"],"msg":"Диапазон 2xx пропустит 204, а по контракту декодировать можно только 200. Сравнивай именно с 200."},{"pat":["try?","try!","as! HTTPURLResponse"],"msg":"try? прячет ошибку, try! и as! роняют приложение. Нужны проверки с throw на каждом шаге."},{"pat":["guard $a.statusCode != 200","if $a.statusCode == 200 { throw"],"msg":"Условие перевёрнуто: бросать надо при статусе не 200, а на 200 идти дальше к декодированию."}],"complete":true}},{"id":"weak.s1","kind":"predict","title":"Ступень 1. Найди живого делегата","prompt":"Назови точный вывод, включая последнее освобождение. Почему после screen = nil делегат не nil? Последняя строка очищает связь для завершения теста.","code":"protocol DictationDelegate: AnyObject {\n    func didFinish()\n}\nfinal class DictationPlayer {\n    var delegate: (any DictationDelegate)?\n    func finish() { delegate?.didFinish() }\n}\nfinal class DictationScreen: DictationDelegate {\n    let id = 18\n    let player = DictationPlayer()\n    init() { player.delegate = self }\n    func didFinish() { print(\"Готово \\(id)\") }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet player = screen!.player\nplayer.finish()\nscreen = nil\nprint(player.delegate == nil)\nplayer.delegate = nil","key":"Готово 18\nfalse\nЭкран освобождён\n\nПроигрыватель держит экран через сильный delegate. Очистка delegate разрывает эту связь; внешний player не удерживает экран после неё.","check":{"outs":[["Готово 18","false","Экран освобождён"]],"why":["finish() вызывает didFinish у делегата, это экран, он печатает свой id.","delegate у player сильный и всё ещё держит экран, поэтому после screen = nil он не nil, сравнение даёт false.","Последняя строка обнуляет delegate: последняя сильная ссылка на экран исчезает, и вызывается deinit."],"wrong":[{"out":["Готово 18","Экран освобождён","true"],"msg":"Ты решил, что экран освободился на screen = nil. Но delegate сильный и держит его: освобождение случится только после player.delegate = nil."},{"out":["Готово 18","false"],"msg":"Забыто последнее освобождение. Когда delegate обнулён, у экрана не остаётся владельцев, и deinit печатает свою строку."},{"out":["Готово 18","true","Экран освобождён"],"msg":"Ты считаешь delegate слабым. Здесь он обычное свойство, то есть сильная ссылка: после screen = nil он остаётся не nil."}]}},{"id":"weak.s2","kind":"code","title":"Ступень 2. Заполни слабую связь","prompt":"Допиши weak var delegate с Optional протокола AnyObject и вызов finish через optional chaining. Экран и проверка уже даны.","code":"protocol DictationDelegate: AnyObject {\n    func didFinish()\n}\nfinal class DictationPlayer {\n    // Объяви слабого делегата\n    func finish() { /* Сообщи делегату */ }\n}\nfinal class DictationScreen: DictationDelegate {\n    let id = 18\n    let player = DictationPlayer()\n    init() { player.delegate = self }\n    func didFinish() { print(\"Готово \\(id)\") }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet player = screen!.player\nplayer.finish()\nscreen = nil\nprint(player.delegate == nil)","key":"protocol DictationDelegate: AnyObject {\n    func didFinish()\n}\nfinal class DictationPlayer {\n    weak var delegate: (any DictationDelegate)?\n    func finish() { delegate?.didFinish() }\n}\nfinal class DictationScreen: DictationDelegate {\n    let id = 18\n    let player = DictationPlayer()\n    init() { player.delegate = self }\n    func didFinish() { print(\"Готово \\(id)\") }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet player = screen!.player\nplayer.finish()\nscreen = nil\nprint(player.delegate == nil)\n\nВывод: «Готово 18», «Экран освобождён», true. Обратная связь не стала владельцем экрана.","check":{"accept":["weak var delegate: DictationDelegate?\nfunc finish() { delegate?.didFinish() }","weak var delegate: (any DictationDelegate)? = nil\nfunc finish() { delegate?.didFinish() }"],"must":[{"pat":["weak var delegate: (any DictationDelegate)?","weak var delegate: DictationDelegate?","weak var delegate: (any DictationDelegate)? = nil","weak var delegate: DictationDelegate? = nil"],"miss":"Не вижу слабого свойства: нужен weak var delegate с типом Optional от протокола. Без weak проигрыватель будет держать экран."},{"pat":["delegate?.didFinish()"],"miss":"Вызов делегата должен идти через optional chaining: после исчезновения экрана delegate станет nil, и вызов тихо пропустится."}],"not":[{"pat":["unowned var delegate","unowned let delegate","weak let delegate"],"msg":"Здесь нужен weak var: ссылка обнуляется сама и допускает nil. unowned при мёртвом объекте упадёт, а weak let не компилируется."},{"pat":["delegate!.didFinish()","delegate!"],"msg":"Force unwrap: после освобождения экрана delegate станет nil, и приложение упадёт. Вызывай через ?."},{"pat":["weak var delegate: DictationScreen","weak var delegate: DictationScreen?"],"msg":"Делегат описан протоколом, а не конкретным экраном: так проигрыватель ни от чего экранного не зависит."}],"complete":true}},{"id":"weak.s3","kind":"code","title":"Ступень 3. Напиши контракт делегата","prompt":"Самостоятельно напиши DictationDelegate: AnyObject с didFinish и DictationPlayer с weak var delegate и finish. Добавь данные определения перед экраном.","code":"// Напиши протокол и проигрыватель\nfinal class DictationScreen: DictationDelegate {\n    let id = 18\n    let player = DictationPlayer()\n    init() { player.delegate = self }\n    func didFinish() { print(\"Готово \\(id)\") }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet player = screen!.player\nplayer.finish()\nscreen = nil\nprint(player.delegate == nil)","key":"protocol DictationDelegate: AnyObject {\n    func didFinish()\n}\nfinal class DictationPlayer {\n    weak var delegate: (any DictationDelegate)?\n    func finish() { delegate?.didFinish() }\n}\nfinal class DictationScreen: DictationDelegate {\n    let id = 18\n    let player = DictationPlayer()\n    init() { player.delegate = self }\n    func didFinish() { print(\"Готово \\(id)\") }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet player = screen!.player\nplayer.finish()\nscreen = nil\nprint(player.delegate == nil)\n\nПисьменно восстановлены ограничение AnyObject и слабое Optional-свойство; оба нужны для обратной связи.","check":{"accept":["protocol DictationDelegate: AnyObject {\n    func didFinish()\n}\nfinal class DictationPlayer {\n    weak var delegate: DictationDelegate?\n    func finish() {\n        if let delegate { delegate.didFinish() }\n    }\n}","protocol DictationDelegate: class {\n    func didFinish()\n}\nclass DictationPlayer {\n    weak var delegate: (any DictationDelegate)?\n    func finish() { delegate?.didFinish() }\n}"],"must":[{"pat":["protocol DictationDelegate: AnyObject ... { ... }","protocol DictationDelegate: class ... { ... }"],"miss":"Протокол не ограничен классами. weak работает только для ссылочных типов, поэтому нужно ограничение AnyObject."},{"pat":["protocol DictationDelegate ... { ... func didFinish() ... }"],"miss":"В протоколе не вижу требования didFinish(): именно его проигрыватель будет вызывать у делегата."},{"pat":["class DictationPlayer ... { ... }"],"miss":"Не вижу класса DictationPlayer. Проигрыватель должен быть классом: экран хранит его и ему же назначает делегата."},{"pat":["weak var delegate: (any DictationDelegate)?","weak var delegate: DictationDelegate?","weak var delegate: (any DictationDelegate)? = nil","weak var delegate: DictationDelegate? = nil"],"miss":"Не вижу слабого делегата: нужен weak var с типом Optional от протокола. Иначе проигрыватель и экран будут держать друг друга."},{"pat":["func finish() { ... delegate?.didFinish() ... }","func finish() { if let $a = delegate { $a.didFinish() } }","func finish() { guard let $a = delegate else { return } $a.didFinish() }"],"miss":"В finish не вижу безопасного вызова didFinish у optional-делегата: через optional chaining или развёртывание, без force unwrap."}],"not":[{"pat":["unowned var delegate","unowned let delegate","weak let delegate"],"msg":"Для делегата-Optional нужен weak var. unowned не обнуляется и при мёртвом экране упадёт, weak let не компилируется."},{"pat":["protocol DictationDelegate {"],"msg":"Протокол без AnyObject: weak на нём не скомпилируется, он может описывать и структуры. Ограничь его классами."},{"pat":["struct DictationPlayer"],"msg":"weak имеет смысл только в классе: у структуры нет общей идентичности, а экран получает ссылку на один и тот же проигрыватель."},{"pat":["delegate!.didFinish()","delegate!"],"msg":"Force unwrap делегата упадёт, когда экран исчезнет. Вызывай через optional chaining."}],"complete":true}},{"id":"weak.s4","kind":"code","title":"Ступень 4. Действие пережило экран","prompt":"В replay выбран unowned, но его вызывают после screen = nil. Исправь захват на weak и обработай исчезнувший экран фразой «Экран закрыт». Не убирай второй вызов.","code":"final class DictationScreen {\n    let id = 18\n    func makeReplay() -> () -> Void {\n        return { [unowned self] in\n            print(\"Повтор \\(self.id)\")\n        }\n    }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet replay = screen!.makeReplay()\nreplay()\nscreen = nil\nreplay()","key":"final class DictationScreen {\n    let id = 18\n    func makeReplay() -> () -> Void {\n        return { [weak self] in\n            guard let self else { print(\"Экран закрыт\"); return }\n            print(\"Повтор \\(self.id)\")\n        }\n    }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet replay = screen!.makeReplay()\nreplay()\nscreen = nil\nreplay()\n\nСначала «Повтор 18», затем «Экран освобождён», затем «Экран закрыт». Исходник аварийно завершается при последнем обращении к освобождённому self.","check":{"accept":["return { [weak self] in\n    if let self {\n        print(\"Повтор \\(self.id)\")\n    } else {\n        print(\"Экран закрыт\")\n    }\n}"],"must":[{"pat":["[weak self]"],"miss":"Захват не стал слабым. Замени unowned на weak: действие живёт дольше экрана, и self внутри должен уметь стать nil."},{"pat":["guard let self else { ... print(\"Экран закрыт\") ... }","guard let $a = self else { ... print(\"Экран закрыт\") ... }","if let self { ... } else { ... print(\"Экран закрыт\") ... }","if let $a = self { ... } else { ... print(\"Экран закрыт\") ... }"],"miss":"Не вижу ветки для исчезнувшего экрана: развернуть self безопасно и в запасной ветке напечатать «Экран закрыт»."},{"pat":["print(\"Повтор \\(self.id)\")","print(\"Повтор \\(id)\")","print(\"Повтор \\(strongSelf.id)\")"],"miss":"Не вижу печати «Повтор» с id для живого экрана. Эта ветка должна остаться: при живом экране вывод прежний."}],"not":[{"pat":["unowned"],"msg":"unowned остаётся: при позднем вызове self уже освобождён, и вызов упадёт. Нужен weak, который становится nil."},{"pat":["self!"],"msg":"Force unwrap слабого self упадёт точно так же, как unowned. Развёртывай через guard let или if let."},{"pat":["guard let self else { return }","guard let $a = self else { return }"],"msg":"Молчаливый return: экран закрыт, но сообщения нет. По заданию в этой ветке надо напечатать фразу."}],"complete":true}},{"id":"weak.s5","kind":"oral","title":"Ступень 5. Объясни время жизни","prompt":"Своими словами, как на собесе: что → почему → последствия.","code":"Почему делегат слабый? Что случится с replay после закрытия? Почему private-подсказке подходит unowned, а внешнему replay — нет?","key":"weak-делегат разрывает обратное сильное владение; AnyObject разрешает слабую ссылку на экземпляр класса. После закрытия weak-захват становится nil и replay выбирает ветку «Экран закрыт». unowned у приватной подсказки оправдан интерфейсом: её используют только через живую сессию и не отдают наружу. У внешнего replay этой гарантии нет.","check":{"concepts":[{"label":"делегат слабый, чтобы не было цикла сильных ссылок","groups":[["слаб","weak"],["цикл","retain","сильн","удержива","взаимн","утечк","держат друг"]],"miss":"Не сказано главное: если делегат сильный, экран и проигрыватель держат друг друга, и память не освободится. Слабая ссылка разрывает цикл."},{"label":"AnyObject позволяет weak: протокол только для классов","groups":[["anyobject"],["класс","ссылочн","weak","слаб"]],"miss":"Не упомянут AnyObject: weak возможен только для экземпляров классов, поэтому протокол ограничивают классами."},{"label":"после закрытия weak-захват становится nil, replay идёт в ветку «Экран закрыт»","groups":[["nil","обнул","пуст","исчез","не существ","освобожд"],["weak","слаб"],["закрыт","guard","ветк","else","не упад","не крэш","не краш"]],"miss":"Не сказано, что будет с replay: слабый self после закрытия становится nil, и действие уходит в ветку «Экран закрыт», не падая."},{"label":"unowned при мёртвом объекте падает","groups":[["unowned"],["крэш","краш","упад","авар","crash","падени","освобожд","мёртв","мертв","не nil","не обнул"]],"miss":"Про unowned не сказано последствие: он не становится nil, и обращение к освобождённому объекту обрушит приложение."},{"label":"приватной подсказке unowned подходит: её не отдают наружу, живёт при живой сессии; у внешнего replay такой гарантии нет","groups":[["гарант","жив","пережить","переживёт","переживет","private","приват","внутрен"],["внешн","снаружи","наружу","сохран","хранят","хранит","отдан","отдают","отдаёт","отдает","нет"]],"miss":"Не объяснено различие: подсказка приватная и не переживёт сессию, поэтому unowned безопасен. Внешний replay сохраняют и вызывают позже, гарантии жизни нет."}],"false":[{"groups":[["слаб","weak"],["чтобы экран не освобожд","чтобы не освобожд","не даёт освобод","не дает освобод","чтобы экран жил","чтобы экран остав"]],"msg":"Слабая ссылка нужна не для того, чтобы экран жил дольше. Наоборот: она не удерживает его, и экран может освободиться."}]}},{"id":"weak.s6","kind":"code","title":"Ступень 6. Выбери связь для подсказки","prompt":"Напиши DictationHint с unowned let owner: DictationSession и show, который печатает owner.id. Почему здесь подходит unowned? Сессия не возвращает hint наружу, а showHint выполняется только при живой сессии.","code":"// Напиши DictationHint\nfinal class DictationSession {\n    let id = 18\n    private lazy var hint = DictationHint(owner: self)\n    func showHint() { hint.show() }\n}\nlet session = DictationSession()\nsession.showHint()","key":"final class DictationHint {\n    unowned let owner: DictationSession\n    init(owner: DictationSession) { self.owner = owner }\n    func show() { print(owner.id) }\n}\nfinal class DictationSession {\n    let id = 18\n    private lazy var hint = DictationHint(owner: self)\n    func showHint() { hint.show() }\n}\nlet session = DictationSession()\nsession.showHint()\n\nВывод 18. Подсказка не может пережить сессию через публичный интерфейс и используется при живом владельце. Если условие изменится, выбор нужно пересмотреть.","check":{"accept":[],"must":[{"pat":["class DictationHint ... { ... }"],"miss":"Не вижу класса DictationHint. Подсказка хранится в lazy var сессии и создаётся как DictationHint(owner: self), поэтому нужен класс."},{"pat":["unowned let owner: DictationSession"],"miss":"Не вижу свойства unowned let owner типа DictationSession. Это связь без владения: подсказка не держит сессию, цикла нет."},{"pat":["init(owner: DictationSession) { ... owner = owner ... }","init(owner $a: DictationSession) { ... owner = $a ... }"],"miss":"Не вижу init(owner:) с присвоением свойства. Сессия создаёт подсказку вызовом DictationHint(owner: self), метка owner нужна."},{"pat":["func show() { ... print(owner.id) ... }"],"miss":"Не вижу метода show, который печатает owner.id. Через него showHint сессии выводит 18."}],"not":[{"pat":["weak let owner","weak var owner"],"msg":"Задание просит unowned let. weak let не компилируется, а weak var заставил бы работать с Optional, хотя владелец тут всегда жив."},{"pat":["owner: DictationSession?"],"msg":"Тип owner сделан Optional, хотя связь должна быть неопциональной. Тогда owner.id не скомпилируется без развёртывания."},{"pat":["owner?.id","owner!.id"],"msg":"owner неопциональный: ни ?, ни ! тут не нужны. Если пришлось их писать, тип свойства задан неверно."}],"complete":false}},{"id":"weak.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"По памяти создай DictationScreen с id 18, deinit «Экран освобождён» и makeProgress(), возвращающим действие с weak self. Живой экран печатает «Прогресс 18», исчезнувший — «Экран закрыт». Сохрани действие снаружи, вызови до и после screen = nil; восстанови guard let, не удаляя поздний вызов.","key":"final class DictationScreen {\n    let id = 18\n    func makeProgress() -> () -> Void {\n        return { [weak self] in\n            guard let self else { print(\"Экран закрыт\"); return }\n            print(\"Прогресс \\(self.id)\")\n        }\n    }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet replay = screen!.makeProgress()\nreplay()\nscreen = nil\nreplay()\n\nВывод: «Прогресс 18», «Экран освобождён», «Экран закрыт». Это другое событие диктанта с тем же контрактом позднего вызова.","check":{"accept":["final class DictationScreen {\n    let id = 18\n    func makeProgress() -> () -> Void {\n        return { [weak self] in\n            if let self {\n                print(\"Прогресс \\(self.id)\")\n            } else {\n                print(\"Экран закрыт\")\n            }\n        }\n    }\n    deinit { print(\"Экран освобождён\") }\n}\nvar screen: DictationScreen? = DictationScreen()\nlet replay = screen!.makeProgress()\nreplay()\nscreen = nil\nreplay()"],"must":[{"pat":["guard let self else { ... print(\"Экран закрыт\") ... }","guard let $a = self else { ... print(\"Экран закрыт\") ... }","if let self { ... } else { ... print(\"Экран закрыт\") ... }","if let $a = self { ... } else { ... print(\"Экран закрыт\") ... }"],"miss":"Не вижу развёртывания слабого self с запасной веткой: если экрана нет, надо напечатать «Экран закрыт», а не обращаться к id."},{"pat":["print(\"Прогресс \\(self.id)\")","print(\"Прогресс \\(id)\")","print(\"Прогресс \\(strongSelf.id)\")"],"miss":"Для живого экрана не вижу печати «Прогресс» с id. Эта ветка должна работать при первом вызове."},{"pat":["let $a = screen!.makeProgress() ... $a() ... screen = nil ... $a()","var $a = screen!.makeProgress() ... $a() ... screen = nil ... $a()","let $a = screen?.makeProgress() ... $a?() ... screen = nil ... $a?()","let $a = screen!.makeProgress() $a() screen = nil $a()"],"miss":"Действие надо сохранить в переменную вне экрана и вызвать дважды: до screen = nil и после него. Поздний вызов убирать нельзя."}],"not":[{"pat":["unowned"],"msg":"unowned: после screen = nil поздний вызов обратится к освобождённому экрану и упадёт. Нужен слабый захват."},{"pat":["guard let self else { return }","guard let $a = self else { return }"],"msg":"Молчаливый return: «Экран закрыт» не напечатается. По условию в этой ветке есть вывод."}],"complete":true}},{"id":"weak-b1","kind":"code","type":"Допиши","title":"Подключение пульта лампы","prompt":"Делегат создан слишком ненадолго. Сохрани Receiver в сильном local receiver до завершения сигнала через withExtendedLifetime(receiver). Оставь delegate слабым: цель — обеспечить владельца, а не вернуть сильную обратную связь.","code":"protocol LampDelegate: AnyObject { func didChange() }\nfinal class LampRemote {\n    weak var delegate: (any LampDelegate)?\n    func signal() { delegate?.didChange() }\n}\nfinal class Receiver: LampDelegate {\n    func didChange() { print(\"Свет включён\") }\n}\nlet remote = LampRemote()\n// Создай receiver, назначь delegate и удержи на время signal","key":"protocol LampDelegate: AnyObject { func didChange() }\nfinal class LampRemote {\n    weak var delegate: (any LampDelegate)?\n    func signal() { delegate?.didChange() }\n}\nfinal class Receiver: LampDelegate {\n    func didChange() { print(\"Свет включён\") }\n}\nlet remote = LampRemote()\nlet receiver = Receiver()\nremote.delegate = receiver\nwithExtendedLifetime(receiver) { remote.signal() }\n\nВывод «Свет включён». У получателя есть сильный владелец на время события; weak остаётся обратной связью.","check":{"accept":["let receiver = Receiver()\nremote.delegate = receiver\nwithExtendedLifetime(receiver) {\n    remote.signal()\n}","let receiver = Receiver()\nremote.delegate = receiver\nremote.signal()\nwithExtendedLifetime(receiver) {}"],"must":[{"pat":["let receiver = Receiver()","var receiver = Receiver()"],"miss":"Не вижу локальной сильной переменной receiver с созданным Receiver. Слабый delegate сам объект не удерживает, нужен владелец."},{"pat":["remote.delegate = receiver"],"miss":"Получатель не назначен делегату пульта. Без этого signal() некому будет передать событие."},{"pat":["withExtendedLifetime(receiver) { ... remote.signal() ... }","withExtendedLifetime(receiver, { ... remote.signal() ... })","remote.signal() ... withExtendedLifetime(receiver) { ... }"],"miss":"Не вижу удержания receiver на время сигнала через withExtendedLifetime: вызов signal должен быть внутри него, иначе объект могут освободить раньше."}],"not":[{"pat":["remote.delegate = Receiver()","withExtendedLifetime(Receiver())","Receiver().signal()"],"msg":"Получатель создан прямо в присваивании. Делегат слабый, а других владельцев нет: объект исчезнет сразу, и сигнал не дойдёт."},{"pat":["remote.signal() ... remote.delegate = receiver"],"msg":"Сигнал отправлен до назначения делегата: на этот момент получателя у пульта ещё нет, и вывода не будет."},{"pat":["withExtendedLifetime(receiver) { } ... remote.signal()","withExtendedLifetime(receiver) {} ... remote.signal()"],"msg":"Сигнал вызван после withExtendedLifetime: удержание уже закончилось. Либо signal внутри замыкания, либо удержание после него."}],"complete":true}},{"id":"weak-b2","kind":"code","type":"Найди ошибку","title":"Вращение модели планеты","prompt":"Кнопка останется в панели после удаления модели. Замени unowned на weak, для исчезнувшей модели напечатай «Модель удалена», не убирай action().","code":"final class PlanetModel {\n    let id = 6\n    func makeAction() -> () -> Void {\n        { [unowned self] in print(self.id) }\n    }\n}\nvar model: PlanetModel? = PlanetModel()\nlet action = model!.makeAction()\nmodel = nil\naction()","key":"final class PlanetModel {\n    let id = 6\n    func makeAction() -> () -> Void {\n        { [weak self] in\n            guard let self else { print(\"Модель удалена\"); return }\n            print(self.id)\n        }\n    }\n}\nvar model: PlanetModel? = PlanetModel()\nlet action = model!.makeAction()\nmodel = nil\naction()\n\nВывод «Модель удалена». Сохранённая кнопка не имеет гарантии жизни модели.","check":{"accept":["{ [weak self] in\n    if let self {\n        print(self.id)\n    } else {\n        print(\"Модель удалена\")\n    }\n}"],"must":[{"pat":["[weak self]"],"miss":"Захват остался несобственным. Кнопка живёт дольше модели, поэтому self внутри должен быть слабым и уметь стать nil."},{"pat":["guard let self else { ... print(\"Модель удалена\") ... }","guard let $a = self else { ... print(\"Модель удалена\") ... }","if let self { ... } else { ... print(\"Модель удалена\") ... }","if let $a = self { ... } else { ... print(\"Модель удалена\") ... }"],"miss":"Не вижу ветки для удалённой модели: развернуть self безопасно и в запасной ветке напечатать «Модель удалена»."},{"pat":["print(self.id)","print(strongSelf.id)","print($a.id)"],"miss":"Живая ветка потерялась: при существующей модели действие по-прежнему должно печатать её id."}],"not":[{"pat":["unowned"],"msg":"unowned остаётся: модель удалена, а кнопка вызывает действие, и обращение к освобождённому объекту обрушит приложение."},{"pat":["guard let self else { return }","guard let $a = self else { return }"],"msg":"Молчаливый return: по заданию для исчезнувшей модели надо напечатать фразу, а не просто выйти."},{"pat":["self?.id","self!.id"],"msg":"self? даёт Optional в выводе, а self! падает на nil. Сначала разверни self через guard let или if let."}],"complete":true}},{"id":"weak-b3","kind":"code","type":"Перепиши","title":"Локальная партия шахмат","prompt":"Сейчас действие удерживает партию, хотя нужно сохранить только её id. Захвати id значением в capture list, не self: действие после закрытия должно по-прежнему печатать 7. Не заменяй поведение молчанием через weak.","code":"final class ChessMatch {\n    let id = 7\n    func makeHistoryAction() -> () -> Void {\n        { print(self.id) }\n    }\n    deinit { print(\"Партия освобождена\") }\n}\nvar match: ChessMatch? = ChessMatch()\nlet action = match!.makeHistoryAction()\nmatch = nil\naction()","key":"final class ChessMatch {\n    let id = 7\n / убрал владельца second\nsaved = nil // убрал замыкание","same"],["arc.s2","first = nil\nsecond = nil\nprint(\"Осталось замыкание\")\nsaved?()\nsaved = nil\nprint(\"Все владельцы убраны\")","alt"],["arc.s2","final class RecordingSession {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar first: RecordingSession? = RecordingSession(id: 31)\nvar second = first\nvar saved: (() -> Void)? = { [session = first!] in\n    print(session.id)\n}\nfirst = nil\nsecond = nil\nprint(\"Осталось замыкание\")\nsaved?()\nsaved = nil\nprint(\"Все владельцы убраны\")\n\nsaved держит захват, поэтому его чищу после вызова.","alt"],["arc.s2","first = nil\nsaved = nil","near"],["arc.s2","saved = nil // перед вызовом\nsecond = nil // после","near"],["arc.s2","second == nil\nsaved == nil","novice"],["arc.s2","var second = nil\nsaved = nil","novice"],["arc.s2","deinit()\nsaved.deinit()","wrong"],["arc.s3","final class RecordingSession {\n  let id: Int\n  init(id: Int) { self.id = id }\n  deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar first: RecordingSession? = RecordingSession(id: 31) // владельцев: 1\nvar second = first // 2\nvar saved: (() -> Void)? = { [session = first!] in // 3\n  print(session.id)\n}\nfirst = nil // 2\nsecond = nil // 1\nsaved?() // 1\nsaved = nil // 0, deinit\nprint(\"Готово\")","same"],["arc.s3","deinit {\n  print(\"Освобождена сессия \\(self.id)\")\n}\n// после создания: 1 (first)\n// после second: 2 (first, second)\n// захват: 3 (first, second, saved)\n// first = nil: 2\n// second = nil: 1 (saved)\n// saved?(): 1\n// saved = nil: 0","alt"],["arc.s3","deinit { print(\"Освобождена сессия \" + String(id)) }\n\nvar first: RecordingSession? = RecordingSession(id: 31) // 1 владелец\nvar second = first // 2\nvar saved: (() -> Void)? = { [session = first!] in // 3\n    print(session.id)\n}\nfirst = nil // 2\nsecond = nil // 1\nsaved?() // 1\nsaved = nil // 0\nprint(\"Готово\")\n\nВызов saved?() владельцев не меняет.","alt"],["arc.s3","deinit { print(\"Освобождена сессия \\(id)\") }\n// first 1, second 2, saved 3\nfirst = nil // 2\nsecond = nil // 1\nsaved?() // 0\nsaved = nil // 0","near"],["arc.s3","deinit { print(\"Освобождена сессия \\(id)\") }","near"],["arc.s3","func deinit() { print(\"Освобождена сессия \\(id)\") }","novice"],["arc.s3","deinit { print(\"Освобождена сессия \\(session.id)\") }\nvar first: RecordingSession? = RecordingSession(id: 31) // 1\nvar second = first // 2","novice"],["arc.s3","saved = nil\nsecond = nil\ndeinit(self) // 0","wrong"],["arc.s4","final class RecordingSession {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar first: RecordingSession? = RecordingSession(id: 31)\nvar second = first\nvar saved: (() -> Void)? = { [session = first!] in\n  print(session.id)\n}\nfirst = nil\nsecond = nil\nprint(\"Осталось замыкание\")\nsaved?()\nsaved = nil  // действие больше не нужно\nprint(\"Все владельцы убраны\")","same"],["arc.s4","saved = .none","alt"],["arc.s4","saved?()\nsaved = nil // отпустили замыкание","alt"],["arc.s4","second = nil","near"],["arc.s4","print(\"Все владельцы убраны\")\nsaved = nil","near"],["arc.s4","saved?() = nil","novice"],["arc.s4","session = nil","novice"],["arc.s4","print(\"Освобождена сессия 31\")","wrong"],["arc.s5","ARC сам считает сильные владения экземплярами классов. Объект держат переменная, элемент массива и захват в замыкании. Когда владельцев не остаётся, объект освобождается и вызывается deinit. Вызов замыкания не удаляет захват, его надо очистить. Число владельцев в схеме это не внутренний счётчик runtime. Завершение работы делают явно, потому что объект может ещё жить.","same"],["arc.s5","Пока на объект кто-то сильно ссылается, он жив: переменная, массив, замыкание, всё считается. Как только последняя ссылка пропала, срабатывает deinit. Просто вызвать замыкание мало, оно остаётся в saved и держит сессию, надо обнулить saved. Цифры в комментариях это мои подписи, а не настоящий счётчик ARC. А завершить работу нужно руками, deinit это не сигнал конца работы.","alt"],["arc.s5","Каждая сильная связь, будь то var, элемент контейнера или захваченное значение, не даёт объекту умереть. Последняя отпущена, значит deinit. Замыкание после запуска всё равно хранится в переменной и держит объект, пока его не обнулишь. Счётчик из схемы условный, не показание рантайма. Поэтому конец работы я делаю явным действием, а не жду deinit.","alt"],["arc.s5","ARC считает сильных владельцев: переменная, элемент массива, захват замыкания. Когда последний убран, вызывается deinit. Число владельцев на схеме условное, это не показание счётчика. Завершение работы делают явно, потому что объект может жить.","near"],["arc.s5","Сессию держат переменная, элемент массива и захват, и пока кто-то держит, объект жив. Когда никого нет, будет deinit. Вызов замыкания не освобождает захват, надо присвоить nil. Это всё и есть счётчик ARC.","near"],["arc.s5","Сессию держат переменная, элемент массива и захват. Когда замыкание вызвали и оно отработало, захват пропадает и сразу срабатывает deinit, потому что работа закончена. Поэтому deinit и есть завершение работы.","novice"],["arc.s5","Сильно держат только переменная и элемент массива. Замыкание захватывает слабо по умолчанию, поэтому сессию не держит. deinit срабатывает, когда обнулили все переменные, а работу завершают в deinit.","novice"],["arc.s5","ARC это автоматический запуск замыканий. Захват это когда deinit ловит переменную в массиве, а владельцы работают на собесе.","wrong"],["arc.s6","session = nil // 1 владелец: элемент pending\nprint(pending[0].id)\npending.removeAll()\nprint(\"Очередь очищена\")","same"],["arc.s6","session = nil // видимых владельцев: 1\nprint(pending[0].id)\npending = []\nprint(\"Очередь очищена\")","alt"],["arc.s6","final class RecordingSession {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar se  может не быть или там null. do/catch ловит ошибки вместо падения, а round trip сравнивают по значениям, не по строке, потому что порядок ключей разный.","near"],["codable.s5","Codable даёт чтение и запись, CodingKeys связывают ключи. Если поле Optional, то и отсутствие, и null, и неверный тип дадут просто nil, ошибки не будет. do/catch нужен от падений, а round trip смотрят по значениям, не по порядку ключей.","novice"],["codable.s5","Codable читает и пишет JSON, CodingKeys связывают имена, Optional допускает отсутствие и null, а неверный тип всё равно ошибка. do/catch ловит ошибки. Round trip проверяют так: закодировали обратно и сравнили строку с исходным JSON, она должна совпасть символ в символ, включая порядок ключей.","novice"],["codable.s5","Codable это протокол для экрана, CodingKeys шифруют ключи, а do/catch повторяет цикл, пока JSON не станет Optional. Round trip это круглая кнопка.","wrong"],["codable.s6","import Foundation\nstruct GameMode: Decodable {\n  let id: Int\n  let isCooperative: Bool\n  enum CodingKeys: String, CodingKey {\n    case id\n    case isCooperative = \"is_cooperative\"\n  }\n}\nlet data = Data(#\"{\"id\":5,\"is_cooperative\":true}\"#.utf8)\ndo {\n  let mode = try JSONDecoder().decode(GameMode.self, from: data)\n  print(mode.isCooperative)\n} catch {\n  print(\"Некорректные данные\")\n}\n\nКлюч is_cooperative переведён в isCooperative, поле Bool.","same"],["codable.s6","import Foundation\nstruct GameMode: Decodable {\n    let id: Int\n    let isCooperative: Bool\n    private enum CodingKeys: String, CodingKey {\n        case id\n        case isCooperative = \"is_cooperative\"\n    }\n}\nlet json = #\"{\"id\":5,\"is_cooperative\":true}\"#\ndo {\n    let mode = try JSONDecoder().decode(GameMode.self, from: Data(json.utf8))\n    print(mode.isCooperative)\n} catch {\n    print(error)\n}","alt"],["codable.s6","struct GameMode: Decodable {\n  let id: Int\n  let isCooperative: Bool\n  enum CodingKeys: String, CodingKey { case id; case isCoo орядок окончания. sync ждёт работу и может вернуть результат, async просто ставит и идёт дальше. Вложенный sync на ту же serial ждёт блок, который не может стартовать, пока внешний не закончится, а он сам ждёт.","same"],["queues.s5","Ну смотри, serial это когда задачи по одной, друг на друга не налезают, concurrent можно вместе, только заранее не скажешь кто кончит первым. sync стоишь и ждёшь, получаешь значение; async отправил и пошёл. А если внутри serial-блока ещё sync на неё же, то получается замкнутый круг: внутренняя ждёт, пока освободится очередь, а освободится она только после внешней.","alt"],["queues.s5","Очередь бывает последовательная или параллельная: первая не допускает пересечения своих работ, вторая допускает, порядок завершения у параллельной не обещан. Отдельно sync/async: sync блокирует вызывающего до конца работы и отдаёт результат, async возвращается сразу. Вложенный sync на текущую serial зависает, потому что работе внутри некому начаться, пока не завершится блок, который её ждёт.","alt"],["queues.s5","serial выполняет задачи по одной, concurrent вместе. sync ждёт завершения работы и возвращает результат, async не ждёт. А про вложенный sync я помню только, что так нельзя.","near"],["queues.s5","serial это по одной, concurrent вместе. Вложенный sync на текущую serial зависает: внутренняя работа не начнётся, пока не закончится внешняя, которая её ждёт.","near"],["queues.s5","serial это один поток, concurrent несколько потоков. sync ждёт, async нет. Вложенный sync плохо потому что поток уже занят и его нельзя использовать второй раз.","novice"],["queues.s5","sync выполняется на главном потоке, а async на фоновом, поэтому sync блокирует интерфейс. serial идёт по порядку, concurrent как придётся. Вложенный sync ошибочен, потому что нельзя вызывать главный поток из главного.","novice"],["queues.s5","Очередь это как массив, FIFO. Serial это когда сериализуют данные в JSON, а deadlock это когда память закончилась и приложение закрывается.","wrong"],["q ,"Заметка 41\nЗаказать билеты\nЗаказать билеты\nИзменилось note.title в NoteScreen","same"],["state.s1","Номер 41, сверху «Заказать билеты», в поле тоже «Заказать билеты». Поменялся title у note (@State).","alt"],["state.s1","Верх: Заметка 41 / Заказать билеты. Поле: Заказать билеты. Единственное, что изменилось — note.title, запись пришла через $note.title.","alt"],["state.s1","Заметка 41\nКупить билеты\nЗаказать билеты\nИзменилось title в TitleEditor","near"],["state.s1","Заметка 41, Заказать билеты, Заказать билеты. Новая строка хранится в @Binding внутри TitleEditor.","near"],["state.s1","Заметка 41, Купить билеты, Заказать билеты. Text не обновляется сам, пока не перерисуешь экран.","novice"],["state.s1","Заметка Заказать билеты, Заказать билеты, Заказать билеты. Note перезаписался целиком, id тоже поменялся.","novice"],["state.s1","Ничего не изменится: title — let, будет ошибка компиляции.","wrong"],["state.s2","import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n  @State private var note = Note(id: 41, title: \"Купить билеты\")\n  var body: some View {\n    VStack {\n      Text(\"Заметка \\(note.id)\")\n      Text(note.title)\n      TextField(\"Заголовок\", text: $note.title)\n    }\n  }\n}","same"],["state.s2","@State private var note = Note(id: 41, title: \"Купить билеты\")\n\nTextField(\"Заголовок\", text: $note.title)\n\nState хранит черновик, $ даёт связь.","alt"],["state.s2","@State private var note: Note = Note(id: 41, title: \"Купить билеты\")\nTextField(\"Заголовок\", text: $note.title)","alt"],["state.s2","@State private var note = Note(id: 41, title: \"Купить билеты\")\nTextField(\"Заголовок\", text: note.title)\n\nТут просто строка.","near"],["state.s2","@State private var note = Note(id: 41, title: \"Купить билеты\")\nTextField(\"Заголовок\", text: $note.id)","near"],["state.s2","@State var note = Note(id: 41, title: \"Купить билеты\")\nTextField(\"Заголовок\", text: &note.title)","novice"],["state.s2","@Binding private var note = Note(id: 41, title: \"Купить билеты\")\nTextField(\"Заголовок\", text: $note.title)","novice"],["state.s2","@State var title = \"\"\nTextField(\"Заголовок\", text: $title)","wrong"],["state.s3","TitleEditor(title:$note.title)\n@Binding var title:String","same"],["state.s3","TitleEditor(title: Binding(get: { note.title }, set: { note.title = $0 }))\n@Binding var title: String\n\nСделал связь руками, чтобы редактор менял родителя.","alt"],["state.s3","TitleEditor(title: $note.title)\n\n@Binding var title: String\ninit(title: Binding<String>) { _title = title }","alt"],["state.s3","TitleEditor(title: note.title)\n@Binding var title: String","near"],["state.s3","import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n    @State private var note = Note(id: 41, title: \"Купить билеты\")\n    var body: some View {\n        VStack {\n            Text(\"Заметка \\(note.id)\")\n            Text(note.title)\n            TitleEditor(title: $note)\n        }\n    }\n}\nstruct TitleEditor: View {\n    @Binding var title: String\n    var body: some View {\n        TextField(\"Заголовок\", text: $title)\n    }\n}","near"],["state.s3","TitleEditor(title: $note.title)\nvar title: String\n\nУ ребёнка просто строка.","novice"],["state.s3","import SwiftUI\nstruct Note { let id: Int; var title: String }\nstruct NoteScreen: View {\n  @State private var note = Note(id: 41, title: \"Купить билеты\")\n  var body: some View {\n    VStack {\n      Text(\"Заметка \\(note.id)\")\n      Text(note.title)\n      TitleEditor(title: $note.title)\n    }\n  }\n}\nstruct TitleEditor: View {\n  @Binding let title: String\n  var body: some View {\n    TextField(\"Заголовок\", text: $title)\n  }\n}","novice"],["state.s3","TitleEditor()\n@State var title = \"\"","wrong"],["state.s4","TitleEditor(title: $note.title) // связь\n@Binding var title: String","same"],["state.s4","TitleEditor(title: Binding(get: { note.title }, set: { note.title = $0 }))\n@
