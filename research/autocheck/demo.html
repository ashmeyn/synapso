<script>/* Synapso autocheck prototype (research only, not wired into the site).

    const strip = a.replace(/^[a-zа-я_][\wа-я.]*\s*[:=—-]\s*/, "");   /* "recipients: [...]" */
    if (strip === e) return true;
    for (const x of [a, strip]) if (x.startsWith(e) && /^[\s(.—–-]/.test(x.slice(e.length)) && !/^\s*[\d\wЀ-ӿ"\[]/.test(x.slice(e.length).replace(/^\s*[(.—–-]/, "x") === x.slice(e.length) ? x.slice(e.length) : "")) return true;
    return false;
  }
  function matchSeq(ans, exp) {   /* → {ok} | {k, item, valueLike} */
    const items = outItems(ans, exp.length, exp.includes(""));
    for (let k = 0; k < exp.length; k++) if (items[k] == null || !matchItem(items[k], exp[k])) return { k, item: items[k], items };
    return { ok: true, items };
  }
  function checkPredict(ans, task, check) {
    if (!check || check.self || !check.outs) return { v: "unsure", why: "self", msgs: [] };
    if (!ans.trim()) return { v: "no", why: "empty", msgs: ["Ответа нет."] };
    const res = check.outs.map(o => matchSeq(ans, o)), hit = res.findIndex(r => r.ok);
    if (check.needAll && check.outs.length > 1) {
      const flat = normOut(ans.replace(/\n/g, " ; ")), all = check.outs.every(o => flat.includes(o.map(normOut).join(", ")) || flat.includes(o.map(normOut).join(" ")));
      return all ? { v: "ok", why: "outs", msgs: [] } : { v: hit >= 0 ? "no" : "unsure", why: "needAll", msgs: ["Задание просит назвать все допустимые порядки — их " + check.outs.length + "."] };
    }
    if (hit >= 0) {
      const o = check.outs[hit], rest = res[hit].items.slice(o.length).filter(Boolean);
      /* an extra short value right after the expected ones means a different number of printed lines */
      if (rest.length && !proseLike(rest.join(" ")) && rest.every(x => normOut(x).length <= 14) && !check.outs.some(p => p.length > o.length)) return { v: "unsure", why: "extra", msgs: ["После " + o.length + " строк вывода у тебя есть ещё что-то — проверь, что это пояснение, а не лишняя строка."] };
      return { v: "ok", why: "outs", msgs: [] };
    }
    for (const w of (check.wrong || [])) if (w.out && matchSeq(ans, w.out).ok) return { v: "no", why: "wrong", msgs: [w.msg] };
    const r = res[0], o = check.outs[0];
    if (r.item == null) return proseLike(ans) ? { v: "unsure", why: "prose", msgs: [] } : { v: "no", why: "short", msgs: ["Строк вывода должно быть " + o.length + ", у тебя меньше."] };
    const lined = ans.trim().split("\n").filter(l => l.trim()).length >= o.filter(Boolean).length;   /* one value per line: the format the field asks for */
    if (!lined || proseLike(r.item) || normOut(r.item).length > Math.max(24, 2 * o[r.k].length + 8)) return { v: "unsure", why: "prose", msgs: ["Не смог разобрать ответ: запиши вывод по одной строке."] };
    const msgs = ["Строка " + (r.k + 1) + ": у тебя «" + r.item + "», а будет «" + (o[r.k] || "пустая строка") + "»."];

  /* ---------- oral: concept coverage (never an automatic "ok" in the recommended scheme) ---------- */
  function checkOral(ans, task, check) {

    const a = ans.toLowerCase().replace(/ё/g, "е"), has = g => g.some(s => a.includes(s.toLowerCase().replace(/ё/g, "е")));

  /* build-time guard: drop rubric items that contradict the key (a `must` the key lacks, a `not` the key or an accept has) */

     ok     — equals the key or a verified variant (the only way to "ok" for code); the expected output, line by line
     no     — a known mistake was recognised (rubric `not`, a known wrong output, a wrong output line)

     unsure — nothing to say: compare with the key yourself */
  function verdict(ans, task, rubric) {
    if (task.kind === "oral") { const r = checkOral(ans, task, rubric); return r.why === "self" ? r : { v: r.why === "false" ? "check" : r.why === "miss" ? "check" : "unsure", why: "oral-" + r.why, msgs: r.msgs, found: r.found, of: r.of }; }

    if (r.v === "ok" || r.why === "not" || r.why === "empty" || r.why === "comments") return r;
    const nk = nearKey(ans, task);
    if (nk && nk.ops.length === 1) { const o = nk.ops[0];
      return { v: "check", why: "near", msgs: ["Почти как в ключе, отличие в одном месте (строка " + (o.line + 1) + "): " + (o.op === "sub" ? "у тебя «" + o.mine + "», в ключе «" + o.key + "»" : o.op === "extra" ? "лишнее «" + o.mine + "»" : "нет «" + o.key + "»") + ". Это меняет смысл?"] }; }
    if (r.why === "miss") return { v: "check", why: "miss", msgs: r.msgs, found: r.found, of: r.of };

<script>const TASKS=[{"id":"arc.s1","kind":"predict","title":"Ступень 1. Предскажи порядок","prompt":"Запиши все четыре строки вывода по порядку. Между какими сообщениями сработает deinit и какой владелец остаётся после first = nil?","code":"final class RecordingSession {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar first: RecordingSession? = RecordingSession(id: 31)\nvar second = first\nfirst = nil\nprint(\"Первую ссылку убрали\")\nprint(second!.id)\nsecond = nil\nprint(\"Вторую ссылку убрали\")","key":"Первую ссылку убрали\n31\nОсвобождена сессия 31\nВторую ссылку убрали\n\nПосле first = nil объект удерживает second. Обнуление second убирает последнего владельца.","check":{"outs":[["Первую ссылку убрали","31","Освобождена сессия 31","Вторую ссылку убрали"]],"why":["first = nil убирает одного владельца, но second всё ещё держит объект, deinit пока не нужен.","Объект жив, second!.id даёт 31.","second = nil убирает последнего владельца, поэтому deinit срабатывает прямо в этой строке, до следующего print.","Это print после second = nil; он идёт уже после deinit."],"wrong":[{"out":["Освобождена сессия 31","Первую ссылку убрали","31","Вторую ссылку убрали"],"msg":"Ты решил, что объект освободится при first = nil. Но у него есть второй владелец, second, поэтому deinit ещё рано."},{"out":["Первую ссылку убрали","31","Вторую ссылку убрали","Освобождена сессия 31"],"msg":"deinit срабатывает сразу, когда уходит последний владелец, то есть внутри строки second = nil. Следующий print идёт уже после."},{"out":["Первую ссылку убрали","Освобождена сессия 31","31","Вторую ссылку убрали"],"msg":"Объект не освобождается, пока на него смотрит second. После first = nil остаётся один владелец, и обращение к id ещё работает."}]}},{"id":"arc.s2","kind":"code","title":"Ступень 2. Убери последний захват","prompt":"Заполни две строки: отпусти second перед вызовом действия, затем отпусти saved после вызова. first уже очищен ,{"pat":["deinit { }"],"msg":"Пустой deinit ничего не сообщает. Выведи сообщение, чтобы по консоли было видно момент освобождения."}],"complete":false}},{"id":"arc.s4","kind":"code","title":"Ступень 4. Почему вызов не освобождает","prompt":"Сессия остаётся у saved даже после вызова. Исправь одну строку после saved?(), чтобы убрать действие перед сообщением о завершении. Не меняй захват и не вызывай deinit.","code":"final class RecordingSession {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar first: RecordingSession? = RecordingSession(id: 31)\nvar second = first\nvar saved: (() -> Void)? = { [session = first!] in\n    print(session.id)\n}\nfirst = nil\nsecond = nil\nprint(\"Осталось замыкание\")\nsaved?()\n// Действие вызвали; считаем работу законченной\nprint(\"Все владельцы убраны\")","key":"final class RecordingSession {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar first: RecordingSession? = RecordingSession(id: 31)\nvar second = first\nvar saved: (() -> Void)? = { [session = first!] in\n    print(session.id)\n}\nfirst = nil\nsecond = nil\nprint(\"Осталось замыкание\")\nsaved?()\nsaved = nil\nprint(\"Все владельцы убраны\")\n\nВызов выполняет тело, но не удаляет само замыкание из saved. Нужна явная очистка saved.","check":{"accept":[],"must":[{"pat":["saved = nil","saved = .none"],"miss":"Не очищен saved. Вызов выполняет тело замыкания, но не убирает само замыкание, а оно держит сессию."},{"pat":["= nil","= .none"],"miss":"Освободить объект можно, только убрав последнего владельца. Присвой nil переменной с Optional-замыканием."}],"not":[{"pat":["saved = nil ... saved?()","saved = .none ... saved?()"],"msg":"saved очищен до вызова: замыкание уже не вызовется. Очистка нужна после saved?(), перед сообщением о завершении."},{"pat":["print(\"Все владельцы убраны\") ... saved = nil","print(\"Все владельцы убраны\") ... saved = .none"],"msg":"saved очищен после сообщения о завершении. Задание просит убрать владельца до него, иначе сообщение будет неверным."},{"pat":["deinit ( )","$a.deinit"],"msg":"deinit вручную не вызывают. Он сработает сам, когда последний владелец уйдёт."},{"pat":["[weak","[unowned"],"msg":"Захват менять нельзя: задание про очистку владельца. Weak или unowned решают другую задачу и меняют поведение."},{"pat":["session = nil"],"msg":"session — имя захвата внутри замыкания, снаружи его нет. Владелец замыкания — переменная saved."}],"complete":true}},{"id":"arc.s5","kind":"oral","title":"Ступень 5. Объясни владение","prompt":"Своими словами, как на собесе: что → почему → последствия.","code":"Почему сессию держат переменная, элемент массива и захват замыкания? Когда сработает deinit в итоговом коде? Чем завершение работы отличается от deinit?","key":"ARC автоматически поддерживает сильное владение экземплярами классов. Каждая доступная сильная связь удерживает объект: локальная переменная, элемент контейнера или сохранённый захват. Когда таких владельцев не остаётся, экземпляр освобождается и вызывается deinit. Вызов замыкания сам по себе не удаляет сохранённый захват. Число владельцев в схеме не равно измеренному внутреннему счётчику runtime. Завершение пользовательской работы выполняют явно, потому что объект может продолжать жить.","check":{"concepts":[{"label":"ARC считает сильных владельцев; пока они есть, объект жив","groups":[["arc","сильн","strong","владел","ссыл"],["удержива","держит","держат","жив","не освобожд","не удал","пока есть"]],"miss":"Не сказано главное: сильный владелец удерживает объект, и ARC освобождает его только когда владельцев не остаётся."},{"label":"Переменная, элемент массива и захват — сильные владельцы","groups":[["перемен","массив","элемент","контейнер"],["захват","замыкан","closure","capture"]],"miss":"Не перечислено, кто держит сессию: переменная, элемент массива и захват в замыкании — каждый такой владелец удерживает объект."},{"label":"deinit ngSession {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Освобождена сессия \\(id)\") }\n}\nvar session: RecordingSession? = RecordingSession(id: 32)\nvar pending: [RecordingSession] = [session!]\nsession = nil\nprint(pending[0].id)\npending.removeAll()\nprint(\"Очередь очищена\")\n\nПосле session = nil остаётся один видимый владелец: элемент pending. removeAll убирает его; в этом примере других владельцев нет.","check":{"accept":["pending = []"],"must":[{"pat":["pending.removeAll()","pending.removeAll(keepingCapacity: $a)","pending = []"],"miss":"Не вижу удаления всех элементов из pending. Элемент массива — последний владелец, пока он там, deinit не сработает."},{"pat":["pending"],"miss":"Освобождать нужно именно pending: после session = nil сессию держит только элемент этого массива."}],"not":[{"pat":["pending.removeAll() ... print(pending[0].id)","pending = [] ... print(pending[0].id)"],"msg":"Массив очищен до print(pending[0].id). Тогда обращение к элементу ломает программу; сначала выведи id, потом освобождай владельца."},{"pat":["print(\"Очередь очищена\") ... pending.removeAll()","print(\"Очередь очищена\") ... pending = []"],"msg":"Очистка стоит после сообщения «Очередь очищена». Сообщение должно идти после освобождения, иначе порядок вывода будет неверным."},{"pat":["pending.removeLast()","pending.removeFirst()","pending.remove(at: ...)","pending.popLast()"],"msg":"Эти методы убирают один элемент. Задание просит освободить владельцев всех элементов, для этого есть метод, очищающий массив целиком."}],"complete":true}},{"id":"arc.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"Восстанови RecordingBuffer с let sampleCount: Int, init и deinit, который печатает «Буфер освобождён». Напиши makeReader(sampleCount:), создающую буфер и возвращающую замыкание, печатающее sampleCount. Сохрани результат в Optional reader, вызови его для 128, затем очисти reader и напечатай «Чтение завершено». Буфер должен жить после возврата функции и освободиться после очистки reader.","key":"final class RecordingBuffer {\n    let sampleCount: Int\n    init(sampleCount: Int) { self.sampleCount = sampleCount }\n    deinit { print(\"Буфер освобождён\") }\n}\nfunc makeReader(sampleCount: Int) -> () -> Void {\n    let buffer = RecordingBuffer(sampleCount: sampleCount)\n    return { print(buffer.sampleCount) }\n}\nvar reader: (() -> Void)? = makeReader(sampleCount: 128)\nreader?()\nreader = nil\nprint(\"Чтение завершено\")\n\nВывод: 128, «Буфер освобождён», «Чтение завершено». Возвращённое замыкание удерживает буфер после возврата makeReader; очистка reader убирает этот захват.","check":{"accept":[],"must":[{"pat":["class RecordingBuffer { ... let sampleCount: Int","class RecordingBuffer { ... var sampleCount: Int"],"miss":"Нет класса RecordingBuffer со свойством sampleCount типа Int. Нужен именно класс: deinit есть только у классов."},{"pat":["deinit { print(\"Буфер освобождён\") }"],"miss":"Нет deinit с сообщением «Буфер освобождён». Он покажет момент, когда у буфера не осталось владельцев."},{"pat":["func makeReader(sampleCount: Int) -> () -> Void","func makeReader(sampleCount: Int) -> (() -> Void)","func makeReader(sampleCount: Int) -> () -> ()","func makeReader(sampleCount: Int) -> (() -> ())"],"miss":"Сигнатура makeReader не та: функция принимает sampleCount и возвращает замыкание без параметров и результата."}],"not":[{"pat":["struct RecordingBuffer"],"msg":"У структуры нет deinit и нет подсчёта владельцев ARC. Буфер должен быть классом, иначе вся идея задания теряется."},{"pat":["print(sampleCount)"],"msg":"Замыкание печатает параметр функции, а не свойство буфера. Тогда буфер не захвачен и освободится сразу после возврата."},{"pat":["[weak ...]","[unowned ...]"],"msg":"Слабый захват не удержит буфер: он освободится сразу при возврате из makeReader, а по заданию должен жить до очистки reader."},{"pat":["try!"],"msg":"Здесь нет ничего, что бросает ошибки, а try! без нужды только прячет проблемы. Убери его."}],"complete":false}},{"id":"arc-b1","kind":"predict","type":"Предскажи вывод","title":"Наблюдатель страницы сканера","prompt":"Запиши вывод. Посчитай сильных владельцев после объявления observer и объясни, почему weak здесь не удерживает страницу.","code":"final class ScanPage {\n    let id: Int\n    init(id: Int) { self.id = id }\n    deinit { print(\"Страница освобождена\") }\n}\nvar page: ScanPage? = ScanPage(id: 8)\nweak var observer = page\nprint(observer != nil)\npage = nil\nprint(observer == nil)","key":"true\nСтраница освобождена\ntrue\n\nПосле объявления observer есть один сильный владелец — page. Слабый наблюдатель не удерживает объект и становится nil после его освобождения.","check":{"outs":[["true","Страница освобождена","true"]],"why":["page держит объект, observer слабый и ничего не удерживает, поэтому observer != nil истинно.","page = nil убирает единственного сильного владельца, и сразу срабатывает deinit.","weak автоматически становится nil, когда объект освобождён, поэтому observer == nil истинно."],"wrong":[{"out":["true","true"],"msg":"Ты пропустил deinit. После page = nil у объекта не остаётся сильных владельцев, поэтому он освобождается и печатает сообщение."},{"out":["true","true","Страница освобождена"],"msg":"deinit срабатывает прямо в строке page = nil, а не после следующего print. Сообщение идёт раньше второго true."},{"out":["true","Страница освобождена","false"],"msg":"Ты решил, что weak держит объект. Слабая ссылка не владеет им, и после освобождения она становится nil, так что результат true."}]}},{"id":"arc-b2","kind":"code","type":"Допиши","title":"Инспектор жестового превью","prompt":"После закрытия основного превью его ещё держит inspector. Допиши остановку работы до вывода isRunning, сохрани инспектор живым до явной очистки. Вывод должен показать false до сообщения deinit.","code":"final class GesturePreview {\n    private(set) var isRunning = true\n    func stop() { isRunning = false }\n    deinit { print(\"Превью освобождено\") }\n}\nvar preview: GesturePreview? = GesturePreview()\nvar inspector = preview\npreview = nil\n// Останови работу через живого владельца\nprint(inspector!.isRunning)\ninspector = nil\nprint(\"Инспектор закрыт\")","key":"final class GesturePreview {\n    private(set) var isRunning = true\n    func stop() { isRunning = false }\n    deinit { print(\"Превью освобождено\") }\n}\nvar preview: GesturePreview? = GesturePreview()\nvar inspector = preview\npreview = nil\ninspector!.stop()\nprint(inspector!.isRunning)\ninspector = nil\nprint(\"Инспектор закрыт\")\n\nВывод: false, «Превью освобождено», «Инспектор закрыт». stop меняет рабочее состояние живого объекта; освобождение происходит отдельно.","check":{"accept":[],"must":[{"pat":["inspector!.stop()","inspector?.stop()"],"miss":"Нет вызова stop() через живого владельца inspector. Основная переменная уже nil, остановить работу можно только через inspector."},{"pat":["stop()"],"miss":"isRunning меняется методом stop(): setter закрыт через private(set). Без этого вызова на экране останется true."}],"not":[{"pat":["preview!.stop()","preview?.stop()"],"msg":"preview уже nil: восклицательный знак упадёт, а вопросительный тихо ничего не сделает. Обращайся к тому, кто ещё держит объект."},{"pat":["inspector!.isRunning = false","inspector?.isRunning = false"],"msg":"Свойство isRunning закрыто для записи снаружи через private(set). Используй метод класса, который меняет состояние."},{"pat":["print(inspector!.isRunning) ... inspector!.stop()","print(inspector!.isRunning) ... inspector?.stop()"],"msg":"stop() вызван после вывода isRunning. Остановку нужно выполнить до print, иначе он покажет true."},{"pat":["inspector = nil ... inspector!.stop()","inspector = nil ... inspector?.stop()"],"msg":"После inspector = nil объект уже освобождён, обращаться к нему поздно. Остановку выполняй, пока владелец ещё жив."}],"complete":true}},{"id":"arc-b3","kind":"code","type":"Найди ошибку","title":"Выбор звука будильника","prompt":"Сохранённое onApply захватывает владельца звука. Без weak и unowned разорви цикл до очистки picker, чтобы после «Дождь» вышло сообщение deinit. Не меняй исходные данные.","code":"final class AlarmSoundPicker {\n    var onApply: (() -> Void)?\n    var selected = \"Дождь\"\n    deinit { print(\"Выбор звука освобождён\") }\n    func install() { onApply = { print(self.selected) } }\n}\nvar picker: AlarmSoundPicker? = AlarmSoundPicker()\npicker!.install()\npicker!.onApply?()\n// Разорви внутреннюю связь, пока picker ещё доступен\npicker = nil\nprint(\"Выбор закрыт\")","key":"final class AlarmSoundPicker {\n    var onApply: (() -> Void)?\n    var selected = \"Дождь\"\n    deinit { print(\"Выбор звука освобождён\") }\n    func install() { onApply = { print(self.selected) } }\n}\nvar picker: AlarmSoundPicker? = AlarmSoundPicker()\npicker!.install()\npicker!.onApply?()\npicker!.onApply = nil\npicker = nil\nprint(\"Выбор закрыт\")\n\nСначала вызван onApply: «Дождь». Очистка onApply разрывает связь объект → замыкание → объект, затем picker = nil приводит к «Выбор звука освобождён». Последняя строка — «Выбор закрыт».","check":{"accept":[],"must":[{"pat":["onApply = nil","onApply = .none"],"miss":"Не очищен onApply. Именно оно держит замыкание, а замыкание держит picker, получается цикл, из-за которого deinit не сработает."},{"pat":["$a!.onApply = nil","$a?.onApply = nil","$a.onApply = nil","$a!.onApply = .none","$a?.onApply = .none","$a.onApply = .none"],"miss":"Свойство onApply нужно очищать через владельца picker, пока он ещё доступен. Сам по себе onApply вне класса не виден."}],"not":[{"pat":["picker = nil ... onApply = nil","picker = nil ... onApply = .none"],"msg":"Цикл разрывается после picker = nil: он уже недоступен, и объект остался в памяти. Очисти onApply до очистки picker."},{"pat":["onApply = nil ... onApply?()","onApply = .none ... onApply?()"],"msg":"onApply очищено до вызова: сообщение «Дождь» не выведется. Сначала вызови действие, потом разрывай связь."},{"pat":["weak","unowned"],"msg":"Задание запрещает weak и unowned. Цикл нужно разорвать вручную, очистив сохранённое замыкание до освобождения picker."}],"complete":true}},{"id":"async.s1","kind":"predict","title":"Ступень 1. Прочитай готовый результат","prompt":"loadExhibit вызывают из async-контекста с id 21. Что вернётся? Почему unknown id нельзя считать успешной строкой?","code":"enum ExhibitError: Error { case missing }\nfunc fetchTitle(id: Int) async throws -> String {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return \"Луна\"\n}\nfunc fetchMinutes(id: Int) async throws -> Int {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return 3\n}\nfunc loadExhibit(id: Int) async throws -> String {\n    let title = try await fetchTitle(id: id)\n    let minutes = try await fetchMinutes(id: id)\n    return \"\\(title): \\(minutes) мин\"\n}","key":"Луна: 3 мин. Для неизвестного id возникает ExhibitError.missing; результат нужно получить через try await.","check":{"outs":[["Луна: 3 мин"]],"why":["id равен 21: оба guard проходят, fetchTitle даёт «Луна», fetchMinutes даёт 3, строка собирается из них. Для другого id была бы брошена ExhibitError.missing, а не строка."],"wrong":[{"out":["Луна: 21 мин"],"msg":"Ты подставил id вместо минут. Минуты возвращает fetchMinutes (там 3), а id — лишь аргумент запроса."},{"out":["Нет экспоната"],"msg":"Такой строки в loadExhibit нет: для id 21 guard проходят, а для чужого id была бы брошена ошибка, а не строка."},{"out":["ExhibitError.missing"],"msg":"Ошибка бросается только при id, отличном от 21. Для 21 обе проверки проходят и функция возвращает строку."}]}},{"id":"async.s2","kind":"code","title":"Ступень 2. Заполни последовательный вызов","prompt":"Восстанови try await в loadExhibit. Обе локальные функции уже включены в код.","code":"enum ExhibitError: Error { case missing }\nfunc fetchTitle(id: Int) async throws -> String {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return \"Луна\"\n}\nfunc fetchMinutes(id: Int) async throws -> Int {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return 3\n}\nfunc loadExhibit(id: Int) async throws -> String {\n    let title = /* Ошибка и ожидание */ fetchTitle(id: id)\n    let minutes = /* Ошибка и ожидание */ fetchMinutes(id: id)\n    return \"\\(title): \\(minutes) мин\"\n}","key":"enum ExhibitError: Error { case missing }\nfunc fetchTitle(id: Int) async throws -> String {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return \"Луна\"\n}\nfunc fetchMinutes(id: Int) async throws -> Int {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return 3\n}\nfunc loadExhibit(id: Int) async throws -> String {\n    let title = try await fetchTitle(id: id)\n    let minutes = try await fetchMinutes(id: id)\n    return \"\\(title): \\(minutes) мин\"\n}\n\nПоследовательные запросы дают «Луна: 3 мин» для id 21.","check":{"accept":[],"must":[{"pat":["let $a = try await fetchTitle(id: id)"],"miss":"Нет try await перед fetchTitle: функция async throws, без ожидания и обработки ошибки результат не получить. Смотри порядок слов: сначала try, потом await."},{"pat":["let $a = try await fetchMinutes(id: id)"],"miss":"Нет try await перед fetchMinutes: вызов async throws функции без них не скомпилируется. Здесь вызовы идут по очереди, один за другим."}],"not":[{"pat":["await try"],"msg":"Порядок должен быть try await: try относится ко всему выражению и стоит первым, как в остальных вызовах."},{"pat":["try? await","try! await"],"msg":"try? прячет ошибку (получишь Optional), try! уронит приложение. Здесь нужен обычный try: ошибка уходит вызывающему."},{"pat":["async let"],"msg":"Это ступень про последовательные вызовы: await на каждом шаге. async let — тема следующ   let title = try await fetchTitle(id: id)\n        try Task.checkCancellation()\n        return title\n    } catch is CancellationError {\n        return \"Отменено\"\n    } catch {\n        return \"Нет экспоната\"\n    }\n}\n\nДля отменённой задачи «Отменено», для id 99 «Нет экспоната», для id 21 «Луна».","check":{"accept":["func status(id: Int) async -> String {\n    do {\n        let title = try await fetchTitle(id: id)\n        if Task.isCancelled { return \"Отменено\" }\n        return title\n    } catch is CancellationError {\n        return \"Отменено\"\n    } catch {\n        return \"Нет экспоната\"\n    }\n}","func status(id: Int) async -> String {\n    do {\n        let title = try await fetchTitle(id: id)\n        try Task.checkCancellation()\n        return title\n    } catch {\n        if error is CancellationError { return \"Отменено\" }\n        return \"Нет экспоната\"\n    }\n}"],"must":[{"pat":["is CancellationError { ... }","as CancellationError { ... }","as? CancellationError { ... }"],"miss":"Нет отдельной ветки для CancellationError. Общий catch свалит отмену в «Нет экспоната», и отмену не отличить от ошибки данных."},{"pat":["try await fetchTitle(id: id) try Task.checkCancellation()","try await fetchTitle(id: id) if Task.isCancelled","try await fetchTitle(id: id) guard !Task.isCancelled"],"miss":"Нет проверки отмены сразу после await, до return. Пока задачу ждали, её могли отменить, и устаревший результат нельзя применять."}],"not":[{"pat":["is CancellationError { return \"Нет экспоната\" }","is CancellationError { ... \"Нет экспоната\" ... }","as CancellationError { ... \"Нет экспоната\" ... }"],"msg":"Ветка отмены возвращает ту же заглушку, что и ошибка данных: отмена маскируется. Верни для неё своё значение."},{"pat":["catch { ... } catch is CancellationError","catch { ... } catch let $a as CancellationError"],"msg":"Общий catch стоит раньше: он перехватит всё, и ветка отмены никогда не сработает. Конкретные catch идут перед общим."},{"pat":["try? await fetchTitle","try? Task.checkCancellation()"],"msg":"try? превращает любую ошибку, в том числе отмену, в nil: do/catch ничего не увидит. Нужен обычный try."}],"complete":false}},{"id":"async.s5","kind":"oral","title":"Ступень 5. Объясни жизненный цикл","prompt":"Своими словами, как на собесе: что → почему → последствия.","code":"Как completion превращается в результат try await? Почему два async let независимы? Кто отменяет Task и кто проверяет отмену?","key":"async возвращает результат в ожидающую задачу; try обрабатывает ошибки. async let запускает связанные со scope дочерние задачи для независимых запросов. handle.cancel просит отменить Task; checkCancellation или isCancelled дают коду возможность остановиться.","check":{"concepts":[{"label":"await приостанавливает функцию и возвращает результат вместо completion","groups":[["await","ожида","ждёт","ждет","приостан","suspend"],["результат","значени","возвращ","return","completion","колбэк","замыкан"]],"miss":"Не сказано главное: await приостанавливает функцию и отдаёт результат в то же место кода, вместо того чтобы передавать его в completion."},{"label":"try: ошибка выбрасывается и обрабатывается (throws/catch)","groups":[["try","throw","ошиб","error"],["проброс","пробрас","выбрас","перехват","catch","обрабат","бросa","бросает","поймать"]],"miss":"Не хватает про ошибки: try нужен, потому что async-функция может выбросить ошибку, и её обрабатывают через catch или пробрасывают дальше."},{"label":"async let запускает независимые дочерние задачи, они идут параллельно","groups":[["async let","дочерн","child","параллел","одновремен","конкурент","независим"],["запуска","стартуют","стартует","создаёт","создает","сразу","не ждут","не ждёт","scope","област","структурн","structured"]],"miss":"Не объяснено, почему async let независимы: каждый запускается как дочерняя задача сразу, не дожидаясь соседа, и привязан к своей области."},{"label":"Task отменяет тот, у кого есть handle (cancel)","groups":[["cancel"," (values.1) мин\"\n}\n// Добавь модель экрана","key":"enum ExhibitError: Error { case missing }\nfunc fetchTitle(id: Int) async throws -> String {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return \"Луна\"\n}\nfunc fetchMinutes(id: Int) async throws -> Int {\n    try Task.checkCancellation()\n    guard id == 21 else { throw ExhibitError.missing }\n    return 3\n}\nfunc loadExhibit(id: Int) async throws -> String {\n    async let title = fetchTitle(id: id)\n    async let minutes = fetchMinutes(id: id)\n    let values = try await (title, minutes)\n    return \"\\(values.0): \\(values.1) мин\"\n}\n@MainActor\nfinal class ExhibitScreen {\n    private(set) var text = \"Загрузка\"\n    func start(id: Int) -> Task<Void, Never> {\n        Task {\n            do {\n                let value = try await loadExhibit(id: id)\n                try Task.checkCancellation()\n                text = value\n            } catch is CancellationError {\n                text = \"Отменено\"\n            } catch {\n                text = \"Нет экспоната\"\n            }\n        }\n    }\n}\n\nМодель обновляется в главном акторе. Возвращённый handle позволяет вызывающей стороне отменить именно эту задачу.","points":["Класс помечен `@MainActor`, `text` — `private(set) var` со стартом «Загрузка».","`start(id:)` синхронный, возвращает `Task<Void, Never>`: внутри `Task { … }`, и этот handle отдаётся наружу для `cancel()`.","В `do`: `try await loadExhibit(id: id)`, затем `try Task.checkCancellation()` и только потом `text = value`.","`catch is CancellationError` → «Отменено» стоит раньше общего `catch` → «Нет экспоната»."],"check":{"accept":["@MainActor\nfinal class ExhibitScreen {\n    private(set) var text = \"Загрузка\"\n    func start(id: Int) -> Task<Void, Never> {\n        Task {\n            do {\n                let value = try await loadExhibit(id: id)\n                if Task.isCancelled {\n                    text = \"Отменено\"\n om: data)\n    print(game.title)\n    print(game.playerCount)\n    print(game.subtitle ?? \"Без подзаголовка\")\n} catch {\n    print(\"Некорректные данные\")\n}","key":"import Foundation\nstruct Game: Codable {\n    let id: Int\n    let title: String\n    let playerCount: Int\n    let subtitle: String?\n    enum CodingKeys: String, CodingKey {\n        case id, title, subtitle\n        case playerCount = \"player_count\"\n    }\n}\nlet json = #\"{\"id\":5,\"title\":\"Кодовые имена\",\"player_count\":4,\"subtitle\":null}\"#\nlet data = Data(json.utf8)\ndo {\n    let game = try JSONDecoder().decode(Game.self, from: data)\n    print(game.title)\n    print(game.playerCount)\n    print(game.subtitle ?? \"Без подзаголовка\")\n} catch {\n    print(\"Некорректные данные\")\n}\n\nКонтракт требует JSON-номер. Исправленная фикстура содержит 4 без кавычек; ответ реального сервера с неверным типом нужно отклонить или согласовать изменение схемы.","check":{"accept":[],"must":[{"pat":["#\"\"\"\n{\"id\":5,\"title\":\"Кодовые имена\",\n\"player_count\":4,\"subtitle\":null}\n\"\"\"#","#\"{\"id\":5,\"title\":\"Кодовые имена\",\"player_count\":4,\"subtitle\":null}\"#","#\"{\"id\":5,\"title\":\"Кодовые имена\", \"player_count\":4, \"subtitle\":null}\"#"],"miss":"Не вижу исправленной фикстуры: player_count должен быть числом без кавычек, остальные поля трогать не нужно."},{"pat":["json ="],"miss":"Нет объявления тестового JSON. Исправление нужно внести в сами данные, а не в модель или обработку."}],"not":[{"pat":["playerCount: String","playerCount: Int?"],"msg":"Ты меняешь модель вместо данных. Контракт говорит: число — Int. Сломанный ответ надо чинить в фикстуре."},{"pat":["try!"],"msg":"try! скрывает ошибку падением приложения. Ошибка данных должна уходить в catch."},{"pat":["init(from $a: Decoder)","decode(String.self, forKey: ...)"],"msg":"Свой init(from:), который переваривает строку вместо числа, подгоняет код под плохой ответ. Контракт нужно соблюдать в данных."}],"complete":false}},{"id":"codable.s5","kind":"oral","title":"Ступень 5. Объясни напарнику (устно)","prompt":"Своими словами, как на собесе: что → почему → последствия.","code":"Карточка игры из JSON.\n- Что дают Codable и CodingKeys?\n- Как различаются отсутствие, null и неверный тип?\n- Зачем do/catch и почему round trip не проверяют точной строкой JSON?","key":"Codable объединяет чтение и запись, CodingKeys связывает свойства с ключами внешнего формата. Optional допускает отсутствие/null, обязательное поле их не допускает; неверный тип не становится допустимым только из-за Optional. do/catch обрабатывает ошибку данных без падения через try!. Round trip проверяет значения восстановленной модели, а не несущественный порядок ключей.","check":{"concepts":[{"label":"Codable — чтение и запись (decode + encode)","groups":[["codable","encodable","decodable","кодабл"],["encod","decod","кодир","декод","туда","обратн","обе сторон","в обе","чтени","запис"]],"miss":"Не сказано, что Codable — это и чтение (Decodable), и запись (Encodable): одна модель умеет в обе стороны."},{"label":"CodingKeys связывает свойства с ключами JSON","groups":[["codingkeys","coding keys","ключ"],["имен","названи","сопостав","связ","маппинг","snake","player_count","свойств","соответств"]],"miss":"Не объяснено, зачем CodingKeys: он связывает имена свойств в Swift с именами ключей внешнего формата."},{"label":"Optional допускает отсутствие и null","groups":[["optional","опционал","nil"],["отсутств","null","нет ключ","не прише","нет значен","может не быть"]],"miss":"Не сказано, что Optional допускает отсутствие ключа или null, а обязательное поле — нет."},{"label":"Неверный тип — ошибка, её ловят do/catch, а не try!","groups":[["тип","type","строк"],["ошибк","error","throw","catch","исключен","не декод"]],"miss":"Не разобрано, что неверный тип — это ошибка декодирования, и Optional её не убирает. Её ловят в do/catch, а не try!."},{"label":"Round trip сравнивает значения, а не строку JSON","groups":[["round","туда","обратн","восстанов","сравнива","порядок","кругов"],["значен","порядок","ключей","не строк","не точн","свойств","модел"]],"miss":"Не сказано, почему round trip проверяют по значениям восстановленной модели: порядок ключей в JSON несущественен."}],"false":[{"groups":[["optional","опционал"],["любой тип","любую ошибк","и неверн","все ошибки","всё что угодно","что угодно"]],"msg":"Optional не прощает неверный тип. Он допускает только отсутствие значения или null; строка вместо числа всё равно даст ошибку."}]}},{"id":"codable.s6","kind":"code","title":"Ступень 6. Прочитай режим игры","prompt":"Создай GameMode: Decodable с id и isCooperative: Bool. JSON {\"id\":5,\"is_cooperative\":true}; сопоставь ключ и выведи признак через do/catch. Значение \"true\" строкой не принимай.","code":"Напиши самостоятельный пример: import Foundation, GameMode, CodingKeys, Data из тестового JSON и безопасное декодирование.","key":"import Foundation\nstruct GameMode: Decodable {\n    let id: Int\n    let isCooperative: Bool\n    enum CodingKeys: String, CodingKey {\n        case id\n        case isCooperative = \"is_cooperative\"\n    }\n}\nlet data = Data(#\"{\"id\":5,\"is_cooperative\":true}\"#.utf8)\ndo {\n    let mode = try JSONDecoder().decode(GameMode.self, from: data)\n    print(mode.isCooperative)\n} catch { print(\"Некорректные данные\") }\n\nis_cooperative связан с isCooperative и читается как Bool. Вывод true; строковый \"true\" нарушил бы тип.","check":{"accept":[],"must":[{"pat":["GameMode: Decodable { ... id: Int","GameMode: Codable { ... id: Int"],"miss":"Не вижу struct GameMode с Decodable и свойством id типа Int. Это основа модели."},{"pat":["isCooperative: Bool"],"miss":"Нет свойства isCooperative типа Bool. Именно тип Bool не даст принять значение \"true\", присланное строкой."},{"pat":["isCooperative = \"is_cooperative\""],"miss":"Нет сопоставления isCooperative с ключом JSON. В CodingKeys серверное имя записано со змеиным регистром."},{"pat":["do { ... decode(GameMode.self, from: $a) ... } catch"],"miss":"Декодирование должно быть внутри do с try и обработкой ошибки через catch, а не через try! или try?."},{"pat":["print($a.isCooperative)","print(\"\\($a.isCooperative)\")"],"miss":"Не выведен признак isCooperative декодированной модели. Это итог упражнения."}],"not":[{"pat":["try!"],"msg":"try! роняет приложение при плохих данных. Здесь нужна обработка через do/catch."},{"pat":["isCooperative: String","isCooperative: Int"],"msg":"Признак — Bool. Менять тип ради строки \"true\" нельзя: задание запрещает принимать значение строкой."},{"pat":["decode(String.self, forKey: ...)"],"msg":"Ручное чтение строки и превращение её в Bool принимает \"true\" строкой — именно это запрещено. Пусть Bool-декодер отклоняет такие данные."}],"complete":false}},{"id":"codable.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"Восстанови GameCover: Decodable — обязательные id и title, необязательный coverPath из cover_path. JSON {\"id\":5,\"title\":\"Кодовые имена\"} не содержит обложку. Декодируй через do/catch, выведи coverPath либо «Нет обложки». Не подменяй ошибки обязательных полей фиктивными значениями.","key":"import Foundation\nstruct GameCover: Decodable {\n    let id: Int\n    let title: String\n    let coverPath: String?\n    enum CodingKeys: String, CodingKey {\n        case id, title\n        case coverPath = \"cover_path\"\n    }\n}\nlet data = Data(#\"{\"id\":5,\"title\":\"Кодовые имена\"}\"#.utf8)\ndo {\n    let game = try JSONDecoder().decode(GameCover.self, from: data)\n    print(game.coverPath ?? \"Нет обложки\")\n} catch { print(\"Некорректные данные\") }\n\nОтсутствующий cover_path даёт nil; вывод «Нет обложки». Обязательные id/title всё ещё должны присутствовать с верными типами.","check":{"accept":[],"must":[{"pat":["GameCover: Decodable","GameCover: Codable"],"miss":"Нет struct GameCover с Decodable. Это модель, которую нужно восстановить по памяти."},{"pat":["coverPath: (field)\")\n    } catch { print(\"Другая ошибка\") }\n}\n\nВывод «Нет ключа: build», затем «Неверный тип: build». keyNotFound передаёт ключ отдельно, typeMismatch — путь в context; исходные данные сохранены.","check":{"accept":["} catch let DecodingError.keyNotFound(key, _) {\n    print(\"Нет ключа: \\(key.stringValue)\")\n} catch let DecodingError.typeMismatch(_, context) {\n    print(\"Неверный тип: \\(context.codingPath.last?.stringValue ?? \"?\")\")\n} catch {\n    print(\"Другая ошибка\")\n}"],"must":[{"pat":["catch DecodingError.keyNotFound(...)","catch let DecodingError.keyNotFound(...)"],"miss":"Нет отдельного catch для отсутствующего ключа. Нужен случай keyNotFound у DecodingError, чтобы отличать пропажу поля от других ошибок."},{"pat":["catch DecodingError.typeMismatch(...)","catch let DecodingError.typeMismatch(...)"],"miss":"Нет отдельного catch для несовпадения типа. Нужен случай typeMismatch у DecodingError: для строки вместо числа сработает он."},{"pat":["stringValue"],"miss":"Имя поля не показано. У ключа и у элементов пути есть stringValue; без него в сообщении будет служебное описание."},{"pat":["codingPath"],"miss":"Для typeMismatch имя поля берут из контекста ошибки — из его codingPath. Не вижу, чтобы ты его использовал."},{"pat":["catch { ... }","catch let $a { ... }"],"miss":"Нет общего catch без шаблона. Если придёт другая ошибка, её никто не обработает, и код не скомпилируется."}],"not":[{"pat":["try!"],"msg":"try! при ошибке роняет приложение. Здесь нужно ловить ошибки по видам, а не падать."},{"pat":["catch DecodingError.keyNotFound(let $a, ...) { print($a) }"],"msg":"print(key) выведет служебное описание ключа целиком. Чтобы получить только имя поля, возьми у ключа его строковое значение."}],"complete":false}},{"id":"codable-b3","kind":"code","type":"Допиши","title":"Результат голосования","prompt":"winner может отсутствовать, пока результат не выбран. Допиши тип с Optional; id обязателен.","code":"import Foundation\nstruct VoteSummary: Decodable { let id: Int; let winner: /* тип */ }\nlet data = Data(#\"{\"id\":8}\"#.utf8)\ndo {\n    let summary = try JSONDecoder().decode(VoteSummary.self, from: data)\n    print(summary.winner ?? \"Победитель ещё не выбран\")\n} catch { print(\"Некорректные данные\") }","key":"import Foundation\nstruct VoteSummary: Decodable { let id: Int; let winner: String? }\nlet data = Data(#\"{\"id\":8}\"#.utf8)\ndo {\n    let summary = try JSONDecoder().decode(VoteSummary.self, from: data)\n    print(summary.winner ?? \"Победитель ещё не выбран\")\n} catch { print(\"Некорректные данные\") }\n\nwinner: String? допускает отсутствующий ключ. Вывод «Победитель ещё не выбран».","check":{"accept":[],"must":[{"pat":["String?","Optional<String>"],"miss":"winner должен быть Optional: ключа в JSON нет. Без Optional декодирование завершится ошибкой отсутствующего ключа."},{"pat":["String"],"miss":"Внутри Optional должна быть строка: дальше winner используется как текст с запасным значением через ??."}],"not":[{"pat":["String!"],"msg":"String! — не про отсутствие данных: для декодера это не Optional-поле. Нужен обычный Optional с вопросительным знаком."},{"pat":["id: Int?"],"msg":"id обязателен по заданию. Optional нужен только для winner, иначе пропажа id перестанет считаться ошибкой."},{"pat":["[String?]","[String]?","Int?","Bool?"],"msg":"Тип Optional выбран неверный. Запасное значение в print — текст, значит, winner хранит строку."}],"complete":true}},{"id":"hof.s1","kind":"predict","title":"Ступень 1. Предскажи сводку","prompt":"Что окажется в recipients и amounts? Что вернёт reduce?","code":"struct Transfer {\n    let recipient: String\n    let amountText: String\n    let posted: Bool\n}\nlet transfers = [Transfer(recipient: \"Анна\", amountText: \"180\", posted: true),\n             Transfer(recipient: \"Олег\", amountText: \"abc\", posted: true),\n             Transfer(recipient: \"Мария\", amountText: \"90\", posted: false)]\nlet posted = transfers.filter { $0.posted }\nlet recipients = posted.map { $0.recipient }\nlet amounts = posted.compactMap { Int($0.amountText) }\nprint(recipients, amounts, amounts.reduce(0, +))","key":"recipients = [\"Анна\", \"Олег\"], amounts = [180], сумма = 180. compactMap выбросил плохую сумму; для истории операций это опасная потеря проведённого перевода.","check":{"outs":[["[\"Анна\", \"Олег\"] [180] 180"],["[Анна, Олег] [180] 180"],["[\"Анна\", \"Олег\"]","[180]","180"]],"why":["recipients содержит обоих проведённых получателей, amounts — только [180], потому что compactMap выбросил nil от «abc», а reduce даёт 180."],"wrong":[{"out":["[\"Анна\"] [180] 180"],"msg":"Ты исключил Олега из recipients. filter смотрит на posted, а не на сумму: Олег проведён, поэтому остаётся. Плохую сумму убирает лишь compactMap, и только из amounts."},{"out":["[\"Анна\", \"Олег\", \"Мария\"] [180, 90] 270"],"msg":"Ты не применил filter: Мария не проведена, и сначала нужно отобрать posted. Потом map и compactMap работают только по отобранным."},{"out":["[\"Анна\", \"Олег\"] [180, 0] 180"],"msg":"compactMap не подставляет 0 вместо неудачного Int(...): он выбрасывает nil, и в amounts остаётся одно число."}]}},{"id":"hof.s2","kind":"code","title":"Ступень 2. Собери по каркасу","prompt":"Заполни: оставь проведённые переводы, получи имена получателей и числовые суммы.","code":"func pieces(_ transfers: [Transfer]) -> ([String], [Int]) {\n    // 1. filter проведённые\n    // 2. map имена\n    // 3. compactMap суммы\n}","key":"func pieces(_ transfers: [Transfer]) -> ([String], [Int]) {\n    let posted = transfers.filter { $0.posted }\n    let recipients = posted.map { $0.recipient }\n    let amounts = posted.compactMap { Int($0.amountText) }\n    return (recipients, amounts)\n}\n\nfilter выбирает записи, map сохраняет по одной подписи на запись, compactMap убирает nil после Int(text). Пока это только технические части, не безопасный денежный отчёт.","check":{"accept":["let posted = transfers.filter { $0.posted }\nreturn (posted.map { $0.recipient }, posted.compactMap { Int($0.amountText) })"],"must":[{"pat":["filter { ... posted ... }","filter(\\.posted)"],"miss":"Не вижу filter по полю posted: сначала нужно оставить только проведённые переводы, иначе в результат попадут лишние записи."},{"pat":["map { ... recipient ... }","map(\\.recipient)"],"miss":"Имена получателей получают через map по полю recipient: по одному имени на каждую оставшуюся запись."},{"pat":["compactMap { ... Int(... amountText ...) ... }"],"miss":"Суммы нужно получить через compactMap и Int(...) от amountText: нечисловые строки превратятся в nil и будут выброшены."},{"pat":["return (...)"],"miss":"Функция возвращает пару ([String], [Int]): не забудь вернуть оба массива кортежем."}],"not":[{"pat":["transfers.map { ... }","transfers.compactMap { ... }","transfers.map(...)"],"msg":"Ты применяешь map к исходному списку, а не к проведённым. Сначала filter по posted, и уже к его результату применяй map и compactMap."},{"pat":["map { ... Int(...) ... }"],"msg":"map с Int(...) вернёт [Int?], а не [Int]: nil останутся. Нужна операция, которая заодно выбрасывает nil."},{"pat":["Int(...)!"],"msg":"Принудительное разворачивание уронит приложение на «abc». Нужная операция сама отбросит nil."},{"pat":["filter { ... ! ... posted ... }","filter { ... posted == false ... }","filter { ... posted ... == false ... }"],"msg":"Здесь условие инвертировано: ты оставляешь непроведённые переводы, а нужны проведённые."}],"complete":true}},{"id":"hof.s3","kind":"code","title":"Ступень 3. Проверь пропажу суммы","prompt":"Напиши summary: если хотя бы одна проведённая сумма не разобралась, верни nil; иначе сложи суммы.","code":"func totalAmount(_ transfers: [Transfer]) -> Int? {\n    // posted → amounts → проверка count → reduce\n}","key":"func totalAmount(_ transfers: [Transfer]) -> Int? {\n    let posted = transfers.filter { $0.posted }\n    let amounts = posted.compactMap { Int($0.amountText) }\n    guard amounts.count == posted.count else { return nil }\n    return amounts.reduce(0, +)\n}\n\nРазница количеств показывает, что compactMap потерял запись. Возвращаем nil вместо правдоподобной неправильной суммы.","check":{"accept":["let posted = transfers.filter { $0.posted }\nlet amounts = posted.compactMap { Int($0.amountText) }\nreturn amounts.count == posted.count ? amounts.reduce(0, +) : nil"],"must":[{"pat":["filter { ... posted ... }","filter(\\.posted)"],"miss":"Не вижу filter по posted: считать нужно только проведённые переводы."},{"pat":["compactMap { ... Int(... amountText ...) ... }"],"miss":"Нет разбора сумм через compactMap и Int(...) от amountText. Он нужен, чтобы сравнить, сколько сумм удалось разобрать."},{"pat":["$a.count == $b.count","$a.count != $b.count","$a.count < $b.count","$a.count > $b.count"],"miss":"Не вижу сравнения количеств. Если сумм меньше, чем проведённых переводов, compactMap что-то потерял, и это надо заметить."},{"pat":["return nil",": nil"],"miss":"При потере суммы нужно вернуть nil: так итог становится недоступным, а не правдоподобно неверным."},{"pat":["reduce(0, ...)","reduce(0) { ... }","reduce(into: 0) { ... }","reduce(into: 0, ...)"],"miss":"Суммирование не найдено. Когда все суммы разобраны, сложи их одной сверткой с начальным значением 0."}],"not":[{"pat":["transfers.count == $a.count","$a.count == transfers.count","transfers.count != $a.count","$a.count != transfers.count"],"msg":"Ты сравниваешь с количеством всех переводов, а не проведённых. Непроведённые не должны влиять: сравнивай с отфильтрованным массивом."},{"pat":["?? 0"],"msg":"Подстановка нуля прячет плохую сумму и даёт правдоподобный неверный итог. Здесь нужно вернуть nil."},{"pat":["Int(...)!"],"msg":"Force unwrap уронит приложение на «abc». Плохая сумма должна давать nil, а не падение."}],"complete":true}},{"id":"hof.s4","kind":"code","title":"Ступень 4. Найди ошибку","prompt":"Почему код сообщает 180 вместо ошибки? Исправь его, не выбрасывая проведённый перевод молча.","code":"let posted = transfers.filter { $0.posted }\nlet totalAmount = posted.compactMap { Int($0.amountText) }.reduce(0, +)\nprint(totalAmount)","key":"struct Transfer {\n    let recipient: String\n    let amountText: String\n    let posted: Bool\n}\nlet transfers = [Transfer(recipient: \"Анна\", amountText: \"180\", posted: true),\n             Transfer(recipient: \"Олег\", amountText: \"abc\", posted: true)]\nlet posted = transfers.filter { $0.posted }\nlet amounts = posted.compactMap { Int($0.amountText) }\nlet totalAmount: Int? = amounts.count == posted.count\n    ? amounts.reduce(0, +) : nil\n\ncompactMap удалил nil от строки \"abc\"; без проверки отчёт занижен. Optional результата заставляет экран показать проблему.","check":{"accept":["let posted = transfers.filter { $0.posted }\nlet amounts = posted.compactMap { Int($0.amountText) }\nif amounts.count == posted.count {\n    print(amounts.reduce(0, +))\n} else {\n    print(\"Ошибка суммы\")\n}"],"must":[{"pat":["$a.count == $b.count","$a.count != $b.count","$a.count < $b.count","$a.count > $b.count"],"miss":"Не вижу сравнения количеств проведённых переводов и разобранных сумм. Без него потеря записи compactMap остаётся незамеченной."},{"pat":["nil","else { ... }","throw ..."],"miss":"Нет способа сообщить о проблеме: нужен результат «суммы нет» (например, Optional) или отдельная ветка ошибки, а не молчаливое занижение."},{"pat":["reduce(0, ...)","reduce(0) { ... }","reduce(into: 0) { ... }","reduce(into: 0, ...)"],"miss":"Сложение сумм пропало. Когда все суммы разобраны, итог по-прежнему нужно свернуть."}],"not":[{"pat":["transfers.count == $a.count","$a.count == transfers.count","transfers.count != $a.count","$a.count != transfers.count"],"msg":"Сравнение идёт с количеством всех переводов, а непроведённые законно отсеяны. Сравнивай с количеством проведённых."},{"pat":["?? 0"],"msg":"Замена nil нулём — тот же молчаливый сбой: сумма занижена, и ошибки не видно. Нужно сообщить о проблеме."},{"pat":["Int(...)!"],"msg":"Force unwrap роняет приложение на «abc» "[...]! += 1"],"msg":"Принудительное разворачивание упадёт на первом же новом имени: ключа ещё нет. Задай значение по умолчанию."},{"pat":["for $a in recipients { ... }","for $a in recipients.indices { ... }"],"msg":"Задание просит reduce(into:), а не ручной цикл с внешним словарём."},{"pat":["Dictionary(grouping: ...)"],"msg":"grouping собирает массивы по ключу, а не счётчики, и задание просит reduce(into:)."}],"complete":true}},{"id":"hof.s7","kind":"code","title":"Проверка по памяти","prompt":"Без подсказок и без урока. Верно — отметь тему.","code":"Напиши функцию суммы переводов: только проведённые записи; плохая сумма делает итог недоступным. Объясни четыре операции.","key":"func totalAmount(_ transfers: [Transfer]) -> Int? {\n    let posted = transfers.filter { $0.posted }\n    let amounts = posted.compactMap { Int($0.amountText) }\n    guard posted.count == amounts.count else { return nil }\n    return amounts.reduce(0, +)\n}\n\nfilter отбирает, map преобразует каждый, compactMap убирает nil, reduce объединяет. Проверь код на пустом списке и некорректной сумме.","check":{"accept":["func totalAmount(_ transfers: [Transfer]) -> Int? {\n    let posted = transfers.filter { $0.posted }\n    let amounts = posted.compactMap { Int($0.amountText) }\n    return amounts.count == posted.count ? amounts.reduce(0, +) : nil\n}"],"must":[{"pat":["filter { ... posted ... }","filter(\\.posted)"],"miss":"Не вижу filter по posted: в сумму должны попасть только проведённые переводы."},{"pat":["compactMap { ... Int(... amountText ...) ... }"],"miss":"Нет разбора сумм через compactMap и Int(...) от amountText: без него не получить числа из строк."},{"pat":["$a.count == $b.count","$a.count != $b.count","$a.count < $b.count","$a.count > $b.count"],"miss":"Не вижу сравнения количеств. Если разобралось меньше сумм, чем проведено переводов, compactMap потерял запись."},{"pat":["return nil",": nil"],"miss":"Плохая сумма должна сделать итог недоступным, то есть вернуть nil, а не частичную сумму."},{"pat":["reduce(0, ...)","reduce(0) { ... }","reduce(into: 0) { ... }","reduce(into: 0, ...)"],"miss":"Нет свёртки сумм: когда все числа на месте, их нужно сложить в один итог."}],"not":[{"pat":["transfers.count == $a.count","$a.count == transfers.count","transfers.count != $a.count","$a.count != transfers.count"],"msg":"Количество разобранных сумм сравнивается с числом всех переводов, а непроведённые не учитываются. Сравнивай с проведёнными."},{"pat":["?? 0"],"msg":"Замена nil нулём возвращает правдоподобный, но неверный итог. По условию плохая сумма делает итог недоступным."},{"pat":["Int(...)!"],"msg":"Force unwrap роняет приложение на плохой сумме. Здесь нужен результат nil, а не падение."},{"pat":["return 0"],"msg":"Возврат 0 не отличить от настоящей нулевой суммы. Для недоступного итога тип Int? даёт nil."}],"complete":true}},{"id":"hof-b1","kind":"code","type":"Перепиши","title":"Чек-лист в поездку","prompt":"Перепиши оба цикла без var и ручного аккумулятора. Каждая строка должна отвечать на вопрос экрана: какие тяжёлые вещи ещё не упакованы и всё ли уже упаковано.","code":"struct PackItem {\n    let name: String\n    let grams: Int\n    let packed: Bool\n}\nlet items = [PackItem(name: \"Ботинки\", grams: 900, packed: false),\n             PackItem(name: \"Зарядка\", grams: 120, packed: false),\n             PackItem(name: \"Куртка\", grams: 700, packed: true)]\nvar heavyLeft: [String] = []\nfor item in items {\n    if !item.packed && item.grams >= 500 {\n        heavyLeft.append(item.name.uppercased())\n    }\n}\nvar allPacked = true\nfor item in items where !item.packed { allPacked = false }","key":"let heavyLeft = items\n    .filter { !$0.packed && $0.grams >= 500 }\n    .map { $0.name.uppercased() }\nlet allPacked = items.allSatisfy { $0.packed }\nprint(heavyLeft, allPacked)\n\nfilter отвечает «какие вещи оставить», map — «что показать». Сначала фильтр, потом map: заглавные строки строим только для нужных вещей. allSatisfy даёт true, только если условие верно для всех элементов, а на пустом списке — true: упаковывать нечего. Вывод: [\"БОТИНКИ\"] false.","check":{"accept":["let heavyLeft = items\n    .filter { !$0.packed }\n    .filter { $0.grams >= 500 }\n    .map { $0.name.uppercased() }\nlet allPacked = !items.contains { !$0.packed }","let heavyLeft = items\n    .filter { $0.grams >= 500 && !$0.packed }\n    .map { $0.name.uppercased() }\nlet allPacked = items.allSatisfy { $0.packed }","let heavyLeft = items.compactMap { !$0.packed && $0.grams >= 500 ? $0.name.uppercased() : nil }\nlet allPacked = items.filter { !$0.packed }.isEmpty"],"must":[{"pat":["filter { ... grams >= 500 ... }"],"miss":"Не вижу условия «тяжёлая»: вес 500 г и больше. Его нужно выразить в filter, а не в цикле."},{"pat":["filter { ... ! ... packed ... }","filter { ... packed == false ... }","filter { ... packed ... == false ... }"],"miss":"В filter нет условия «ещё не упаковано». Нужны именно неупакованные вещи, то есть packed со значением false."},{"pat":["map { ... uppercased() ... }","compactMap { ... uppercased() ... }"],"miss":"Не вижу преобразования имени в заглавные буквы через map: после filter его нужно применить к оставшимся вещам."},{"pat":["allSatisfy { ... packed ... }","allSatisfy(\\.packed)","! $a.contains { ... ! ... packed ... }","! $a.contains(where: { ... ! ... packed ... })","$a.contains { ... ! ... packed ... } == false","$a.filter { ... ! ... packed ... }.isEmpty"],"miss":"Для allPacked нужно условие «у всех вещей packed». Подходит allSatisfy; ручной цикл с флагом больше не нужен."}],"not":[{"pat":["grams > 500","grams < 500","grams <= 500"],"msg":"Граница веса сломана: тяжёлой считается вещь от 500 г включительно, то есть >= 500. Проверь знак сравнения."},{"pat":["allSatisfy { ! ... packed ... }"],"msg":"allSatisfy с отрицанием проверяет, что ни одна вещь не упакована. Нужно обратное: каждая вещь packed."}],"complete":true}},{"id":"hof-b2","kind":"predict","type":"Предскажи вывод","title":"Ближайшая аптека","prompt":"Что напечатают четыре строки? Почему вторая и третья строки отвечают на разные вопросы?","code":"struct Pharmacy {\n    let name: String\n    let meters: Int\n    let isOpen: Bool\n}\nlet list = [Pharmacy(name: \"Вита\", meters: 900, isOpen: true),\n            Pharmacy(name: \"Здоровье\", meters: 300, isOpen: false),\n            Pharmacy(name: \"Ригла\", meters: 450, isOpen: true)]\nlet nearest = list.min { $0.meters < $1.meters }\nlet nearestOpen = list.filter { $0.isOpen }.min { $0.meters < $1.meters }\nlet firstOpen = list.first { $0.isOpen }\nlet nextDoor = list.filter { $0.meters < 100 }.min { $0.meters < $1.meters }\nprint(nearest?.name ?? \"—\")\nprint(nearestOpen?.name ?? \"—\")\nprint(firstOpen?.name ?? \"—\")\nprint(nextDoor?.name ?? \"—\")","key":"Здоровье\nРигла\nВита\n—\n\nmin(by:) ищет наименьший элемент по правилу сравнения: ближе всех «Здоровье», хотя она закрыта. Сначала filter открытых, потом min — «Ригла». first(where:) берёт первую подходящую в порядке массива, а не ближайшую — «Вита». После пустого фильтра min возвращает nil, и ?? показывает «—». Все три функции возвращают Optional: подходящего элемента может не быть.","check":{"outs":[["Здоровье","Ригла","Вита","—"]],"why":["min по meters берёт ближайшую из всех: «Здоровье» (300 м), хотя она закрыта — isOpen тут не учитывается.","Сначала filter оставляет открытые «Вита» и «Ригла», затем min выбирает ближайшую из них: «Ригла» (450 м).","first(where:) возвращает первую открытую по порядку массива, а не ближайшую: это «Вита».","Фильтр meters < 100 никого не пропускает, min пустой коллекции даёт nil, и ?? подставляет «—»."],"wrong":[{"out":["Ригла","Ригла","Вита","—"],"msg":"Первая строка не учитывает isOpen: min по meters выбирает ближайшую среди всех, даже закрытую. Закрытая «Здоровье» ближе всех."},{"out":["Здоровье","Ригла","Ригла","—"],"msg":"first(where:) не ищет ближайшую: он берёт первый подходящий элемент по порядку массива. Первая открытая в списке — «Вита»."},{"out":["Здоровье","Ригла","Вита","nil"],"msg":"Здесь ?? подставляет «—»: min пустой коллекции возвращает nil, а не печатается как «nil». Строка заменяется запасным значением."}]}},{"id":"hof-b3","kind":"oral","type":"Устно","title":"map и flatMap в плеере","prompt":"Объясни как на собеседовании разницу между map и flatMap: что вернёт каждая строка, какой у неё тип и когда нужен flatMap.","code":"let albums = [[\"Intro\", \"Rain\"], [\"Sun\"]]\n// a) albums.map { $0.map { $0.uppercased() } }\n// b) albums.flatMap { $0 }\n// c) Array(albums.joined())\nlet raw: String? = \"42\"\n// d) raw.map { Int($0) }\n// e) raw.flatMap { Int($0) }","key":"map превращает каждый элемент в одно значение и сохраняет форму: a) [[\"INTRO\", \"RAIN\"], [\"SUN\"]] — по-прежнему массив альбомов. flatMap ждёт от замыкания коллекцию и склеивает результаты в один уровень: b) [\"Intro\", \"Rain\", \"Sun\"]. c) даёт то же: flatMap — это map плюс «расплющить», а joined() расплющивает уже готовые вложенные массивы. У Optional то же правило: d) замыкание возвращает Int?, и map заворачивает его ещё раз — Int?? (Optional(Optional(42))); e) flatMap не добавляет второй слой — Int? со значением 42. Убрать nil из массива — уже задача compactMap, а не flatMap.","check":{"concepts":[{"label":"map сохраняет вложенность","groups":[["map"],["сохраня","остаётся","остается","по-прежнему","вложенн","двумерн","не расплющ","не склеив","тот же уровень","форму"]],"miss":"Не сказано, что map сохраняет форму: для вложенных массивов результат тоже вложенный, просто внутри строки заглавные."},{"label":"flatMap склеивает в один уровень","groups":[["flatmap","flat map","флатмап","флэтмап"],["склеив","расплющ","один уровень","одномерн","плоск","объединя","сглажива","в один массив","одним массив","спрямля"]],"miss":"Не объяснено, что flatMap склеивает вложенные результаты в один уровень: из массива массивов получается плоский массив строк."},{"label":"map на Optional даёт Int?? (двойной Optional)","groups":[["int??","optional(optional","двойн","два слоя","два уровня","вложенный optional","optional в optional","опционал в опционал","optional<optional"]],"miss":"Для Optional не сказано про случай d): замыкание возвращает Int?, и map заворачивает его ещё раз, получается Int??."},{"label":"flatMap на Optional даёт один слой Int?","groups":[["flatmap","flat map","флатмап"],["int?","один слой","одного слоя","не оборач","не добавля","одинарн","просто optional","плоск","не удваива"]],"miss":"Не сказано про случай e): flatMap не добавляет второй слой Optional, получается обычный Int? со значением 42."},{"label":"joined() даёт то же, что flatMap { $0 }","groups":[["joined"],["то же","тот же","аналог","также","расплющ","склеив","эквивалент","равн","одинаков","тоже"]],"miss":"Не упомянута строка c): joined() расплющивает уже готовые вложенные массивы и даёт тот же результат, что flatMap."}],"false":[{"groups":[["flatmap убира","flatmap удаля","flatmap выбрас","flatmap отбрас","flatmap фильтр","flatmap отсева"]],"msg":"Убирать nil из массива — работа compactMap, а не flatMap. flatMap склеивает вложенные уровни."},{"groups":[["map и flatmap одно","map и flatmap одинаков","map и flatmap делают одно","разницы нет","разницы почти нет"]],"msg":"Разница есть: map сохраняет вложенность результата, а flatMap после преобразования склеивает его в один уровень."}]}},{"id":"opt.s1","kind":"predict","title":"Ступень 1. Предскажи вывод","prompt":"Не запуская код, запиши, что напечатает каждая строка, и какой тип у title. Почему пустая строка ведёт себя не так, как nil?","code":"let a: String? = nil\nlet b: String? = \"\"\nprint(a ?? \"Гость\")\nprint(b ?? \"Гость\")\nlet title = b ?? \"Гость\"\nprint(title.count)","key":"Гость\n(пустая строка)\n0\n\ntitle имеет тип String. ?? подставляет запасное значение только при nil. Пустая строка — существующее значение, поэтому она и остаётся.","check":{"outs":[["Гость","","0"]],"why":["a равно nil: ?? подставил запасное значение.","b — пустая строка, а не nil: ?? её не трогает, печатается nd":"code","title":"Ступень 6. Карточка профиля","prompt":"Верни «Имя · N символов». При nil или пустой строке — «Гость · 0». Используй optional chaining хотя бы раз и назови тип промежуточного результата.","code":"struct User { let name: String? }\n\nfunc cardTitle(for user: User) -> String {\n    // твой код\n}\n\n// nil    → \"Гость · 0\"\n// \"Нора\" → \"Нора · 4\"\n// \"\"     → \"Гость · 0\"","key":"func cardTitle(for user: User) -> String {\n    let count: Int? = user.name?.count\n    guard let name = user.name, !name.isEmpty else {\n        return \"Гость · 0\"\n    }\n    return \"\\(name) · \\(count ?? 0)\"\n}\n\nuser.name?.count — Int?: число, если имя есть, иначе nil. В реальном коде после guard проще взять name.count — chaining здесь для тренировки.","check":{"accept":["let count: Int? = user.name?.count\nlet name = user.name ?? \"\"\nif name.isEmpty {\n    return \"Гость · 0\"\n}\nreturn \"\\(name) · \\(count ?? 0)\"","let count: Int? = user.name?.count\nif let name = user.name, !name.isEmpty {\n    return \"\\(name) · \\(count ?? 0)\"\n}\nreturn \"Гость · 0\""],"must":[{"pat":["user.name?.$a"],"miss":"Не вижу optional chaining: по заданию нужно обратиться к свойству через ?. у user.name, чтобы при nil получить nil, а не падение."},{"pat":["Int?"],"miss":"Не назван тип промежуточного результата. Цепочка с ?. возвращает Optional: число или nil. Запиши тип явно."},{"pat":["\"Гость · 0\""],"miss":"Нет строки «Гость · 0» для nil и пустого имени. Формат важен дословно: слово, пробел, точка по центру, пробел, ноль."},{"pat":["\"\\($a) · \\($b ?? 0)\"","\"\\($a) · \\($a.count)\""],"miss":"Не вижу сборки «Имя · N» из имени и длины. Число должно быть развёрнуто (например, запасным значением), иначе в строку попадёт Optional."},{"pat":["isEmpty","!= \"\"","== \"\"","count > 0","count == 0","count != 0"],"miss":"Нет проверки пустой строки. Для \"\" цепочка ?. вернёт 0, а не nil: имя нужно проверить отдельно, чтобы показать «Гость»."}],"not":[{"pat":["user.name!",
